<script>
"use strict";

const reviewIntervals = [1, 3, 7, 14];
const studyStatuses = {
  all:"所有词",
  new:"未自查",
  learning:"待巩固",
  known:"已掌握",
  due:"今天到期"
};
const ratings = {again:"不认识", unsure:"有点模糊", remembered:"认识"};
let drill = null;
let lastAutoSound = "";

function studyDate(now = new Date()) {
  return Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) / 86400000;
}
function memoryStatus(word) {
  if (state.words[word]==="known") return "known";
  return state.memory[word] || (state.notes[word] && !state.notes[word].done) ? "learning" : "new";
}
function isDue(word, today = studyDate()) {
  const next = state.memory[word]?.next;
  if(next!==undefined)return next<=today;
  return Boolean(state.notes[word] && !state.notes[word].done && state.words[word]!=="known");
}
function studyPools(day, today = studyDate()) {
  const todayWords = day<=12 ? storyWords(day) : [];
  const current = todayWords.map(w=>w[0]);
  const saved = [...new Set([...Object.keys(state.memory),...Object.keys(state.notes)])].filter(w=>vocab.has(w));
  return {
    fresh:current.filter(w=>memoryStatus(w)==="new"),
    due:saved.filter(w=>isDue(w,today)).sort((a,b)=>(state.memory[a]?.next??today)-(state.memory[b]?.next??today) || (state.memory[a]?.level??0)-(state.memory[b]?.level??0)),
    weak:[...new Set([...saved,...current])].filter(w=>memoryStatus(w)==="learning")
      .sort((a,b)=>(state.memory[a]?.last??0)-(state.memory[b]?.last??0)),
    all:current,
    spell:[...new Set([...current.filter(key=>state.spellMarks[key]?.lastWrongDay && state.spellMarks[key]?.needsPractice),...Object.keys(state.spellMarks).filter(key=>state.spellMarks[key].needsPractice)])],
    known:current.filter(w=>memoryStatus(w)==="known")
  };
}
function matchesMemory(word, mode) {
  if(mode==="all") return true;
  if(mode==="due") return isDue(word);
  return memoryStatus(word)===mode;
}
function recordRecall(word, rating, today = studyDate()) {
  const prior=state.memory[word]||{level:state.words[word]==="known"?3:0};
  let level=prior.level;
  let successful=prior.successful ?? null;
  if(rating==="again") {level=0;successful=null;}
  if(rating==="unsure") {level=Math.max(0,level-1);successful=null;}
  const advance=rating==="remembered" && successful!==today && (prior.next===undefined || today>=prior.next || successful===null);
  if(advance) {level=Math.min(4,level+1);successful=today;}
  const next=rating==="remembered"
    ? (advance ? today+reviewIntervals[Math.max(0,level-1)] : prior.next)
    : today+1;
  state.memory[word]={level, next, successful, last:today};
  state.words[word]=level>=3?"known":"new";
  if(rating==="again")addNote(word);
  if(level>=3 && state.notes[word])state.notes[word].done=true;
  save();
}
function scheduleQuizMiss(word, today = studyDate(), delay = 1) {
  if(!vocab.has(word))return;
  const previous=state.memory[word];
  state.memory[word]={level:0,next:Math.min(previous?.next??today+delay,today+delay),successful:null,last:previous?.last??null};
  state.words[word]="new";

function toggleMastery(word, today = studyDate()) {
  const known=memoryStatus(word)!=="known";
  state.words[word]=known?"known":"new";
  const level=known?3:1;
  state.memory[word]={level,next:today+(known?7:1),successful:known?today:null,last:today};
  save();
}
function shuffled(items) {
  const order=[...items];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  return order;
}
function restoredDrill(saved) {
  return saved?{...saved,repeats:new Set(saved.repeats),checkedSpelling:new Set(saved.checkedSpelling),first:new Set(saved.first)}:null;
}
function resumeDrill(day){
  const daily=state.drillSessions[day];
  drill=restoredDrill(daily?.sessions[daily.active]);
}
function saveDrill(){
  if(!drill)return;
  const day=drill.day;
  const daily=state.drillSessions[day] ||= {active:null,sessions:{}};
  daily.active=drill.mode;
  daily.sessions[drill.mode]={...drill,repeats:[...drill.repeats],checkedSpelling:[...drill.checkedSpelling],first:[...drill.first]};

}
function pauseDrill(){

  state.drillSessions[drill.day].active=null;
  drill=null;
  save();
}
function reviewQueue(day) {

}
function startDrill(day,pool) {

function startSavedDrill(day, mode, words, storyPart=null, spellOnly=false) {

}
function beginDrill(words,storyPart=null,spellOnly=false,mode="practice",day=current) {
  if(!words?.length)return;
  const kind=spellOnly?"spell":"word";
  drill={day,mode,id:Date.now()+"-"+Math.random(),step:0,draft:"",queue:shuffled(words).map(word=>({word,kind})),storyPart,repeats:new Set(),checkedSpelling:new Set(),first:new Set(),revealed:false,answer:null,totals:{again:0,unsure:0,remembered:0},misses:{},spellMisses:{},spellRight:0,spellWrong:0};

function activeDrillWord() {return drill?.queue[0]?.word;}

    drill.queue.splice(Math.min(2,drill.queue.length),0,{word,kind:"spell"});
    drill.checkedSpelling.add(word);
  }
  if(drill.repeats.delete(word))drill.queue.push({word,kind,repeat:true});

function rateDrill(rating) {
  const entry=drill?.queue[0];
  if(entry?.kind!=="word" || drill.answer || !Object.hasOwn(ratings,rating))return;
  const {word,repeat}=entry;
  if(!drill.first.has(word)){
    drill.first.add(word);
    drill.totals[rating]++;
    state.recallMarks[word]={day:current,rating};
    if(rating!=="remembered")drill.misses[word]=rating;
  }
  recordRecall(word,rating);
  drill.revealed=true;
  drill.answer=rating;
  if(rating!=="remembered" && !repeat)drill.repeats.add(word);

  const clean=answer.trim().toLowerCase();
  return clean===word || clean===alternateSpellings[word];
}
function checkDrillSpelling(answer) {
  const entry=drill?.queue[0];

  const {word,repeat}=entry;
  const given=answer.trim();
  const correct=spellingIsCorrect(word,given);
  const prior=state.spellMarks[word]||{};
  state.spellMarks[word]={...prior,needsPractice:!correct,lastDay:current,lastAnswer:given};

function markTask(id,form) {
  const task=taskById(id);
  if(!task)return false;
  const answers=task[4].map(([,key],i)=>String(form.get("a"+i)??"").normalize("NFKC").toUpperCase().replace(/[\s，,]/g,""));
  if(task[4].some(([start,key],i)=>answers[i].length!==key.length || !(start<26 || start>=46?/^[A-D-]+$/:/^[A-O-]+$/).test(answers[i]))){
    toast("按题数填写字母，空题用 - 占位。听力和仔细阅读只用 A–D。");
    return false;
  }
  const wrong=[];
  const scores=task[4].map(([start,key],i)=>Array.from(key).reduce((score,letter,j)=>{
    const chosen=answers[i][j];
    if(letter===chosen)return score+1;
    wrong.push([start+j,chosen,letter]);
    return score;
  },0));
  const clock=state.realTimers[id];
  const elapsed=clock?(clock.stopped??Date.now())-clock.start:null;
  const seconds=elapsed===null?null:Math.max(0,Math.round(elapsed/1000));
  state.realRuns[id]={answers,scores,wrong,seconds,overtime:elapsed!==null&&elapsed>task[3]*60000};
  task[4].forEach((_,i)=>delete state.blockDrafts[id+":"+i]);
  if(clock && clock.stopped==null)clock.stopped=Date.now();
  save();
  return true;
}
function startRealTimer(id) {

}
function stopRealTimer(id) {

function tickReal() {

function route(view,day=null, push=true) {
  if (view==="day" || view==="mock") {
    let target = day ?? (view==="mock"?Math.max(13,state.day):Math.min(12,state.day));
    target = Math.min(18,Math.max(1,Number(target)||1));
    current=target; page=target<13?"day":"mock"; state.day=target; save();
  } else page=view;
  filter="全部"; memoryFilter="all"; quizRetry=false;
  if(page==="day"||page==="mock")resumeDrill(current);else drill=null;
  if(push) history.pushState(null,"",page==="day"||page==="mock"?"#day-"+current:"#"+page);
  render(); window.scrollTo(0,0);
}
function restore() {
  const hash=location.hash.slice(1);
  if (/^day-(\d+)$/.test(hash)) route("day",Number(hash.slice(4)),false);
  else if (["plan","errors","sources","diagnostic"].includes(hash)) route(hash,null,false);
  else if(["schedule",""].includes(hash)) { page="plan";render(); }
  else if(["today-true","learning-read","story","memory","new","review","translation","grammar","transfer","quiz","daily-coach","duration"].includes(hash)){
    route("day",Math.min(state.day,12),false);
    $(hash==="transfer"?"#today-true":"#"+hash)?.scrollIntoView();

}

  if(!text?.trim())return toast("本部分还没有可以复制的作答。");
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制本部分。粘贴回六级冲刺聊天即可。");
  } catch {
    const dialog=document.createElement("dialog");
    dialog.className="copy-popup";
    dialog.innerHTML='<div class="line-up"><strong>复制本部分作答</strong><button class="outline" type="button">关闭</button></div><p class="meta">长按下框文字，选「全选」和「复制」，然后粘贴回聊天。</p><textarea readonly aria-label="本部分作答"></textarea>';
    dialog.querySelector("textarea").value=text;
    dialog.querySelector("button").addEventListener("click",()=>dialog.close());
    dialog.addEventListener("close",()=>dialog.remove(),{once:true});
    document.body.append(dialog);
    if(dialog.showModal)dialog.showModal();else dialog.open=true;
    const field=dialog.querySelector("textarea");
    field.focus();field.select();
  }
}
function copyAction(kind) {
  if(kind==="report")return copy(dailyReport(current));
  if(kind.startsWith("exercise:"))return copy(exerciseReport(kind.split(":")[1],current));
  if(kind.startsWith("real:"))return copy(realSectionReport(kind.split(":")[1]));
  if(kind.startsWith("drill:"))return copy(drillReport(current,kind.split(":")[1]));
  if(kind==="mock-writing"){
    const draft=state.drafts.w17?.trim();
    if(!draft)return toast("先写好作文再复制。");
    return copy(["第 17 天｜2026 年 6 月第 1 套 · Part I 写作","题目 "+examLink(17,"?layout=long"+textFragment("Part I Writing")),"我的作文",draft,"请按六级 15 分档评分，指出审题、结构和语言问题。"].join("\n"));
  }
  if(kind==="notes")return copy(Object.entries(state.notes).map(([w,v])=>w+"｜"+(v.sense||vocab.get(w)?.[3]||"")).join("\n"));
  if(kind==="daily-translation")return copy("第 "+current+" 天｜请按六级翻译要求批改句子，指出主干、漏译和搭配。\n中文："+LESSONS[current-1].pattern[4]+"\n我的译文："+(state.drafts["d"+current]||""));
  if(kind==="mock-translation")return copy("第 "+current+" 天 · "+plans[current-13][1]+" · "+plans[current-13][3]+"。请根据该真题的中文原文，按六级标准总评 0–15 分，标出漏译、误译和语言错误，逐句改正。\n真题："+examLink(current,"?layout=step&practice=translation")+"\n我的译文："+(state.drafts["m"+current]||""));
  if(kind==="mock"){
    const data=state.mocks[current];
    return copy("请批改六级阅读 "+plans[current-13][1]+"，逐题给证据位置、同义改写和错因；整理新词。\n试卷："+examLink(current)+"\n26–55 题答案："+data.answers+"\n用时 "+(data.seconds==null?"未记录":mmss(data.seconds*1000))+"\n"+data.wrong.map((v,i)=>[v.number,v.chosen+"→"+v.correct,data.causes[i]||"",data.evidence[i]||""].join("｜")).join("\n"));
  }
  const t=state.tests[current];
  if(!t)return;
  return copy(["第 "+current+" 天｜10 题小测 "+t.score+"/10",...t.questions.map((q,i)=>(i+1)+". "+q.prompt+"｜我的答案 "+letters[t.answers[i]]+" "+q.choices[t.answers[i]]+"｜正确 "+letters[q.correct]+" "+q.choices[q.correct]+"｜"+q.note),"请根据我的答案逐题纠正。"].join("\n"));
}
document.addEventListener("click",e=>{
  const sectionLink=e.target.closest(".jump a");
  if(sectionLink){
    e.preventDefault();
    const target=sectionLink.getAttribute("href");
    $(target)?.scrollIntoView();
    if(target==="#memory"&&drill?.mode!=="previous" || target==="#review"&&drill?.mode==="previous")autoPronounceDrill();
    return;
  }
  const b=e.target.closest("button");
  if(!e.target.closest(".lookup-bubble") && !b?.dataset.define)closeWordLookup();
  if (!b) return;
  const d=b.dataset;
  if(d.define)return openWordLookup(b);
  if(d.closeLookup!==undefined)return closeWordLookup();
  if(d.view) return route(d.view);
  if(d.day) return route("day",d.day);
  if(d.speak) return speak(b);
  if(d.storyWord)return openStoryWord(d.storyWord);
  if(d.closeStory!==undefined){
    const popup=$("#story-popup");
    if(popup.close)popup.close();else popup.removeAttribute("open");
    return;
  }
  if(d.storyNext!==undefined)return revealStoryPart(Number(d.storyNext));
  if(d.storyDrill!==undefined){
    const index=Number(d.storyDrill);
    const chapter=MINI_STORIES[current-1][index];
    startSavedDrill(current,"story-"+index,chapter[2],index);refreshStudy();
    $("#memory").scrollIntoView();
    focusDrill();
    return;
  }
  if(d.readDraft) {
    if(!state.drafts[d.readDraft]?.trim()) return toast("请先输入译文。");
    b.dataset.speak=state.drafts[d.readDraft];speak(b);delete b.dataset.speak;return;
  }
  if(d.filter) {
    filter=d.filter;
    refreshVocab();
    document.querySelectorAll("[data-filter]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.filter===filter)));
  }
  if(d.known) {
    toggleMastery(d.known);
    refreshWordProgress(d.known);
  }
  if(d.note && addNote(d.note)) {
    scheduleQuizMiss(d.note,studyDate(),0);save();refreshWordProgress(d.note);toast("已加入错词本和复习队列。");
  }
  if(d.studyPool) {
    startDrill(current,d.studyPool);refreshStudy();focusDrill();
    return;
  }
  if(d.recall==="reveal" && activeDrillWord()) {
    drill.revealed=true;saveDrill();refreshStudy();focusDrill();
    return;
  }
  if(d.recall==="next" && drill?.answer) {
    finishDrillCard();refreshStudy();focusDrill();
    return;
  }
  if(d.recall==="skip-spelling" && checkDrillSpelling("")) {
    refreshWordProgress(activeDrillWord());focusDrill();
    return;
  }
  if(d.recallRate) {
    const word=activeDrillWord();
    if(word){rateDrill(d.recallRate);refreshWordProgress(word);focusDrill();}
    return;
  }
  if(d.resumeActive!==undefined){
    $(drill?.mode==="previous"?"#review":"#memory")?.scrollIntoView();
    focusDrill();return;
  }
  if(d.pauseDrill!==undefined){pauseDrill();refreshStudy();return;}
  if(d.toggleAuto!==undefined){
    state.autoPronounce=state.autoPronounce===false;lastAutoSound="";save();refreshStudy();focusDrill();return;
  }
  if(d.readingStart!==undefined){
    const key=exerciseKey("learning",current);
    if(state.exerciseRuns[key])return toast("要重新计时，先点「再做一遍」。");
    if(!state.exerciseTimers[key]){state.exerciseTimers[key]=Date.now();save();}
    tickDailyReading();return;
  }
  if(d.retryExercise){
    const key=exerciseKey(d.retryExercise,current);
    delete state.exerciseRuns[key];delete state.exerciseTimers[key];delete state.exerciseDrafts[key];
    save();refreshExercise(d.retryExercise,current);return;
  }
  if(d.realStart)return startRealTimer(d.realStart);
  if(d.realStop)return stopRealTimer(d.realStop);
  if(d.action==="integrated-start"){
    if(state.integrated && !state.integrated.stopped && Date.now()-state.integrated.start<130*60000)return toast("整卷正在计时。");
    state.integrated={start:Date.now(),stopped:null};save();tickIntegrated();return;
  }
  if(d.action==="integrated-stop"){
    if(state.integrated && !state.integrated.stopped){state.integrated.stopped=Date.now();save();tickIntegrated();}
    return;
  }
  if(d.showMemory) {
    memoryFilter=d.showMemory;filter="全部";
    $("#word-catalog").open=true;$("#memory-filter").value=memoryFilter;refreshVocab();
    document.querySelectorAll("[data-filter]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.filter===filter)));
    $("#new").scrollIntoView();
  }
  if(d.recover) {
    state.notes[d.recover].done=!state.notes[d.recover].done;save();render();
  }
  if(d.copy) return copyAction(d.copy);
  if(d.mockAudio!==undefined) {
    const speech=state.mocks[current].evidence[d.mockAudio];
    if(speech?.trim()) { b.dataset.speak=speech; speak(b);delete b.dataset.speak; }
    else toast("请先写下证据句。");
  }
  if(d.action==="retry") { quizRetry=true;$("#quiz-content").outerHTML=quiz(current);$("#quiz").scrollIntoView(); }
  if(d.action==="start") {
    if(state.timer?.day===current && !state.timer.stopped && state.timer.end>Date.now()) return toast("本套正在计时。");
    const started=Date.now();state.timer={day:current,started,end:started+2400000};save();tick();
  }
  if(d.action==="stop") {
    if(state.timer?.day===current) {state.timer.stopped=Date.now();save();tick();}
  }
  if(d.action==="complete-final") {state.placed[18]=true;save();b.textContent="已完成考前复盘";}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="day-select") route("day",el.value);
  if(el.id==="rate") speed=Number(el.value);
  if(el.id==="memory-filter"){memoryFilter=el.value;refreshVocab();}
  if(el.id==="example-mode"){state.exampleMode=el.value;save();refreshVocab();refreshStudy();}
  if(el.dataset.mockCause!==undefined) {state.mocks[current].causes[el.dataset.mockCause]=el.value;save();}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.form?.id==="spell-form" && drill){drill.draft=el.value;saveDrill();}
  const kind=el.form?.dataset.exercise;
  if(kind && el.name?.startsWith("p")){
    const key=exerciseKey(kind,current);
    (state.exerciseDrafts[key] ||= [])[Number(el.name.slice(1))]=Number(el.value);
    save();
  }
  if(el.dataset.answerDraft) {state.blockDrafts[el.dataset.answerDraft]=el.value;save();}
  if(el.dataset.draft) {state.drafts[el.dataset.draft]=el.value;save();}
  if(el.dataset.mockEvidence!==undefined) {state.mocks[current].evidence[el.dataset.mockEvidence]=el.value;save();}
});
document.addEventListener("submit",e=>{
  const f=e.target,d=new FormData(f);
  e.preventDefault();
  if(f.id==="spell-form"){
    const answer=d.get("spelling")?.trim();
    if(!answer)return toast("请输入拼写，或选「想不起来」。");
    if(checkDrillSpelling(answer)){refreshWordProgress(activeDrillWord());focusDrill();}
    return;
  }
  const exercise=f.dataset?.exercise;
  if(exercise){
    if(markExercise(exercise,current,d))refreshExercise(exercise,current);
    return;
  }
  const realId=f.dataset?.realForm;
  if(realId){
    if(markTask(realId,d)){
      $("#real-result-"+realId).innerHTML=taskResult(realId);
      if(realId==="baseline")$("#diagnostic-feedback").innerHTML=diagnosticFeedback();
      tickReal();
      $("#real-result-"+realId).scrollIntoView({block:"nearest"});
    }
    return;
  }
  if(f.id==="quiz-form") {
    const qs=quizQuestions(current);
    const answers=qs.map((q,i)=>d.get("q"+i)===null?-1:Number(d.get("q"+i)));
    if(answers.includes(-1))return toast("请完成 10 道题再交卷。");
    let score=0;
    qs.forEach((q,i)=>{
      if(q.correct===answers[i])score++;
      else if(q.word){addNote(q.word);scheduleQuizMiss(q.word);}
    });
    state.tests[current]={answers,score,questions:qs};save();quizRetry=false;
    $("#quiz-content").outerHTML=quiz(current);$("#quiz").scrollIntoView();
    refreshVocab();refreshStudy();$("#nav-errors").textContent=noteCount()?" · "+noteCount():"";
  }
  if(f.id==="mock-form") {
    const matrix=[0,1,2].map(i=>d.get("m"+i).toUpperCase().replace(/[\s，,]/g,""));
    if(matrix.some((s,i)=>!(i===2?/^[A-D-]{10}$/:/^[A-O-]{10}$/).test(s)))return toast("每组需要恰好 10 个字母，仔细阅读只用 A–D，空题填 -。");
    const key=plans[current-13][4];
    if(key.length!==30)return toast("本卷部分答案请先在真题库核对。");
    const answers=matrix.join(""),scores=[0,0,0],wrong=[];
    [...key].forEach((correct,i)=>{
      const group=Math.floor(i/10),chosen=answers[i];
      if(correct===chosen)scores[group]++;else wrong.push({number:26+i,chosen,correct,group});
    });
    const old=state.mocks[current],causes={},evidence={};
    wrong.forEach((w,i)=>{
      const j=old?.wrong.findIndex(oldw=>oldw.number===w.number)??-1;
      if(j>=0){causes[i]=old.causes[j];evidence[i]=old.evidence[j];}
    });
    const timer=state.timer?.day===current?state.timer:null;
    const seconds=timer?Math.max(0,Math.round(((timer.stopped??Date.now())-(timer.started??timer.end-2400000))/1000)):null;
    if(timer)timer.stopped??=Date.now();
    state.mocks[current]={answers,scores,wrong,causes,evidence,seconds};save();tick();
    $("#mock-result").innerHTML=mockResult(current);$("#mock-result").scrollIntoView();
  }
  if(f.id==="note-form" && addNote(d.get("word"),d.get("sense"))) {
    const word=d.get("word").trim().toLowerCase();
    scheduleQuizMiss(word,studyDate(),0);save();
    f.reset(); if(page==="errors"||current===18) render(); else refreshWordProgress(word);toast("已加入错词本。");
  }
});
window.addEventListener("popstate",restore);
window.addEventListener("hashchange",()=>{if(/^#(?:day-\d+|plan|errors|sources|diagnostic)$/.test(location.hash))restore();});
window.speechSynthesis?.getVoices();
restore();
setInterval(tick,500);

</script>
