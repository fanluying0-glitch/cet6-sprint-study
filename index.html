ːt","v.","促成；贡献","Peer support can contribute to a more productive learning environment.","attribute 强调归因，contribute to 强调促成。",0,"同伴的支持有助于营造更高效的学习环境。","One leaky tap contributes to our enormous water bill.","水费那么高，漏水的龙头也有一份功劳。","contributes"],["result","rɪˈzʌlt","n./v.","结果；导致（result in）","Repeated criticism can result in a loss of confidence.","result in 接结果，result from 接原因。",0,"一再受到批评可能让人失去信心。","Shorter meetings resulted in fewer people pretending to check email.","会一开短，装着在查邮件的人也少了。","resulted in"],["approach","əˈprəʊtʃ","n./v.","方法；接近","The company adopted an approach that gave staff time to practice.","access 指进入或使用的机会，approach 可表示处理问题的方法。",0,"这家公司采用了一种给员工留出练习时间的方法。","Using his laptop was an interesting approach to anonymity.","用老板自己的电脑做匿名调查，这办法挺有意思。","approach"],["adopt","əˈdɒpt","v.","采用；收养","Several firms have adopted simulation as part of staff training.","adapt 表示适应、改编，adopt 表示采用。",0,"已有几家公司将模拟练习纳入员工培训。","The group adopted my idea after my boss repeated it.","老板把我的主意复述一遍，全组就采纳了。","adopted"],["adapt","əˈdæpt","v.","适应；改编","New employees adapt more quickly when expectations are clear.","adopt 表示采纳，adapt to 表示适应。",0,"当要求明确时，新员工能更快适应。","I adapted to office life by learning to eat lunch at my desk.","我学会了在工位吃午饭，也算适应了办公室生活。","adapted"],["respond","rɪˈspɒnd","v.","回应；作出反应","Participants were asked to respond to a simulated complaint.","reply 多指口头或书面答复，respond 也可表示反应。",0,"参与者被要求对一项模拟投诉作出回应。","Nobody knew how to respond when my drawing appeared overhead.","我的画一上大屏，谁也不知道该怎么接话。","respond"],["involve","ɪnˈvɒlv","v.","涉及；使参与","The exercise involves solving a problem with incomplete information.","include 关注包含，involve 常强调必然涉及或参与。",0,"这项练习要求在信息不全的情况下解决问题。","Being anonymous apparently involved typing on the boss's laptop.","所谓匿名，居然是指在老板的电脑上打字。","involved"],["require","rɪˈkwaɪə","v.","要求；需要","The program requires participants to offer each other specific feedback.","request 是请求，require 可指硬性要求。",0,"这项计划要求参与者互相给出具体反馈。","We were required to name one genuinely awful office habit.","我们必须指出一个办公室里真正讨人嫌的习惯。","required"],["conduct","kənˈdʌkt / ˈkɒndʌkt","v./n.","开展；行为","The team conducted a survey before revising the course.","convince 指说服；conduct research 指开展研究。",0,"团队在修改课程前进行了一项调查。","Our boss conducted an anonymous survey. My name was on slide two.","老板搞了一次匿名调查。我的名字就在第二张幻灯片上。","conducted"],["assess","əˈses","v.","评估；估算","Researchers assessed whether the gains lasted beyond the first month.","access 表示进入或获取，assess 表示评估。",0,"研究人员评估了这些进步在第一个月以后是否还能维持。","Please assess the damage before Mum gets home.","趁妈还没回家，先看看东西摔坏了多少。","assess"],["identify","aɪˈdentɪfaɪ","v.","识别；确定","The exercise helped employees identify the source of a recurring problem.","identity 是身份，identify 是识别。",0,"这项练习帮助员工找到了一个反复出现的问题的根源。","We identified the worst offender: the meeting about reducing meetings.","我们找到了罪魁祸首：那场讨论如何减少会议的会议。","identified"],["establish","ɪˈstæblɪʃ","v.","建立；证实","The study could not establish a link between confidence and accuracy.","found 偏创办，establish 也可指证实关系。",0,"这项研究未能证实信心与准确性之间存在联系。","We established one thing: the kettle had a point.","有一件事算是证实了：热水壶说得有道理。","established"],["outcome","ˈaʊtkʌm","n.","结果；成效","Cooperation was associated with a better learning outcome.","output 指产出量或产出物，outcome 指最终结果。",0,"合作与更好的学习成效有关。","The outcome surprised us: Monday's meeting ended on Monday.","结果出乎意料：周一的会居然在周一开完了。","outcome"],["underlying","ˌʌndəˈlaɪɪŋ","adj.","潜在的；根本的","The underlying problem was a shortage of useful feedback.","underlined 指加了下划线的。",0,"根本问题在于缺少有用的反馈。","The underlying cause of our money problems was the delivery app.","我们钱不够花，根源在那个外卖软件。","underlying"],["effective","ɪˈfektɪv","adj.","有效的；生效的","The most effective exercises were short and repeated regularly.","efficient 强调省时省力，effective 强调达到目标。",0,"最有效的练习用时短，而且会定期重复。","It was effective. He got to the point before it rang.","还真有效。铃没响，他就说到正题了。","effective"],["significant","sɪɡˈnɪfɪkənt","adj.","显著的；重要的","The researchers found a significant improvement in decision-making.","substantial 偏程度或数量大，significant 也可表 ask after reviewing students' responses.","moderate 常指使缓和或适度，modify 泛指修改。",1,"教师查看学生的回答后，对任务作了调整。","He modified it by adding two minutes for apologies.","他又改了一处，留出两分钟专门道歉。","modified"],["overcome","ˌəʊvəˈkʌm","v.","克服；战胜","Mentoring can help students overcome the fear of speaking up.","overtake 指赶超，overcome 指克服障碍。",1,"导师指导可以帮助学生克服开口表达的恐惧。","I'd overcome my fear of speaking up in meetings.","开会不敢说话这关，我算是过了。","overcome"],["competence","ˈkɒmpətəns","n.","能力；胜任","Formal qualifications do not always reflect professional competence.","competition 是竞争，competence 是能力。",1,"正式资质并不总能反映实际的专业能力。","I still doubted his competence with the projector.","不过他操作投影仪的本事，我还是不太放心。","competence"],["scenario","sɪˈnɑːriəʊ","n.","情景；设想","Participants practiced giving advice in a realistic workplace scenario.","scene 常指眼前场景或影视的一场戏，scenario 常指设定情境。",2,"参与者在贴近现实的职场情境中练习给出建议。","In what scenario does the kettle report to HR?","热水壶总不至于还得去人事部报到吧？","scenario"],["hesitate","ˈhezəteɪt","v.","犹豫；迟疑","Even experienced staff may hesitate to question a popular proposal.","resist 表示抵抗，hesitate 表示迟疑。",2,"即使是经验丰富的员工，也可能犹豫要不要质疑一项广受支持的提议。","I hesitated. Grandma had already ordered for me.","我犹豫了一下，奶奶已经替我点好了。","hesitated"],["reflect","rɪˈflekt","v.","反映；反思（on）","The drop in complaints may reflect improved communication.","deflect 是使偏转，reflect on 是反思。",2,"投诉减少可能反映出沟通有所改善。","The rent doesn't reflect the view of a brick wall.","就窗外那面砖墙，真对不起这个房租。","reflect"],["reinforce","ˌriːɪnˈfɔːs","v.","加强；巩固","Short exercises reinforce concepts introduced during the workshop.","enforce 指执行或强制实施，reinforce 指强化。",2,"简短的练习可以巩固工作坊中介绍的概念。","But his first question reinforced the new rule: was five minutes enough?","好在他的第一个问题是「五分钟够吗」，又把新规强调了一遍。","reinforced"],["assumption","əˈsʌmpʃən","n.","假设；承担","The policy was based on the assumption that everyone had internet access.","presumption 偏推定，assumption 常指作为论证起点的假设。",2,"这项政策以人人都能上网为前提。","That assumption lasted until he handed them an actual biscuit.","这个误会一直持续到他真给他们掏出一块饼干。","assumption"],["skeptical","ˈskeptɪkəl","adj.","持怀疑态度的","Several managers remained skeptical about the reported benefits.","cynical 偏不信任他人动机，skeptical 偏质疑说法。",2,"几位管理者仍对所报告的好处持怀疑态度。","I'm skeptical of any meeting called a quick chat.","一听到「简单聊两句」，我就怀疑这会开不完。","skeptical"],["misinterpret","ˌmɪsɪnˈtɜːprət","v.","误解；错误解读","Readers can misinterpret a cautious finding as a firm conclusion.","mislead 是误导别人，misinterpret 是解读错。",2,"读者可能把一项措辞谨慎的研究发现误解为确定的结论。","Mum misinterpreted my silence as a yes.","我没说话，我妈就当我同意了。","misinterpreted"],["embrace","ɪmˈbreɪs","v.","欣然接受；拥抱","Employees were more willing to embrace the change after they had practised it.","accept 可是被动接受，embrace 常带积极接受的含义。",2,"员工亲自练习过新做法以后，更愿意接受这项变革。","The boss embraced the change and bought his plant a tiny pillow.","老板欣然接受了新规，还给他的盆栽买了个迷你枕头。","embraced"]],[["allocate","ˈæləkeɪt","v.","分配；划拨","Schools allocate more time to tasks they consider essential.","locate 指定位，allocate 指分配资源。",0,"学校把更多时间分配给它们认为必要的任务。","We persuaded the librarian to allocate twenty spare books to our experiment.","我们说服图书管理员拨出二十本闲置的书，给我们做实验。","allocate"],["access","ˈækses","n./v.","获取机会；访问","Many students lack access to a quiet place to study.","assess 指评估，access to 常指使用机会。",0,"许多学生没有安静的地方学习。","Most entrants barely had access to the old library, let alone a new one.","大部分参赛的人连旧图书馆都很难用上，更别说新阅览室了。","access"],["adequate","ˈædəkwət","adj.","足够的；合格的","Schools with adequate funding were better able to support new teachers.","abundant 强调丰富，adequate 仅表示够用。",0,"经费充足的学校更有能力为新教师提供支持。","Twenty books were adequate for opening day; we guessed nobody would notice us.","我们以为压根没人会留意我们，开张第一天有二十本书就够了。","adequate"],["alternative","ɔːlˈtɜːnətɪv","n./adj.","替代方案；可替代的","Online tutoring can provide an alternative for students in remote areas.","alternate 作动词常指交替，alternative 指可替代选择。",0,"对偏远地区的学生来说，在线辅导可以提供另一种选择。","The whole point was to find an alternative that worked for everyone.","我们要找的是一个人人都能用的办法。","alternative"],["benefit","ˈbenəfɪt","n./v.","好处；受益","Students benefit from repeated opportunities to explain their reasoning.","profit 常指利润，benefit 可指非金钱的好处。",0,"学生有机会反复解释自己的推理过程，并从中受益。","The judges asked who would benefit, and the entire bus queue raised a hand.","评委问谁能从中受益，等公交的那一长队人全举起了手。","benefit"],["capacity","kəˈpæsəti","n.","能力；容量","Training increased the institution's capacity to support struggling learners.","capability 偏做某事的能力，capacity 还指容量。",0,"培训提升了该机构为学习有困难的人提供支持的能力。","She tested the trolley’s capacity by piling on her favourite detective series.","她把最爱的一整套侦探小说摞上去，试试手推车到底能装多少书。","capacity"],["challenge","ˈtʃælɪndʒ","n./v.","挑战；质疑","Recent findings challenge a longstanding belief about homework.","difficulty 指困难，challenge 作动词可表示质疑。",0,"最新的研究发现对一种长期以来有关家庭作业的看法提出了质疑。","I wanted to challenge the judges, but my rival suggested collecting proof first.","我想去质疑评委，可我的竞争对手建议我先找证据。","challenge"],["concentrate","ˈkɒnsəntreɪt","v.","集中注意力；集中","Pupils concentrate better when frequent interruptions are removed.","focus 两者都可接 on，concentrate 也可指使聚集。",0,"排除频繁的干扰后，学生能更集中注意力。","I tried to concentrate while a judge asked to borrow the dictionary holding the wheel.","我努力集中注意力，有位评委却偏要借那本卡住车轮的字典。","concentrate"],["context","ˈkɒntekst","n.","语境；背景","The same expression can carry different meanings depending on context.","content 是内容，context 是理解内容所需的上下文。",0,"同一个表达在不同语境中可能传达不同的意思。","In context, the leaked answer sounded like a very expensive joke.","放在这些情况里看，泄露的答案像个成本很高的玩笑。","context"],["criterion","kraɪˈtɪriən","n.","标准；准则","Cost was only one criterion for selecting a suitable program.","criteria 是 criterion 的复数。",0,"费用只是选择合适项目的标准之一。","The main criterion seemed to be how much velvet you could afford.","看起来，主要的评选标准是你买得起多少天鹅绒。","criterion"],["decline","dɪˈklaɪn","v./n.","下降；婉拒","Participation began to decline after the course changed its schedule.","reject 偏明确拒绝，decline 可指婉拒或下降。",0,"课程调整时间安排后，参与人数开始下降。","When a teacher offered us a lift home, we had to decline.","有位老师说可以开车送我们回家，我们只好婉拒。","decline"],["enhance","ɪnˈhɑːns","v.","增强；改善","Regular discussion can enhance students' understanding of difficult ideas.","expand 指扩大范围或容量，enhance 指提高质量或效果。",0,"定期讨论可以加深学生对难懂概念的理解。","A smiling judge proposed curtains to enhance our little library’s appearance.","一位评委笑眯眯地建议挂些窗帘，让我们的小图书馆更好看。","enhance"],["equivalent","ɪˈkwɪvələnt","adj./n.","等同的；等价物","The online course offers training equivalent to one term of classroom instruction.","equal 偏数量或地位相等，equivalent 强调价值或功能相当。",0,"这门在线课程提供的培训相当于一学期的课堂教学。","A membership was equivalent to a week of my mum’s pay.","一张会员卡差不多等于我妈一周的工资。","equivalent"],["evaluate","ɪˈvæljueɪt","v.","评价；评估","Researchers evaluated the program one year after its introduction.","estimate 常指估算数量，evaluate 是评估价值或效果。",0,"项目推出一年后，研究人员对它进行了评估。","They agreed to evaluate the trolley downstairs, where the queue was already forming.","他们同意去楼下评估书车，那儿已经排起了借书的队伍。","evaluate"],["expand","ɪkˈspænd","v.","扩大；扩展","Universities expanded their mentoring services after the pilot program.","extend 也可指延长时间，expand 强调规模或范围变大。",0,"试点项目结束后，各所大学扩大了导师指导服务。","The librarian proposed a second trolley so we could expand to the other bus stop.","图书管理员建议再添一辆书车，这样我们还能把借书服务开到另一个公交站。","expand"],["exceed","ɪkˈsiːd","v.","超过","Enrollment began to exceed the number of places available.","succeed 是成功或继任，exceed 是超过界限。",0,"报名人数开始超过可提供的名额。","She said two trolleys still wouldn’t exceed the cost of one velvet chair.","她说，两辆手推车的钱加起来，也还不到一把天鹅绒椅子的价钱。","exceed"],["flexible","ˈfleksəbəl","adj.","灵活的；可弯曲的","Flexible deadlines may help students who have caring responsibilities.","adaptable 强调能适应变化，flexible 也可形容安排灵活。",0,"灵活的截止日期可能对需要照顾他人的学生有所帮助。","Our flexible hours simply meant staying until the last person boarded the bus.","我们所谓的灵活营业时间，就是留到最后一个人坐上公交。","flexible"],["incentive","ɪnˈsentɪv","n.","激励；奖励","The grant gave schools an incentive to share teaching materials.","initiative 是倡议或主动性，incentive 是激励因素。",0,"这笔拨款为学校分享教学材料提供了动力。","A full scholarship was the incentive for answering one question: how would you improve our school?","学校拿全额奖学金当奖励，让我们回答一个问题：你打算怎样改进我们的学校？","incentive"],["independent","ˌɪndɪˈpendənt","adj.","独立的；不受控制的","The program was reviewed by an independent group of researchers.","dependent 表示依赖的，dependable 表示可靠的。",0,"一个独立的研究团队审查了该项目。","We got an independent opinion from a cleaner who reads three novels a week.","一位每周读三本小说的保洁员给了我们一个独立意见。","independent"],["inequality","ˌɪnɪˈkwɒləti","n.","不平等；差距","Differences in school funding can deepen social inequality.","inequity 更强调不公平，inequality 亦可只指差距。",0,"学校经费的差异可能加剧社会不平等。","The inequality was clearest at four: some students had rides home, others had the last bus.","下午四点，不平等最明显：有的同学有人接，其他人只剩最后一班公交。","inequality"],["instruction","ɪnˈstrʌkʃən","n.","教学；指令","Students made more progress when instruction included frequent practice.","construction 是建造或结构，instruction 可指教学。",0,"教学中安排经常性的练习时，学生取得的进步更多。","Its first instruction was “Suggest a premium reading lounge.”","里面的第一条指令是：“建议学校建一间高级阅览室。”","instruction"],["knowledge","ˈnɒlɪdʒ","n.","知识；了解","Prior knowledge affects how easily readers follow the argument.","acknowledgment 是承认或致谢，knowledge 常不可数。",0,"已有知识会影响读者理解论证过程的难易程度。","Our librarian shared her knowledge of what students actually took home.","图书管理员告诉评委，她留意到学生真正借回家的都是什么书。","knowledge"],["method","ˈmeθəd","n.","方法；做法","The method helped researchers compare students across different schools.","methodology 偏方法体系，method 指具体方法。",0,"这种方法帮助研究人员比较来自不同学校的学生。","Her method was simple: borrow a book, write your name, bring it back.","她的办法很简单：借书，写名字，再把书还回来。","method"],["obtain","əbˈteɪn","v.","获得；取得","Participants had to obtain permission before recording the interviews.","attain 常接目标、水平，obtain 常接许可、信息等。",0,"参与者必须获得许可，才能对访谈进行录音。","Together we tried to obtain a library card before the bus left.","我们俩试着赶在公交开走之前办一张借书卡。","obtain"],["outweigh","ˌaʊtˈweɪ","v.","比……更重要；超过","For adults with jobs, the benefits of evening classes may outweigh the costs.","overweight 作形容词指超重，outweigh 可指重要性超过。",0,"对于有工作的成年人，上夜课的收益可能超过其成本。","In the end, actual readers seemed to outweigh fancy furniture.","最后看来，真有人来读书，比弄一屋子华丽家具更重要。","outweigh"],["participate","pɑːˈtɪsɪpeɪt","v.","参加；参与","Students were more likely to participate in small group discussions.","participant 是参与者，participate 通常接 in。",1,"学生更有可能参与小组讨论。","Even the girl who never volunteered offered to participate if she could choose the mysteries.","就连从不报名做志愿者的女生都自告奋勇，条件是让她来挑悬疑小说。","participate"],["performance","pəˈfɔːməns","n.","表现；业绩","The policy had little effect on academic performance in the first term.","perform 是动词，performance 是名词。",1,"这项政策在第一学期对学业表现几乎没有影响。","Our presentation performance improved dramatically once we stopped giving a presentation.","我们一停止照稿展示，表现反倒一下好了起来。","performance"],["primary","ˈpraɪməri","adj.","主要的；初级的","The primary aim was to increase access for low-income learners.","primitive 意为原始的，primary 可指主要或初级。",1,"首要目标是让低收入学习者有更多机会接受教育。","The primary reason we won, the headteacher said, was that we’d opened first.","校长说，我们获胜的主要原因是，我们先把借书点开起来了。","primary"],["priority","praɪˈɒrəti","n.","优先事项；优先权","Improving reading comprehension became a priority for the school.","superiority 是优越，priority 是优先。",1,"提高阅读理解能力成了这所学校的优先事项。","My priority was simpler: make it possible to borrow a book after school.","我最想解决的事简单得多：让大家放学后能借到一本书。","priority"],["procedure","prəˈsiːdʒə","n.","程序；步骤","Both groups followed the same procedure for submitting assignments.","process 指过程，procedure 偏规定步骤。",1,"两组都按照同样的流程提交作业。","The procedure required two signatures, a photograph, and exact change.","办卡要两个人签字、一张照片，还得自备刚好够用的零钱。","procedure"],["qualify","ˈkwɒlɪfaɪ","v.","符合条件（for）；限定","Students whose incomes fall below a threshold qualify for support.","quality 是质量，qualify 是动词。",1,"收入低于规定门槛的学生符合获得资助的条件。","You had to qualify for financial aid to enter, which made the velvet rather puzzling.","符合助学金申请条件的人才能参赛，这么一想，那些天鹅绒就更莫名其妙了。","qualify"],["register","ˈredʒɪstə","v./n.","登记；注册","Many adults registered for courses that could be completed at home.","enroll 常指入学或入班，register 也泛指登记。",1,"许多成年人报名参加了可以在家完成的课程。","I went to register and found a second file called “Winning Answer.”","我点进去报名，却发现还有个文件，叫“获奖答案”。","register"],["relevant","ˈreləvənt","adj.","相关的；切题的","Readers should distinguish relevant details from examples that merely provide context.","relative 可指相对的或亲属，relevant 指相关。",1,"读者应区分与论点相关的细节和仅用来交代背景的例子。","My rival hid my essay collection because she said it wasn’t relevant to the results.","我对手把我的散文集藏了起来，说这跟调查结果没关系。","relevant"],["resource","rɪˈzɔːs","n.","资源；资料","A public library can be a valuable resource for independent learners.","source 是来源，resource 是可利用的资源。",1,"公共图书馆可以成为自主学习者宝贵的资源。","Our most useful resource turned out to be a trolley abandoned outside the art room.","结果最有用的资源，竟是美术教室外面一辆没人要的手推车。","resource"],["restrict","rɪˈstrɪkt","v.","限制；约束","A lack of transport may restrict access to after-school programs.","constrict 多指收紧或压缩，restrict 强调限制。",1,"交通不便可能使一些人难以参加课后项目。","The short opening hours also restrict borrowing to people who can stay late.","开门时间又短，搞得只有能晚走的人才借得到书。","restrict"],["revise","rɪˈvaɪz","v.","修改；复习","Teachers revised the materials after interviewing first-year students.","review 是回顾或审阅，revise 可指修改文稿。",1,"教师在访谈一年级学生后修改了教学材料。","We had to revise the pitch when the trolley wouldn’t fit through the door.","书车进不了评审室的门，我们只好改展示方案。","revise"],["stable","ˈsteɪbəl","adj.","稳定的；牢固的","A stable timetable can help children develop regular study habits.","steady 强调持续平稳，stable 强调不易变化。",1,"稳定的作息安排有助于孩子养成规律的学习习惯。","The trolley wasn’t entirely stable until we wedged a dictionary against one wheel.","手推车有点晃，直到我们拿字典抵住一个轮子才稳下来。","stable"],["substantial","səbˈstænʃəl","adj.","大量的；实质性的","The change required a substantial investment in teacher training.","substantive 偏本质或实质内容，substantial 可强调数量可观。",1,"这项调整需要在教师培训上投入大量资金。","The school made a substantial donation: six shelves of books nobody had been allowed to touch.","学校捐了相当多的东西：整整六书架以前谁也不许碰的书。","substantial"],["survey","ˈsɜːveɪ / səˈveɪ","n./v.","调查；概览","A recent survey found that few learners read the instructions carefully.","interview 是访谈，survey 往往面向较大样本收集信息。",1,"近期的一项调查发现，很少有学习者会仔细阅读说明。","A quick survey told us students wanted mysteries and absolutely no more Shakespeare.","一个简短调查告诉我们，大家想看悬疑小说，而且真的不想再读莎士比亚了。","survey"],["transfer","trænsˈfɜː / ˈtrænsfɜː","v./n.","转移；迁移","Students struggled to transfer what they had learned to a new task.","transform 指改变形态，transfer 指转移或迁移。",1,"学生难以把学过的内容运用到新的任务中。","My rival said we could transfer the trolley to the judging room and let them try it.","对手说，我们可以把书车移到评审室，让评委自己试用。","transfer"],["valid","ˈvælɪd","adj.","有效的；有根据的","A short test may not be a valid measure of long-term improvement.","valuable 是有价值的，valid 是有效或有根据的。",1,"一次简短的测试未必能有效衡量长期的进步。","My student ID was valid; my five-pound note, apparently, was not.","我的学生证有效。我那张五英镑的纸币呢，看样子不行。","valid"],["withdraw","wɪðˈdrɔː","v.","退出；撤回","Several participants withdrew because the course conflicted with work.","withhold 表示扣留或不提供，withdraw 表示撤回。",1,"几位参与者因为课程与工作时间冲突而退出。","I nearly decided to withdraw anyway, because our painted trolley looked nothing like the sample answer.","即便这样，我还是差点决定退赛，因为刷了漆的手推车和参考答案一点都不像。","withdraw"],["curriculum","kəˈrɪkjələm","n.","课程体系；课程内容","The revised curriculum includes more opportunities for independent research.","syllabus 多指一门课的教学大纲。",2,"修订后的课程体系提供了更多独立研究的机会。","The contest formed part of our curriculum, so the teacher posted the brief.","这场比赛算正式课程的一部分，老师就把比赛题目发到了群里。","curriculum"],["discipline","ˈdɪsəplɪn","n./v.","学科；纪律","Students from different disciplines tended to ask different kinds of questions.","subject 可指教学科目或讨论主题，discipline 可指成熟学科。",2,"来自不同学科的学生往往会提出不同类型的问题。","The judges doubted our discipline until they saw how neatly we’d logged forty loans.","评委本来怀疑我们管理太松，直到看见四十次借阅记录写得整整齐齐。","discipline"],["enroll","ɪnˈrəʊl","v.","登记入学；报名","More adults enrolled in courses with flexible schedules.","enlist 常指入伍或争取支持，enroll 常指入学报名。",2,"更多成年人报名参加了时间安排灵活的课程。","By Thursday, even the deputy head wanted to enroll as a borrower.","到了周四，连副校长都想注册成借书人。","enroll"],["literacy","ˈlɪtərəsi","n.","读写能力；某领域素养","Digital literacy includes the ability to judge whether online information is reliable.","literary 指文学的，literacy 指读写能力或素养。",2,"数字素养包括判断网上信息是否可靠的能力。","I said the project supported literacy, then asked if she could wait until we’d parked properly.","我说这个项目能帮同学提升读写能力，然后问她能不能等我们先把车停稳。","literacy"],["mentor","ˈmentɔː","n./v.","导师；指导","A mentor helped first-year students plan how to use their study time.","monitor 意为监测，mentor 强调指导。",2,"一位导师帮助一年级学生规划如何利用学习时间。","Our new mentor was the librarian, who secretly hated the card forms.","我们的新导师是图书管理员，其实她也早就烦透了办卡表格。","mentor"],["numerous","ˈnjuːmərəs","adj.","许多的；众多的","Numerous studies have examined the effects of class size on achievement.","numerical 指数字的，numerous 指数量多。",2,"许多研究考察了班级人数对学业成绩的影响。","By Friday, numerous students had asked whose brilliant idea it had been.","到了周五，好多同学都在问，这到底是谁想出来的妙招。","numerous"],["enrich","ɪnˈrɪtʃ","v.","丰富；充实","Field visits can enrich students' understanding of local history.","rich 是形容词，enrich 是使丰富。",2,"实地参观可以加深并丰富学生对当地历史的理解。","I said the trolley had helped enrich our school, but the detective stories deserved credit too.","我说推车丰富了我们的校园生活，但侦探小说也有功劳。","enrich"],["tuition","tjuˈɪʃən","n.","学费；教学","Rising tuition has placed further pressure on families with limited savings.","tutor 指辅导老师或辅导，tuition 可指学费。",2,"学费上涨给储蓄不多的家庭带来了更大压力。","When Mum saw my tuition was covered, she asked if the trolley took passengers.","妈妈一看到我的学费有着落了，就问那辆小推车能不能载客。","tuition"]],[["accumulate","əˈkjuːmjəleɪt","v.","积累；聚积","Plastic particles accumulate in rivers after heavy rainfall.","assemble 偏组装或集合，accumulate 偏逐渐积累。",0,"暴雨过后，塑料颗粒会在河流中积聚。","Water began to accumulate where our changing rooms were supposed to go.","本来要建更衣室的地方开始积水。","accumulate"],["adaptation","ˌædæpˈteɪʃən","n.","适应；改编作品","Adaptation to heat will require changes in urban design.","adoption 指采用，adaptation 指适应或改编。",0,"要适应高温，城市设计需要作出调整。","Raised stalls were the market's simplest adaptation to future floods.","为了应对以后可能再来的洪水，市场最简单的改动就是把摊位垫高。","adaptation"],["agriculture","ˈæɡrɪkʌltʃə","n.","农业","Agriculture is a major source of employment in the region.","horticulture 主要指园艺，agriculture 指广义农业。",0,"农业是该地区就业的主要来源之一。","A farmer reminded us that agriculture kept our market alive.","一位菜农提醒大家，市场能撑下去，全靠种地的人。","agriculture"],["carbon","ˈkɑːbən","n.","碳","The report estimates how much carbon urban trees can store.","carbonate 是碳酸盐，carbon 是元素碳。",0,"报告估算了城市树木可以储存多少碳。","Black carbon from the smoke settled on our mayor's white cake.","烟里的黑碳颗粒落在了镇长的白奶油蛋糕上。","carbon"],["conservation","ˌkɒnsəˈveɪʃən","n.","保护；节约","Water conservation becomes more important during prolonged droughts.","conversation 是谈话，conservation 是保护。",0,"在长期干旱期间，节约用水变得更加重要。","The mayor tried to make duck conservation sound like his idea.","镇长努力把保护鸭子说得像是他先想出来的。","conservation"],["consume","kənˈsjuːm","v.","消耗；消费","Older buildings tend to consume more energy in winter.","assume 是假定或承担，consume 是消耗。",0,"较老的建筑在冬季往往消耗更多能源。","Keeping tourists happy could consume more water than her whole farm used.","光为让游客游得开心，可能就要用掉比她整个农场还多的水。","consume"],["declining","dɪˈklaɪnɪŋ","adj.","下降的；衰退的","Declining fish stocks prompted limits on commercial fishing.","decreasing 泛指减少，declining 常指持续下降趋势。",0,"鱼类资源减少，促使有关部门限制商业捕捞。","Declining vegetable sales mattered more to her than a ribbon-cutting.","卖菜的钱越来越少，她可没空关心剪彩。","Declining"],["degrade","dɪˈɡreɪd","v.","使退化；降解","Excessive use can degrade the soil over several seasons.","downgrade 常指下调等级，degrade 可指质量或环境退化。",0,"过度利用可能在几个季节内导致土壤退化。","She warned that pouring concrete would degrade the existing wetland.","她提醒大家，浇混凝土会破坏这里原有的湿地。","degrade"],["emission","ɪˈmɪʃən","n.","排放；排放物","The researchers measured emissions from diesel vehicles.","omission 是省略，emission 是排放。",0,"研究人员测量了柴油车辆的排放量。","The inspector said the pump also broke the town's emission limit.","检查人员说，这台泵的排放也超过了镇上的限值。","emission"],["environmental","ɪnˌvaɪrənˈmentəl","adj.","环境的；环保的","The environmental costs of disposable packaging can be hard to measure.","ecological 偏生态系统，environmental 范围更广。",0,"一次性包装造成的环境代价可能难以衡量。","The inspector proposed an environmental fix that also saved the market.","检查人员拿出一个环保方案，顺带也能保住市场。","environmental"],["erosion","ɪˈrəʊʒən","n.","侵蚀；逐渐削弱","Plants can slow soil erosion on steep slopes.","corrosion 常指材料的化学腐蚀。",0,"植物可以减缓陡坡上的土壤侵蚀。","Erosion had already eaten half the bank beside the market.","冲刷已经把市场旁边的堤岸啃掉了一半。","Erosion"],["estimate","ˈestɪmeɪt / ˈestɪmət","v./n.","估算；估计值","Researchers estimate that several thousand households will be affected.","evaluate 偏作价值判断，estimate 偏估算数量。",0,"研究人员估计，将有数千户家庭受到影响。","The mayor's latest estimate was that construction would start on Monday.","镇长最新的估计是，工程要到星期一才能开工。","estimate"],["exhaust","ɪɡˈzɔːst","v./n.","耗尽；废气","Poor planning can exhaust a community's water supply.","exhausted 强调人精疲力尽，exhaust 也可指尾气。",0,"规划不当可能耗尽一个社区的供水资源。","Meanwhile, exhaust from the diesel pump drifted over the cake stall.","与此同时，柴油水泵吐出的尾气飘到了蛋糕摊上。","exhaust"],["habitat","ˈhæbətæt","n.","栖息地","Road construction reduced the available habitat for native animals.","habit 是习惯，habitat 是栖息地。",0,"道路建设缩小了本地动物可利用的栖息地。","The ducks lost their usual habitat and moved into the empty lot.","鸭子原来的栖息地被淹了，干脆搬进了那块空地。","habitat"],["impact","ˈɪmpækt / ɪmˈpækt","n./v.","影响；冲击","Researchers examined the impact of rising temperatures on crop yields.","affect 常作动词，impact 可作名词或动词。",0,"研究人员考察了气温上升对作物产量的影响。","The project's first impact was that our vegetables stayed dry.","方案第一个看得见的成效，就是摊上的菜没再泡水。","impact"],["limit","ˈlɪmɪt","n./v.","限度；限制","Some cities limit water use during especially dry months.","limitation 也可指研究的局限，limit 可指明确界限。",0,"一些城市在特别干旱的月份限制用水。","They agreed to limit construction to a raised path and viewing platform.","大家同意少动土，只修一条高架小路和一个观景台。","limit"],["maintain","meɪnˈteɪn","v.","维持；主张","Farmers struggled to maintain yields as rainfall became less predictable.","retain 偏保留已有事物，maintain 偏维持状态。",0,"随着降雨越来越难预测，农民难以维持产量。","Nobody even knew who was supposed to maintain the old drainage pipe.","连那根老排水管归谁维护，镇上都没人说得清。","maintain"],["mitigate","ˈmɪtəɡeɪt","v.","减轻；缓和","Planting trees can  是对待或治疗，threat 是威胁。",0,"海平面上升对低洼地区的居民点构成威胁。","The rising river was a threat to the market's vegetable stalls.","河水不断上涨，市场里的菜摊眼看就要遭殃。","threat"],["abandon","əˈbændən","v.","放弃；遗弃","Some farmers abandoned crops that required too much irrigation.","abolish 强调正式废除制度，abandon 可指停止某做法。",1,"一些农民不再种植需要大量灌溉的作物。","She asked the mayor to abandon the pool and fix the drain.","她请镇长放弃建泳池，把排水管先修好。","abandon"],["absorb","əbˈzɔːb","v.","吸收；理解","Wetlands absorb water that would otherwise flood nearby roads.","adsorb 特指吸附在表面，absorb 泛指吸收。",1,"湿地能够吸纳积水，否则这些水会淹没附近的道路。","The ground couldn't absorb water once the soil was already saturated.","土里已经浸满了水，再也吸不进去。","absorb"],["abundant","əˈbʌndənt","adj.","丰富的；大量的","Solar energy is abundant in parts of the country.","adequate 仅表示足够，abundant 表示充足有余。",1,"该国部分地区拥有丰富的太阳能资源。","The mayor called the abundant water a bonus for taxpayers.","镇长说，水这么多，算是给纳税人的额外福利。","abundant"],["accelerate","əkˈseləreɪt","v.","加快；加速","Rising demand could accelerate the transition to clean power.","escalate 常指冲突或成本升级，accelerate 强调速度。",1,"需求上升可能会加快向清洁电力转型。","It could also accelerate runoff into the market during heavy rain.","下大雨时，混凝土还可能让雨水更快流进市场。","accelerate"],["adverse","ˈædvɜːs","adj.","不利的；有害的","Extreme heat can have adverse effects on public health.","averse 表示厌恶、反对，adverse 表示不利。",1,"极端高温可能给公众健康带来不利影响。","The mayor blamed adverse weather, then quietly scraped off the icing.","镇长怪天气太恶劣，然后偷偷刮掉了那层奶油。","adverse"],["biodiversity","ˌbaɪəʊdaɪˈvɜːsəti","n.","生物多样性","Protecting biodiversity may make forests more resilient to disease.","diversity 泛指多样性，biodiversity 特指生物多样性。",1,"保护生物多样性可能增强森林抵御病害的能力。","Our biodiversity survey found frogs, beetles and one extremely loud duck.","调查生物多样性时，我们发现了青蛙、甲虫，还有一只嗓门特别大的鸭子。","biodiversity"],["cultivate","ˈkʌltəveɪt","v.","种植；培养","Farmers began to cultivate crops that needed less water.","culture 多作名词表示文化，cultivate 可指培养技能。",1,"农民开始种植需水量较少的作物。","She couldn't cultivate beans on a promise made at a press conference.","新闻发布会上的一句承诺，可种不出一把豆子。","cultivate"],["disposal","dɪˈspəʊzəl","n.","处理；处置","The safe disposal of batteries remains a challenge.","disposable 表示一次性的，disposal 是处理。",1,"如何安全处理电池仍是一个难题。","She ordered the safe disposal of the contaminated water.","她要求把受污染的水妥善处理掉。","disposal"],["drought","draʊt","n.","干旱","A prolonged drought reduced the region's wheat harvest.","draught 美式通常拼作 draft，指穿堂风等。",1,"持续干旱导致该地区小麦减产。","Last summer's drought had already ruined her bean harvest.","去年夏天一场旱灾，她的豆子就已经颗粒无收了。","drought"],["ecology","iˈkɒlədʒi","n.","生态；生态学","The removal of one species can alter the ecology of a lake.","economy 指经济，ecology 指生态。",1,"一种生物的消失可能改变湖泊的生态。","A biologist explained how reeds fitted into the wetland's ecology.","生物学家解释了芦苇在湿地生态里有什么作用。","ecology"],["forecast","ˈfɔːkɑːst","n./v.","预报；预测","Researchers forecast an increase in electricity demand during heat waves.","foresee 泛指预见，forecast 常依据数据作预测。",1,"研究人员预测，热浪期间用电需求会上升。","The weather forecast said the opening weekend would be wet.","天气预报说，原定开业的那个周末会下雨。","forecast"],["generate","ˈdʒenəreɪt","v.","产生；发电","The panels generate enough power for the building on sunny days.","generalize 指概括或推广，generate 指产生。",1,"在晴天，这些太阳能板可以为这栋建筑提供足够的电力。","The panels could generate enough electricity for all six market lights.","这些板发的电够市场里六盏灯全点亮。","generate"],["infrastructure","ˈɪnfrəˌstrʌktʃə","n.","基础设施","Flooding can damage the infrastructure that supplies clean water.","structure 是结构，infrastructure 是基础设施体系。",1,"洪水可能损坏供应清洁用水的基础设施。","Unfortunately, our drainage infrastructure consisted of one pipe and a prayer.","偏偏我们镇的排水设施就一根管子，剩下只能靠祈祷。","infrastructure"],["irrigation","ˌɪrəˈɡeɪʃən","n.","灌溉","Efficient irrigation can reduce the amount of water a farm needs.","irritation 是恼怒或刺激，注意中间字母。",1,"采用高效灌溉方式可以减少农场的用水量。","Her irrigation pipes had been dry since the start of August.","她的灌溉管从八月初就没水了。","irrigation"],["scarce","skeəs","adj.","稀缺的；不足的","Fresh water becomes scarce in the dry season.","rare 指罕见，scarce 常指短缺。",1,"到了旱季，淡水就会变得稀缺。","Clean water had been scarce for weeks before this flood.","这场洪水来之前，干净的水反倒已经缺了好几个星期。","scarce"],["severe","sɪˈvɪə","adj.","严重的；严厉的","Severe storms caused widespread disruption to transport.","strict 强调规则严格，severe 常指损害严重。",1,"强风暴导致交通大范围中断。","By Friday, forecasters were warning of a severe storm.","到了星期五，预报员已发出警告，说这场暴风雨会很猛烈。","severe"],["urban","ˈɜːbən","adj.","城市的","Urban neighborhoods with more shade remain cooler on hot days.","suburban 是郊区的，rural 是农村的。",1,"天气炎热时，树荫较多的城市街区更凉爽。","Our mayor put our little town on an urban renewal poster.","镇长把我们这个小地方印上了城市更新的海报。","urban"],["affordable","əˈfɔːdəbəl","adj.","负担得起的","Affordable public transport can reduce dependence on private cars.","available 强调有货或可用，affordable 强调买得起。",2,"价格负担得起的公共交通可以减少人们对私家车的依赖。","He promised an affordable swimming pool beside the old market.","他承诺在老市场旁边建个人人游得起的泳池。","affordable"],["compost","ˈkɒmpɒst","n./v.","堆肥；制堆肥","Compost helps soil retain moisture during dry periods.","compose 指组成或创作，compost 指堆肥。",2,"在干旱时期，堆肥有助于保持土壤水分。","The farmer turned vegetable scraps into compost for her bean patch.","菜农把剩下的菜叶做成堆肥，施到种豆子的那块地上。","compost"],["contaminate","kənˈtæməneɪt","v.","污染；弄脏","Damaged pipes can contaminate the drinking water supply.","pollute 多用于环境，contaminate 也可指样本或食品被污染。",2,"管道破损可能污染饮用水源。","Leaking fuel from an old pump could contaminate the floodwater.","老水泵漏出的燃油可能污染积起来的洪水。","contaminate"],["deplete","dɪˈpliːt","v.","耗减；耗尽","A growing population may deplete groundwater reserves.","delete 指删除，deplete 指消耗储备。",2,"人口增长可能耗减地下水储量。","Keeping a swimming pool full could deplete the local reservoir.","泳池要一直灌满水，可能把镇上的水库都用空。","deplete"],["livelihood","ˈlaɪvlihʊd","n.","生计；谋生手段","Many families depend on fishing for their livelihood.","lifestyle 是生活方式，livelihood 是谋生手段。",2,"许多家庭以捕鱼为生。","For our farmer, a dry stall meant keeping her livelihood.","对那位菜农来说，摊位不进水，就保住了自己的生计。","livelihood"],["pesticide","ˈpestəsaɪd","n.","杀虫剂；农药","The study examined how pesticide use affected wild bees.","herbicide 特指除草剂，pesticide 是农药总称。",2,"这项研究考察了农药使用对野生蜂的影响。","She kept pesticide away from the wetland to protect the frogs.","为了保护青蛙，她没在湿地附近用杀虫剂。","pesticide"],["recycle","riˈsaɪkəl","v.","回收利用；再利用","Some materials cost more to recycle than others.","reuse 是直接再利用，recycle 常指经处理再利用。",2,"有些材料的回收利用成本高于其他材料。","We managed to recycle the old pool sign as a birdwatching notice.","原来泳池那块招牌也没浪费，改成了观鸟提示牌。","recycle"],["vulnerable","ˈvʌlnərəbəl","adj.","易受伤害的；脆弱的","Older adults are especially vulnerable to extreme temperatures.","susceptible 常接 to，强调容易受某事物影响。",2,"老年人尤其容易受到极端气温的影响。","Only the mayor's ego looked vulnerable when a duck stole his ribbon.","鸭子叼走剪彩的丝带时，看起来最扛不住的只有镇长的自尊心。","vulnerable"]],[["analyze","ˈænəlaɪz","v.","分析","Researchers analyzed patterns in how people shared the articles.","analysis 是名词，analyze 是动词。",0,"研究人员分析了人们分享这些文章时呈现出的规律。","Bea used headphones to analyze the sounds beneath the speaker’s voice.","贝娅戴上耳机，分析人声底下还有什么动静。","analyze"],["algorithm","ˈælɡəˌrɪðəm","n.","算法","An algorithm determines which stories appear first on the screen.","logarithm 是对数，algorithm 是算法。",0,"哪些报道最先出现在屏幕上，由一种算法决定。","The algorithm kept recommending the clip to our headteacher himself.","算法还一个劲儿把这段音频推给校长本人。","algorithm"],["bias","ˈbaɪəs","n./v.","偏见；使有偏向","The survey design may introduce bias into the findings.","prejudice 偏先入为主的成见，bias 也指系统偏差。",0,"调查的设计可能使研究结果产生偏差。","She said our bias towards scandal had made us hear a firing.","她说，大家太爱听丑闻，自然就听成了校长要被撤职。","bias"],["channel","ˈtʃænəl","n./v.","渠道；引导","Public libraries provide another channel for distributing information.","medium 是媒介，channel 偏传输渠道。",0,"公共图书馆为传播信息提供了另一条渠道。","We switched to a quieter radio channel and tried again.","我们切到杂音少一点的频道，又试了一次。","channel"],["cite","saɪt","v.","引用；列举","The author cites several studies on the effects of social media.","site 是地点或站点，sight 是视力或景象。",0,"作者引用了几项有关社交媒体影响的研究。","Bea told the paper to cite the full recording in its correction.","贝娅让校报在更正时引用完整录音。","cite"],["clarify","ˈklærɪfaɪ","v.","澄清；阐明","The article failed to clarify how the figures had been calculated.","verify 是验证正确性，clarify 是使表述清楚。",0,"这篇文章没有说明这些数字是如何计算出来的。","She played the full file to clarify what “go” meant.","她放了整段录音，让我们听明白“走”到底是什么意思。","clarify"],["communicate","kəˈmjuːnəkeɪt","v.","交流；传达","Numbers alone can be a poor way to communicate uncertainty.","commute 指通勤，communicate 指交流。",0,"仅凭数字可能很难说清其中的不确定性。","The only way his skeleton dancers could communicate was through loud foot stomps.","配舞的骷髅们只能靠大声跺脚来互相打暗号。","communicate"],["convey","kənˈveɪ","v.","传达；运送","A familiar word can convey different emotions in different contexts.","deliver 偏送达或发表，convey 侧重传达含义。",0,"同一个熟悉的词在不同语境中可以传达不同的情感。","The headteacher tried to convey mystery by wearing a cape and glittery boots.","校长披了件斗篷，又穿上亮闪闪的靴子，想营造神秘感。","convey"],["credible","ˈkredɪbəl","adj.","可信的；可靠的","People are more likely to share news from a credible source.","creditable 表示值得称赞，credible 表示可信。",0,"人们更愿意分享来自可信来源的新闻。","The proposed replacements didn’t seem credible either, especially the school rabbit.","所谓接任的人选也不怎么可信，尤其是学校养的那只兔子。","credible"],["data","ˈdeɪtə","n.","数据；资料","The data reveal differences in how age groups use the platform.","datum 是传统单数，data 在学术美式英语中常可作复数。",0,"数据显示，不同年龄群体使用这个平台的方式存在差异。","The file data showed it was recorded at exactly half past six.","文件数据显示，录音恰好是在六点半录下的。","data"],["disclose","dɪsˈkləʊz","v.","披露；公开","Companies rarely disclose precisely how they rank search results.","reveal 范围更广，disclose 常用于公开隐秘或受保护的信息。",0,"企业很少公开说明自己究竟如何对搜索结果进行排序。","The teacher finally agreed to disclose the surprise to us.","老师终于肯把惊喜告诉我们了。","disclose"],["distribute","dɪˈstrɪbjuːt","v.","分发；分布","News organizations now distribute stories through multiple platforms.","contribute 是作贡献，distribute 是分配或分发。",0,"如今，新闻机构通过多个平台发布报道。","Bea helped distribute new programmes at the school show.","学校开演时，贝娅帮着发新版节目单。","distribute"],["distinguish","dɪˈstɪŋɡwɪʃ","v.","区分；辨认","Readers must distinguish reported facts from the writer's opinion.","extinguish 是熄灭，distinguish 是区分。",0,"读者必须区分报道所陈述的事实和作者的观点。","Then Bea pointed out you could distinguish his voice from a mile away.","贝娅说，可那个人的声音隔着老远都能认出来。","distinguish"],["emerge","ɪˈmɜːdʒ","v.","出现；浮现","A clearer pattern emerged when the data were grouped by age.","immerse 表示浸入或沉浸。",0,"将数据按年龄分组后，规律变得更加清楚。","A connection began to emerge: rehearsals filled the hall at half past six.","事情开始有了眉目：六点半的礼堂一向挤满了来彩排的人。","emerge"],["enable","ɪˈneɪbəl","v.","使能够；启用","Automatic captions enable more viewers to follow a discussion.","ensure 强调确保，enable 强调提供条件。",0,"自动字幕让更多观众能跟上讨论。","The spotlight would enable everyone to identify him, even from the back.","聚光灯一打，就算坐最后一排，大家都能认出他。","enable"],["error","ˈerə","n.","错误；误差","A small error in the input can alter the final result.","mistake 泛指做错，error 在研究中也指误差。",0,"输入中的一个小错误就可能改变最终结果。","An error in the settings capped every preview at five seconds.","一个设置错误把所有预览都卡在了五秒。","error"],["fragment","ˈfræɡmənt / fræɡˈment","n./v.","片段；使碎裂","A fragment of a conversation can be misleading when shared online.","fraction 常指分数或小部分，fragment 偏断裂片段。",0,"一段对话的片段被分享到网上后，可能会误导人。","A fragment of a voice note said, “The headteacher has to go.”","一段语音的片段里，有人说：“校长必须走。”","fragment"],["ignore","ɪɡˈnɔː","v.","忽视；不理会","Readers may ignore information that challenges their beliefs.","neglect 也可指因疏忽未履行责任。",0,"读者可能会忽略与自己既有信念相冲突的信息。","Nobody could ignore the obvious: our headteacher was absolutely brilliant at tap dancing.","有件事大家想装没看见都不行：校长的踢踏舞跳得真厉害。","ignore"],["interpret","ɪnˈtɜːprət","v.","解读；口译","People interpret the same silence differently depending on context.","translate 常指笔译或转换，interpret 也指解读。",0,"对于同样的沉默，人们会根据语境作出不同的解读。","Bea asked me to interpret “has to go” without looking at the headline.","贝娅让我别看标题，自己琢磨“必须走”是什么意思。","interpret"],["media","ˈmiːdiə","n.","媒体；传播媒介","Social media can influence which topics receive public attention.","medium 是单个媒介，media 常指媒体整体或复数。",0,"社交媒体可以影响哪些话题受到公众关注。","Even local media called the office to ask who was leaving.","连当地媒体都打电话到校办公室，问到底谁要离职。","media"],["mislead","ˌmɪsˈliːd","v.","误导","A chart can mislead readers if its scale is poorly chosen.","misread 是理解错或读错，mislead 是误导他人。",0,"如果图表的刻度选择不当，就可能误导读者。","The short clip could mislead anyone into thinking the headteacher was leaving.","光听这段短音频，任谁都会以为校长要离开学校。","mislead"],["monitor","ˈmɒnətə","v./n.","监测；监视器","The researchers monitored how often participants checked the news.","mentor 是导师或指导，monitor 是监测。",0,"研究人员记录了参与者查看新闻的频率。","We stayed after school the next day to monitor the hall microphone.","第二天放学后，我们留下来监听礼堂的麦克风。","monitor"],["platform","ˈplætfɔːm","n.","平台；站台","The platform changed the way it recommended news stories.","format 是形式或格式，platform 是承载内容的平台。",0,"该平台改变了推荐新闻报道的方式。","Our school’s gossip platform pinned the recording to its front page.","学校的八卦平台把这段录音置顶在了首页。","platform"],["reliable","rɪˈlaɪəbəl","adj.","可靠的；可信赖的","A reliable source explains where its figures come from.","reliant 表示依赖的，reliable 表示可依赖的。",0,"可靠的信息来源会说明数字是从哪里来的。","Our most reliable witness, the caretaker, remembered hearing applause next.","最可靠的目击者是管理员，他记得接下来有人鼓掌。","reliable"],["verify","ˈverɪfaɪ","v.","核实；验证","Journalists tried to verify the claim using public records.","clarify 指澄清，verify 指核实真假。",0,"记者试图利用公开记录核实这一说法。","We went to verify his story by checking when the recording started.","我们去查录音开始的时间，看看能不能核实他说的话。","verify"],["accessibility","əkˌsesəˈbɪləti","n.","可及性；无障碍性","Captions can improve the accessibility of online lessons.","availability 指是否可得到，accessibility 侧重能否顺利使用。",1,"字幕可以让更多人无障碍地学习网课。","For accessibility, we added a transcript to the corrected audio.","为了方便更多人了解原话，我们给更正后的音频配了文字稿。","accessibility"],["anonymous","əˈnɒnəməs","adj.","匿名的；不知名的","The website allowed users to leave anonymous comments.","unanimous 是一致同意的，anonymous 是匿名的。",1,"该网站允许用户匿名发表评论。","It came from an anonymous account called The Staffroom Door.","这条消息来自一个叫“教职工休息室门口”的匿名账号。","anonymous"],["audience","ˈɔːdiəns","n.","受众；观众","The article was revised for a wider audience.","spectator 指现场观看的人，audience 可指一般受众。",1,"这篇文章经过修改，以便面向更广泛的读者。","I played it once and drew an audience of thirty classmates.","我放了一遍，三十个同学就围过来听。","audience"],["circulate","ˈsɜːkjəleɪt","v.","流传；循环","The rumor began to circulate before the official report was released.","circulation 是名词，circulate 是动词。",1,"官方报告发布前，谣言就开始流传了。","By lunchtime, a list of possible replacements had begun to circulate.","到了午饭时间，一份可能接任的名单已经流传开来。","circulate"],["commentary","ˈkɒməntəri","n.","评论；解说","The program included live commentary from two researchers.","comment 可指一条评论，commentary 常指较连续的评论或解说。",1,"节目中有两位研究人员进行现场解说。","My friend Bea offered live commentary from behind her pudding.","我朋友贝娅躲在布丁后面，开始现场解说。","commentary"],["confidential","ˌkɒnfɪˈdenʃəl","adj.","保密的；机密的","Names were kept confidential throughout the study.","confident 表示自信的，confidential 表示保密的。",1,"在整个研究期间，相关人员的姓名一直保密。","The drama teacher found us and said the rehearsal was confidential.","戏剧老师找到了我们，说彩排的事要保密。","confidential"],["consent","kənˈsent","n./v.","同意；许可","Participants gave written consent before the interviews were recorded.","consensus 表示群体共识，consent 表示许可或同意。",1,"访谈录音之前，参与者给出了书面同意。","We got his consent to write about the show after Friday.","我们征得校长同意，周五演出结束后再写报道。","consent"],["detect","dɪˈtekt","v.","发现；检测","The system can detect unusual patterns in user activity.","determine 偏确定，detect 偏察觉原本不明显的现象。",1,"该系统可以发现用户活动中的异常模式。","At the end of the preview, we could detect a squeaky shoe.","仔细听预览的结尾，能听到鞋子吱呀一声。","detect"],["device","dɪˈvaɪs","n.","设备；装置","A portable device recorded how often each user moved.","devise 是设计或发明，device 是名词。",1,"一台便携设备记录了每位用户活动身体的频率。","The device listed a full file called “Rehearsal”, but playback was locked.","设备里列着一个名叫“彩排”的完整文件，不过被锁住了，不能播放。","device"],["distort","dɪˈstɔːt","v.","歪曲；使变形","Selective reporting can distort the findings of a study.","distract 是分散注意，distort 是歪曲。",1,"选择性报道可能歪曲研究结果。","The original said he had to go on after the skeletons, which the preview distorted completely.","原话说的是骷髅表演完才轮到校长上场，预览把意思全弄变了。","distorted"],["editorial","ˌedɪˈtɔːriəl","adj./n.","编辑的；社论","The editorial called for clearer rules governing political advertising.","edition 是版本，editorial 可指社论。",1,"这篇社论呼吁制定更明确的规则来规范政治广告。","The school paper ran an editorial about hearing people out.","校报发了一篇社论，讲为什么要听人把话说完。","editorial"],["exaggerate","ɪɡˈzædʒəreɪt","v.","夸大","Some headlines exaggerate the strength of the evidence.","overestimate 偏估计过高，exaggerate 偏表达时夸大。",1,"有些标题夸大了证据的说服力。","“Don’t exaggerate,” Bea said, after predicting three resignations and a helicopter.","“别夸大啊。”贝娅刚预测完会有三个人辞职，还有直升机来接。","exaggerate"],["filter","ˈfɪltə","n./v.","过滤器；筛选","News applications filter stories according to users' past behavior.","screen 也可指筛查，filter 强调筛掉一部分。",1,"新闻应用会根据用户过去的行为筛选报道。","Bea knew how to filter the recordings by time and room.","贝娅知道怎么按时间和房间筛选录音。","filter"],["identity","aɪˈdentəti","n.","身份；认同","Users can protect their identity by limiting what they share.","identification 常指识别过程或身份证件。",1,"用户可以通过限制分享的内容来保护自己的身份信息。","She was trying to protect the identity of Friday’s surprise performer.","她想保住一个秘密：周五的惊喜表演者是谁。","identity"],["insert","ɪnˈsɜːt / ˈɪnsɜːt","v./n.","插入；插页","Publishers can insert corrections into the online version immediately.","assert 是断言，insert 是插入。",1,"出版方可以立即在网络版中加入更正内容。","I watched the stage manager insert the headteacher’s dance before the interval.","我看着舞台监督把校长的舞蹈插进了中场休息前的节目。","insert"],["interfere","ˌɪntəˈfɪə","v.","干扰；干涉","Frequent notifications can interfere with sustained attention.","interact 意为互动，interfere with 意为干扰。",1,"频繁的通知可能妨碍人们长时间集中注意力。","An old fan began to interfere with the signal just as someone spoke.","刚有人开口，一台旧风扇就开始干扰信号。","interfere"],["privacy","ˈprɪvəsi","n.","隐私；私密","The new features raised questions about user privacy.","private 是形容词，privacy 是名词。",1,"这些新功能引发了关于用户隐私的疑问。","We turned it off when we realised we might be invading someone’s privacy.","意识到可能侵犯了别人的隐私，我们就把接收器关了。","privacy"],["ambiguous","æmˈbɪɡjuəs","adj.","模棱两可的；有歧义的","Ambiguous messages were more likely to provoke disagreement.","vague 强调含糊，ambiguous 强调能有多种解释。",2,"含义不明确的信息更容易引起分歧。","The words were ambiguous, but nobody wanted a less dramatic explanation.","这话有歧义，可谁都不想听没那么劲爆的解释。","ambiguous"],["archive","ˈɑːkaɪv","n./v.","档案；归档","The archive allows readers to compare coverage across decades.","achieve 是实现，archive 是档案或归档。",2,"读者可以利用这个档案库比较不同年代的报道。","We searched the school radio archive for anything recorded that evening.","我们在校广播电台的档案里找那晚录下的东西。","archive"],["automate","ˈɔːtəmeɪt","v.","使自动化","Some publishers automate the production of routine reports.","automatic 是形容词，automate 是动词。",2,"一些出版机构通过自动化手段生成常规报道。","The radio club had tried to automate previews of its own recordings.","广播社之前试着让系统自动生成录音预览。","automate"],["caption","ˈkæpʃən","n./v.","字幕；配图说明","The photograph's caption gave readers important context.","subtitles 通常指影视对白字幕，caption 还可指图注。",2,"这张照片的配文为读者提供了重要的背景信息。","The caption read, “Headteacher out by Friday.”","配文写着：“校长周五前下台。”","caption"],["connotation","ˌkɒnəˈteɪʃən","n.","隐含意义；联想","The same phrase can carry a negative connotation in one context.","denotation 指字面意义，connotation 指内涵或联想。",2,"同一个短语在某种语境下可能带有负面含义。","In the comments, the phrase had picked up a threatening connotation.","评论区一带节奏，这句话听起来就有了威胁的意味。","connotation"],["excerpt","ˈeksɜːpt / ekˈsɜːpt","n./v.","摘录；节选","A brief excerpt from the interview circulated widely online.","except 意为除外，excerpt 指摘录。",2,"这段访谈的一则简短节选在网上广为流传。","The excerpt left out everything after “go”, including the word “on.”","那一小段把“go”后面的词全截掉了，其中就有“on”。","excerpt"],["nuance","ˈnjuːɑːns","n.","细微差别","A short headline may miss an important nuance in the original argument.","nuisance 指令人烦恼的事物，nuance 指细微差别。",2,"简短的标题可能遗漏原论述中一个重要的细微差别。","One nuance bothered me: the speaker sounded impatient, not angry.","有个细节让我纳闷：说话的人听着是不耐烦，并没有生气。","nuance"],["transmit","trænzˈmɪt","v.","传播；传输","Digital networks can transmit information with little delay.","transplant 是移植，transmit 是传输。",2,"数字网络在传输信息时几乎没有延迟。","That microphone could transmit all the way to Bea’s desk.","那支麦克风的信号一路能传到贝娅的桌子上。","transmit"]],[["apparent","əˈpærənt","adj.","明显的；表面上的","The apparent benefits disappeared after a closer examination.","evident 强调明显，apparent 也可表示表面看来如此。",0,"仔细审查后，那些看似存在的好处就站不住脚了。","The apparent crisis turned into the best publicity we’d ever had.","这场看似要翻车的危机，成了我们做过最成功的一次宣传。","apparent"],["appointment","əˈpɔɪntmənt","n.","预约；任命","The system made it easier to book an appointment.","assignment 是任务。",0,"该系统让预约变得更方便。","I booked an appointment with the organiser to go over the menu.","我预约了见活动负责人，好一起过一遍菜单。","appointment"],["authority","ɔːˈθɒrəti","n.","权威；主管机构","Local authorities funded the project.","author 是作者。",0,"当地政府为该项目提供了资金。","The health authority said our announcer had to stay away from food preparation.","卫生主管部门说，我们的报单员不能靠近备餐区。","authority"],["automation","ˌɔːtəˈmeɪʃən","n.","自动化","Automation changed the skills required on the factory floor.","autonomy 是自主性。",0,"自动化改变了工厂一线岗位所需的技能。","That was automation, if you ignored the bird’s cracker bill.","也算是自动化吧，只要别去算那只鸟的饼干开销。","automation"],["compensate","ˈkɒmpenseɪt","v.","补偿；弥补","Training cannot compensate for a chronic shortage of staff.","compete 是竞争。",0,"培训无法弥补长期的人手短缺。","The extra fee would compensate us for turning down our usual lunch trade.","额外收的钱足够补偿我们午饭时段少做的日常生意。","compensate"],["compete","kəmˈpiːt","v.","竞争","Small firms struggle to compete for skilled workers.","complete 是完成。",0,"小企业很难在争夺熟练工人的竞争中占到优势。","I couldn’t compete with him after he learned to say “Card accepted.”","自从它学会说“刷卡成功”，我就彻底争不过它了。","compete"],["competitive","kəmˈpetətɪv","adj.","有竞争力的；竞争激烈的","A competitive salary helped the firm retain staff.","competent 是胜任的。",0,"具有竞争力的薪酬帮助公司留住了员工。","The neighbour said Pickle’s salary was competitive for a bird.","邻居说，对一只鸟来说，皮克尔的薪水还是很有竞争力的。","competitive"],["coordinate","kəʊˈɔːdɪneɪt","v.","协调","Managers coordinated work across different offices.","cooperate 强调合作。",0,"管理人员协调了不同办公室之间的工作。","We had to coordinate his greetings with orders from the kitchen.","我们只好想办法，让它招呼客人的时机和后厨出餐对上。","coordinate"],["corporate","ˈkɔːpərət","adj.","公司的；企业的","Corporate training is increasingly delivered online.","cooperative 是合作的。",0,"越来越多的企业培训通过线上方式开展。","Then came a corporate lunch order large enough to save the diner.","这时来了一笔企业午餐订单，大到能救活这家小餐馆。","corporate"],["delegate","ˈdelɪɡeɪt / ˈdelɪɡət","v./n.","委派；代表","Leaders delegate tasks to make better use of team members' skills.","dedicate 是投入或奉献。",0,"领导把任务分派给团队成员，以更好地发挥他们的技能。","I tried to delegate the job to the mop, without success.","我试着把这活儿交给拖把，没能成功。","delegate"],["efficient","ɪˈfɪʃənt","adj.","效率高的","A more efficient process reduced waiting times.","effective 强调有效。",0,"效率更高的流程缩短了等待时间。","It was an efficient sales pitch, just one phrase for every customer.","这套推销话术效率真高，面对什么客人都只用一句。","efficient"],["employee","ɪmˈplɔɪiː","n.","雇员","Employees were invited to comment on the proposal.","employer 是雇主。",0,"公司邀请员工对这项提案发表意见。","Our newest employee showed up on Monday and immediately ate the paperwork.","我们最新入职的员工周一到岗，一来就把入职表格吃了。","employee"],["engagement","ɪnˈɡeɪdʒmənt","n.","参与；投入","The change led to higher employee engagement.","arrangement 是安排。",0,"这项改变让员工更积极地投入工作。","Customer engagement soared: people started asking him about his weekend.","顾客参与度猛涨：大家开始问它周末过得怎么样。","engagement"],["expertise","ˌekspɜːˈtiːz","n.","专业知识","New staff benefited from the expertise of experienced colleagues.","expert 是专家或熟练的。",0,"新员工从资深同事的专业知识中获益。","With his expertise, we got the speaker working by eleven.","靠他的专业技术，我们十一点前就弄响了扬声器。","expertise"],["firm","fɜːm","n./adj.","公司；坚定的","The firm offered flexible hours to new recruits.","factory 强调生产场所。",0,"这家公司为新员工提供了灵活的工作时间。","The booking came through a local accountancy firm.","单子是本地一家会计师事务所下的。","firm"],["hire","ˈhaɪə","v./n.","雇用；租用","The company hired more workers to meet rising demand.","fire 可指解雇。",0,"公司雇了更多员工，以满足不断增长的需求。","We decided to hire him after he said “More chips?” twice.","它说了两次“再来点薯条吗？”，我们就决定雇它了。","hire"],["initiative","ɪˈnɪʃətɪv","n.","倡议；主动性","The initiative aimed to support workers returning from leave.","incentive 是激励因素。",0,"这项举措旨在为休假后重返岗位的员工提供支持。","Our quietest waiter took the initiative and taught him to say “Salad!”","我们最安静的服务员主动教它说：“沙拉！”","initiative"],["innovation","ˌɪnəˈveɪʃən","n.","创新；新方法","Innovation often begins with a small change in routine.","invention 偏发明新的事物。",0,"创新往往始于日常做法中的一个小改变。","Our innovation was a pick-up announcement delivered by a parrot.","我们的创新就是让一只鹦鹉负责报餐。","innovation"],["labour","ˈleɪbə","n./v.","劳动；劳动力","Labour shortages have slowed the expansion of some services.","labor 是美式拼法。",0,"劳动力短缺使某些服务的扩张放缓。","The rest of us did the heavy labour of packing fifty boxes.","剩下的人做的都是苦活，一盒一盒打包了五十份。","labour"],["management","ˈmænɪdʒmənt","n.","管理；管理层","Management met with staff to discuss the changes.","manager 指管理者个人。",0,"管理层与员工会面，讨论了这些变动。","Management gave him three rules, but he only listened to the first.","管理层给了它三条规矩，它只听了第一条。","Management"],["negotiate","nɪˈɡəʊʃieɪt","v.","谈判；协商","Employees negotiated for more predictable hours.","navigate 指导航或驾驭。",0,"员工通过协商争取更容易预先确定的工作时间。","I managed to negotiate a better price by offering a live announcer.","我说能提供现场报单服务，总算谈到了一个更好的价钱。","negotiate"],["occupation","ˌɒkjəˈpeɪʃən","n.","职业；占用","The risk of automation varies by occupation.","occupancy 偏入住或占用状态。",0,"不同职业面临的自动化风险各不相同。","For his occupation, I put “Customer Adviser” on the surviving form.","我在幸存的表格上填了职业：“顾客顾问”。","occupation"],["productivity","ˌprɒdʌkˈtɪvəti","n.","生产率；效率","Short interruptions can reduce productivity over a working day.","production 指产出或生产。",0,"短暂的中断也可能降低一整天的工作效率。","Kitchen productivity improved once we started filling entire trays with chips.","自从后厨开始一整盘一整盘地装薯条，出餐效率就上来了。","productivity"],["recruit","rɪˈkruːt","v./n.","招募；新成员","The firm recruited trainees from several regions.","recur 指反复出现。",0,"这家公司从多个地区招募了受训人员。","The owner tried to recruit his neighbour, who sent over her parrot.","老板想拉隔壁邻居来干活，她却把自家的鹦鹉送了过来。","recruit"],["specialise","ˈspeʃəlaɪz","v.","专门从事；专攻","Some employees specialise in solving technical problems.","specify 表示明确说明。",0,"一些员工专门解决技术问题。","They specialise in repairing talking toys, which seemed close enough.","他们专修会说话的玩具，我想差不了多少。","specialise"],["workforce","ˈwɜːkfɔːs","n.","劳动力；员工总数","The workforce is ageing in many industries.","workload 是工作量。",1,"许多行业的劳动力正在老龄化。","Our entire workforce was down to two people and a mop.","我们全店人手只剩两个人，外加一把拖把。","workforce"],["assemble","əˈsembəl","v.","组装；集合","The organisation assembled a team with experience in public health.","resemble 是相似。",1,"该组织组建了一支具有公共卫生经验的团队。","I helped assemble a little booth for Pickle on the pavement.","我帮忙在店外人行道上给皮克尔搭了个小播音室。","assemble"],["assign","əˈsaɪn","v.","分配；指派","Managers assigned each trainee a different problem.","sign 只指签字等。",1,"管理人员给每名受训人员分配了一个不同的问题。","I was assigned the task of teaching him a proper greeting.","教它怎么正经招呼客人的任务落到了我头上。","assigned"],["autonomy","ɔːˈtɒnəmi","n.","自主权；自治","Greater autonomy gave staff more control over their schedules.","automation 是自动化。",1,"自主权的扩大，让员工能更自由地安排自己的工作时间。","Pickle wanted autonomy and rejected everything except “More chips?”","皮克尔想要自主权，除了“再来点薯条吗？”，别的话它一概不学。","autonomy"],["collaborate","kəˈlæbəreɪt","v.","合作；协作","Engineers collaborated with designers to improve the product.","coordinate 偏统筹协调。",1,"工程师与设计师合作改进产品。","We decided to collaborate with the gadget shop next door.","我们决定找隔壁的小电器店合作。","collaborate"],["commitment","kəˈmɪtmənt","n.","承诺；投入","The project requires a long-term commitment from partners.","committee 是委员会。",1,"这个项目需要合作伙伴作出长期承诺。","My commitment lasted until the tips doubled that afternoon.","这个决心坚持到当天下午小费翻倍为止。","commitment"],["contract","ˈkɒntrækt / kənˈtrækt","n./v.","合同；收缩","Staff on short contracts were less likely to receive training.","contact 是联络。",1,"签短期合同的员工获得培训的机会较少。","Pickle signed his contract by walking across it with inky feet.","皮克尔用沾着墨水的爪子踩过合同，就算签了字。","contract"],["corporation","ˌkɔːpəˈreɪʃən","n.","大公司；法人团体","The corporation published a report on pay differences.","cooperation 是合作。",1,"这家大公司发布了一份关于薪酬差异的报告。","Lunch was for its biggest client, a global corporation.","午餐是给他们最大的客户订的，对方是一家跨国公司。","corporation"],["demanding","dɪˈmɑːndɪŋ","adj.","要求高的；费力的","Workers learned better when demanding tasks were broken into steps.","demand 指要求或需求。",1,"把难度较高的任务拆成几个步骤后，员工学得更好。","They were a demanding crowd, with one rule: absolutely no fried food.","这群人可挑剔了，规矩只有一条：绝对不要油炸食品。","demanding"],["expenditure","ɪkˈspendɪtʃə","n.","支出；消耗","Expenditure on training increased despite tighter budgets.","expense 可指单项开支。",1,"尽管预算收紧，培训支出仍然有所增加。","Our expenditure on frozen chips was suddenly rather embarrassing.","我们花在冷冻薯条上的钱，突然显得有点尴尬。","expenditure"],["institute","ˈɪnstɪtjuːt","n./v.","机构；设立","The institute studied changes in recruitment practices.","institution 指机构或制度。",1,"该研究机构研究了招聘做法的变化。","The owner decided to institute a one-cracker minimum wage for birds.","老板决定设个新规，鸟员工的最低工资是一块饼干。","institute"],["mechanism","ˈmekənɪzəm","n.","机制；机械装置","A formal mechanism allowed employees to report problems.","machine 是机器。",1,"员工可以通过正式机制报告问题。","The mechanism told Pickle a tray was ready by ringing a bell.","这个装置会响铃，告诉皮克尔有一份餐做好了。","mechanism"],["personnel","ˌpɜːsəˈnel","n.","全体人员；人事部门","Emergency personnel were trained to use the new equipment.","personal 是个人的。",1,"应急人员接受了使用新设备的培训。","Personnel from the corporation filmed Pickle’s first successful “Salad!”","那家大公司的员工拍下了皮克尔第一次成功喊出“沙拉！”的瞬间。","Personnel"],["predictable","prɪˈdɪktəbəl","adj.","可预测的","Predictable shifts allow workers to arrange childcare.","predictive 指具有预测作用的。",1,"班次可以提前确定，员工就能安排好孩子的照护。","His answer was predictable, but it sold an incredible number of chips.","它的回答不用猜，可就凭这一句，居然卖掉了惊人数量的薯条。","predictable"],["promotion","prəˈməʊʃən","n.","晋升；推广","The study examined who was most likely to receive a promotion.","promote 是动词。",1,"这项研究考察了哪些人最有可能获得晋升。","Pickle got a promotion to head of outdoor announcements.","皮克尔升职了，成了户外报单主管。","promotion"],["profession","prəˈfeʃən","n.","职业；行业","People entering the profession face different challenges today.","professional 可指专业人员。",1,"如今，进入这一行业的人面临着不同的挑战。","I vowed to pick a profession with less competition from birds.","我发誓一定要选一个竞争对手里少点鸟的职业。","profession"],["vacancy","ˈveɪkənsi","n.","职位空缺；空位","The company advertised the vacancy on its website.","vacation 是假期。",1,"公司在自己的网站上发布了这个岗位的招聘信息。","To fill one vacancy, the owner put a sign in his own window.","为了填上一个空缺，老板干脆在自家窗户贴了告示。","vacancy"],["allowance","əˈlaʊəns","n.","津贴；限额","The company offered a travel allowance to remote staff.","allocation 是分配的过程或份额。",2,"公司给远程办公的员工发放了交通补贴。","He immediately demanded his daily allowance of crackers by knocking over a cup.","它转头就打翻一只杯子，讨要每天配给它的饼干。","allowance"],["apprentice","əˈprentɪs","n.","学徒","Each apprentice spent part of the week in a classroom.","trainee 泛指受训者。",2,"每名学徒每周都有一部分时间在课堂上学习。","Their apprentice brought a speaker and a bag of cable ties.","店里的学徒带来了一个扬声器和一包扎线带。","apprentice"],["benchmark","ˈbentʃmɑːk","n./v.","基准；对标","The results provide a benchmark for future evaluations.","threshold 常指临界点或门槛。",2,"这些结果为今后的评估提供了一个基准。","Pickle became our benchmark for enthusiasm, especially on Mondays.","皮克尔成了我们的热情标杆，尤其是每个周一。","benchmark"],["entrepreneur","ˌɒntrəprəˈnɜː","n.","创业者；企业家","Many entrepreneurs struggle to secure their first customers.","enterprise 可以指企业或事业。",2,"许多创业者很难争取到第一批客户。","Pickle was an entrepreneur now, with a tip jar of his own.","现在皮克尔也是个创业者了，有了自己的小费罐。","entrepreneur"],["margin","ˈmɑːdʒɪn","n.","差额；利润率边际","Higher shipping costs reduced the profit margin.","merger 是合并。",2,"运输成本上升压低了利润率。","The profit margin on fifty salads was barely enough to cover one taxi.","卖五十份沙拉的利润勉强够打一次车。","margin"],["redundant","rɪˈdʌndənt","adj.","多余的；被裁的","Several tasks became redundant after the software was updated.","repetitive 指重复的。",2,"软件更新后，有几项任务就不再需要做了。","Our old system of calling order numbers became redundant overnight.","以前靠人喊号码的取餐方式，一夜之间就用不上了。","redundant"],["turnover","ˈtɜːnəʊvə","n.","人员流动率；营业额","High staff turnover made it difficult to maintain standards.","turnout 常指到场率。",2,"员工流动率高，使工作标准难以维持。","Our staff turnover was so high, even the “Now Hiring” sign disappeared.","员工换得太快，连“正在招聘”的牌子都不翼而飞了。","turnover"],["workload","ˈwɜːkləʊd","n.","工作量","A heavy workload left little time for professional development.","workforce 是员工总数或劳动力。",2,"繁重的工作让人几乎没有时间提升专业能力。","My workload, however, now included settling arguments between Pickle and toddlers.","可我的工作量也上去了，其中一项新工作是调解皮克尔和小朋友吵架。","workload"]],[["anxiety","æŋˈzaɪəti","n.","焦虑；担忧","Anxiety can make it harder to focus on unfamiliar tasks.","anxious 是形容词。",0,"焦虑可能使人更难在不熟悉的任务上集中注意力。","Competing with her was giving me more anxiety than my actual job.","光跟她比就让我焦虑得不行，比正经上班压力还大。","anxiety"],["attitude","ˈætɪtjuːd","n.","态度；看法","People's attitudes towards exercise can change over time.","aptitude 指天资。",0,"人们对运动的态度可能随时间而改变。","Her attitude changed when she saw the beanbag had cup holders.","她本来没兴趣，可一看懒人沙发还有杯托，态度立刻变了。","attitude"],["behaviour","bɪˈheɪvjə","n.","行为；表现","The study compared actual behaviour with what participants reported.","behavior 是美式拼写。",0,"这项研究将参与者的实际行为与他们自己报告的行为作了比较。","Her behaviour seemed odd, though: she regularly slept through every meal.","不过她的行为有点怪：她经常一觉把三顿饭全睡过去。","behaviour"],["cognitive","ˈkɒɡnətɪv","adj.","认知的","Sleep plays a role in several cognitive processes.","recognition 是识别或认可。",0,"睡眠在多种认知过程中发挥作用。","I wasted my last cognitive resources on naming imaginary sheep.","我把最后一点脑力都花在给想象中的羊起名字上了。","cognitive"],["condition","kənˈdɪʃən","n.","状况；条件","Participants completed the task under two different conditions.","situation 偏具体局势。",0,"参与者在两种不同的条件下完成了这项任务。","One condition was letting the app read our sleep logs.","想参赛有个条件，得让软件读取我们的睡眠记录。","condition"],["consequence","ˈkɒnsɪkwəns","n.","后果；结果","A common consequence of poor sleep is reduced attention.","sequence 是顺序。",0,"睡眠质量差的常见后果之一是注意力下降。","The unexpected consequence was that the organiser let SleepQueen keep the beanbag.","没想到，最后组织者竟然让睡眠女王把懒人沙发留下了。","consequence"],["cope","kəʊp","v.","应对；处理","Some people cope with stress by changing their routines.","tackle 可直接接问题，cope 通常接 with。",0,"有些人通过改变日常作息来应对压力。","We learned to cope with a decent night’s sleep earning us absolutely nothing.","我们得学着接受一件事：好好睡一觉，真的一分也赚不到。","cope"],["disorder","dɪsˈɔːdə","n.","失调；混乱","The research focused on people with a sleep disorder.","disease 可指疾病，disorder 偏功能紊乱。",0,"这项研究以患有睡眠障碍的人为研究重点。","She pointed at the kitchen, which was in complete disorder.","她指指厨房，里面已经完全乱成一团。","disorder"],["exposure","ɪkˈspəʊʒə","n.","接触；暴露","Evening exposure to bright light may delay sleep.","exposition 是说明或展览。",0,"晚上接触强光可能使人更晚入睡。","After weeks of exposure to those cheerful alerts, I heard them in my dreams.","被那些欢快的提示音轰炸了几个星期，我做梦都能听见。","exposure"],["habit","ˈhæbɪt","n.","习惯","A habit becomes easier to maintain when it fits an existing routine.","habitat 是栖息地。",0,"如果一个习惯能融入原有的日常安排，往往更容易坚持。","Jo already had a habit of falling asleep during every film.","乔早就有个习惯，每次看电影都会睡着。","habit"],["imply","ɪmˈplaɪ","v.","暗示；意味着","The findings imply that small changes can have lasting effects.","infer 是读者根据线索推断。",0,"研究结果表明，微小的改变也可能产生持久的影响。","Eighteen hours of sleep a day seemed to imply something was wrong.","一天睡十八个小时，听起来肯定哪里不对。","imply"],["improve","ɪmˈpruːv","v.","改善；提高","Short breaks may improve concentration during long sessions.","prove 是证明。",0,"长时间进行一项活动时，短暂休息可能有助于集中注意力。","My first attempt to improve morale involved buying everyone biscuits.","为了提振士气，我做的第一件事就是请大家吃饼干。","improve"],["intervention","ˌɪntəˈvenʃən","n.","干预；介入","The intervention encouraged workers to take regular breaks.","interference 常强调干扰。",0,"这项干预措施鼓励员工定时休息。","Jo staged an intervention when I pointed a spoon at the cat.","我拿勺子对着猫当话筒，乔实在看不下去，上来拦我了。","intervention"],["mental","ˈmentəl","adj.","心理的；精神的","Social support is associated with better mental health.","moral 是道德的。",0,"社会支持与较好的心理健康状况相关。","For my mental health, I deleted the app for an entire minute.","为了我的心理健康，我把软件删了，足足坚持了一分钟。","mental"],["motivation","ˌməʊtɪˈveɪʃən","n.","动机；积极性","Interest in a subject can sustain motivation over a semester.","motive 偏具体行为的动机。",0,"对一门学科的兴趣可以让人在整个学期保持学习动力。","My motivation was the first prize: an enormous beanbag chair.","我参加的动力就是一等奖：一个超大的懒人沙发。","motivation"],["observe","əbˈzɜːv","v.","观察；遵守","Scientists observed how people responded to interruptions.","reserve 是保留。",0,"科学家观察了人们在被打断时的反应。","She sighed and invited us to observe the champion in person.","她叹了口气，请我们自己去现场观察冠军。","observe"],["perception","pəˈsepʃən","n.","感知；看法","Social comparison can influence people's perception of success.","perspective 偏观察问题的视角。",0,"社会比较可能影响人们对成功的看法。","Seeing a cat on her desk changed my perception of the competition.","一看她桌上趴着只猫，我对这比赛的看法就变了。","perception"],["physical","ˈfɪzɪkəl","adj.","身体的；物理的","Physical activity was higher among people who walked to work.","physiological 偏生理机能。",0,"步行上班的人身体活动量更大。","The physical signs were obvious; I was yawning into my cereal.","身体的反应再明显不过了，我吃着麦片都在打哈欠。","physical"],["prevent","prɪˈvent","v.","预防；阻止","A consistent routine may prevent minor problems from getting worse.","protect 常搭配 from 或 against。",0,"规律的作息或许能防止小问题恶化。","To prevent another scandal, she shut down the leaderboard.","为了避免再闹出什么丑闻，她直接关掉了排行榜。","prevent"],["reduce","rɪˈdjuːs","v.","减少；降低","A brief walk can reduce feelings of fatigue.","deduce 表示推断。",0,"短时间散步可以减轻疲劳感。","To reduce temptation, we turned off all the sleep reminders.","为了少一点诱惑，我们把所有睡眠提醒都关了。","reduce"],["risk","rɪsk","n./v.","风险；冒险","Long periods of inactivity may increase the risk of illness.","hazard 常指可能造成伤害的源头。",0,"长时间缺乏活动可能增加患病风险。","The organiser decided to risk telling the club how she’d tested the app.","组织者决定冒个险，告诉大家她是怎么测试软件的。","risk"],["seek","siːk","v.","寻求；试图","People are more likely to seek help when services are easy to find.","search for 强调查找，seek 也可表示试图。",0,"如果容易找到相关服务，人们就更有可能寻求帮助。","Meanwhile, I went to seek advice from the champion herself.","另一边，我跑去向冠军本人请教。","seek"],["symptom","ˈsɪmptəm","n.","症状；征兆","Difficulty sleeping can be a symptom of stress.","syndrome 是一组症状构成的综合征。",0,"睡眠困难可能是压力带来的一种症状。","Jo said every yawn was a symptom of my competitive streak.","乔说，我每打一次哈欠，都是好胜心太强的表现。","symptom"],["treatment","ˈtriːtmənt","n.","治疗；对待","The study compared two approaches to treatment.","cure 强调治愈。",0,"这项研究比较了两种治疗方法。","SleepQueen received the royal treatment and never fetched her own dinner.","睡眠女王享受的是贵宾待遇，晚饭从来不用亲自去拿。","treatment"],["wellbeing","ˌwelˈbiːɪŋ","n.","福祉；身心健康","Access to green spaces can support mental wellbeing.","welfare 常指社会福利。",0,"能接触到绿地有助于维护心理健康。","I joined a wellbeing club that awarded points for sleeping.","我加入了一个身心健康俱乐部，睡觉还能拿积分。","wellbeing"],["appetite","ˈæpɪtaɪt","n.","食欲；欲望","Changes in sleep can affect appetite the following day.","aptitude 是天资或能力倾向。",1,"睡眠的变化可能影响第二天的食欲。","I had an appetite, but I kept forgetting to toast the bread.","我倒是有胃口，就是老忘了把面包放进吐司机。","appetite"],["compulsion","kəmˈpʌlʃən","n.","强烈冲动；强迫","Some users describe a compulsion to check their messages.","compulsion 强调难以控制，impulse 可指一时冲动。",1,"有些用户说，他们总是忍不住查看消息。","She admitted she felt a compulsion to check them.","她承认，自己就是忍不住想去看那些徽章。","compulsion"],["conscious","ˈkɒnʃəs","adj.","意识到的；有意识的","Participants were not always conscious of how often they checked the time.","conscience 是良心。",1,"参与者并不总能意识到自己看时间有多频繁。","I became painfully conscious of every time I rolled over.","我只要一翻身，自己就察觉得一清二楚，难受极了。","conscious"],["consistent","kənˈsɪstənt","adj.","一致的；持续的","The results were consistent across three different age groups.","constant 强调不变或不停。",1,"三个不同年龄组的结果保持一致。","One account, SleepQueen, had a perfectly consistent bedtime.","有个叫“睡眠女王”的账号，就寝时间分毫不差。","consistent"],["diagnose","ˈdaɪəɡnəʊz","v.","诊断；判断原因","Clinicians use several sources of information to diagnose sleep disorders.","diagnosis 是名词。",1,"临床医生会结合多方信息来诊断睡眠障碍。","To diagnose the problem, we asked the organiser who SleepQueen was.","为了查出问题在哪，我们去问组织者，睡眠女王到底是谁。","diagnose"],["distract","dɪˈstrækt","v.","分散注意力","Background noise can distract readers from a demanding task.","detract from 意为降低价值。",1,"背景噪声可能让读者在做难度较高的任务时分心。","The cat was there to distract us whenever we missed competing.","每当我们怀念比赛，那只猫就在边上分散我们的注意力。","distract"],["fatigue","fəˈtiːɡ","n./v.","疲劳；使疲劳","Fatigue increased after several nights of interrupted sleep.","tiredness 泛指累，fatigue 常指出明显或持续的疲劳。",1,"连续几晚睡眠中断后，疲劳感加重了。","By breakfast, fatigue made even opening a cupboard feel ambitious.","到了吃早饭的时候，我累得连开橱柜都像在挑战自己。","fatigue"],["foster","ˈfɒstə","v.","培养；促进","Supportive relationships foster confidence in young adults.","force 强调强迫。",1,"能够提供支持的人际关系有助于年轻成年人建立自信。","We kept the club, hoping it might foster something better than rivalry.","俱乐部没解散，我们希望能培养点比互相较劲更有意思的东西。","foster"],["immune","ɪˈmjuːn","adj.","免疫的；不受影响的","Sleep is important for a healthy immune system.","immunity 是免疫力或豁免。",1,"睡眠对于维持健康的免疫系统很重要。","The champion seemed immune to the shame of wearing a test tracker.","冠军脖子上戴着测试用的睡眠记录仪，一点也不觉得脸红。","immune"],["impulse","ˈɪmpʌls","n.","冲动；推动力","Many users reported an impulse to check messages during breaks.","pulse 指脉搏。",1,"许多用户表示，休息时他们会产生查看消息的冲动。","On impulse, I challenged my flatmate Jo to beat me.","我一时冲动，向室友乔下战书，让她来超过我。","impulse"],["intensity","ɪnˈtensəti","n.","强度；剧烈程度","The intensity of exercise mattered more than its duration.","intention 是意图。",1,"运动的强度比持续时间更重要。","The intensity of my frustration surprised even Jo when SleepQueen topped the board again.","睡眠女王又登顶了，我有多气，连乔都没料到。","intensity"],["nutrition","njuːˈtrɪʃən","n.","营养；营养学","Better nutrition can improve concentration in the classroom.","nutrient 指具体营养素。",1,"更好的营养可以提高学生在课堂上的专注力。","Nutrition at our table now meant cereal straight from the box.","我们餐桌上所谓的营养餐，现在就是直接从盒子里抓麦片吃。","Nutrition"],["persistent","pəˈsɪstənt","adj.","持续的；执着的","Persistent stress may affect a person's ability to sleep.","consistent 强调前后一致。",1,"持续的压力可能让人难以正常入睡。","I’d developed a persistent urge to inspect my sleeping score.","我总有股挥之不去的冲动，想去看自己的睡眠分数。","persistent"],["rehabilitation","ˌriːhəbɪlɪˈteɪʃən","n.","康复；恢复","Patients received rehabilitation after leaving hospital.","recovery 指恢复过程或结果。",1,"患者出院后接受了康复治疗。","Our rehabilitation began with leaving the phones outside the bedroom.","我们的康复第一步：睡前把手机放在卧室外面。","rehabilitation"],["resist","rɪˈzɪst","v.","抵抗；忍住","Participants found it difficult to resist checking their phones.","insist 是坚持主张。",1,"参与者发现自己很难忍住不看手机。","I tried to resist checking my score, then remembered it no longer existed.","我努力忍住不查分，然后才想起来，已经没分可以查了。","resist"],["stimulus","ˈstɪmjələs","n.","刺激；激励因素","Each participant responded to the same visual stimulus.","stimuli 是复数。",1,"每位参与者都对同一个视觉刺激作出了反应。","Any stimulus, even a fridge buzz, now made me check my phone.","现在随便一点刺激，哪怕是冰箱嗡嗡响，我都要去看手机。","stimulus"],["trigger","ˈtrɪɡə","v./n.","引发；诱因","An unexpected interruption can trigger a stress response.","initiate 偏主动发起。",1,"突如其来的打断可能引发应激反应。","One notification could trigger another hour of checking my score.","一来通知，我又能盯着自己的分数看上一个小时。","trigger"],["empathy","ˈempəθi","n.","共情；同理心","Reading accounts of unfamiliar experiences may foster empathy.","sympathy 偏同情或理解支持。",2,"阅读关于自己不熟悉的经历的叙述，可能有助于培养同理心。","Jo showed surprising empathy when I admitted I still wanted to win.","我承认自己还是想赢，乔居然挺能理解我。","empathy"],["prevalence","ˈprevələns","n.","流行程度；患病率","Researchers measured the prevalence of anxiety among students.","incidence 常指一定时期的新发比例或率。",2,"研究人员测量了学生群体中焦虑的普遍程度。","The prevalence of near-perfect scores on the leaderboard surprised us.","排行榜上接近满分的人也太多了，我们都很惊讶。","prevalence"],["prolonged","prəˈlɒŋd","adj.","长时间的；持续的","Prolonged sitting was associated with poorer health outcomes.","permanent 强调永久。",2,"久坐与较差的健康状况相关。","A prolonged nap on the desk had earned her forty points.","它在桌上打了个超长的盹，就拿了四十分。","prolonged"],["sedentary","ˈsedəntəri","adj.","久坐的；少动的","A sedentary lifestyle was more common among office workers.","stationary 指静止不动。",2,"久坐的生活方式在办公室职员中更常见。","SleepQueen, it turned out, led a spectacularly sedentary life.","原来睡眠女王过的是一种相当彻底的久坐生活。","sedentary"],["susceptible","səˈseptəbəl","adj.","易受影响的；易患病的","Children may be particularly susceptible to disrupted routines.","vulnerable 偏脆弱或面临风险。",2,"日常作息被打乱时，儿童可能尤其容易受到影响。","Jo was susceptible to the badges too, despite her wise lectures.","乔虽然大道理讲得好听，自己对徽章也毫无抵抗力。","susceptible"],["therapy","ˈθerəpi","n.","治疗；疗法","The fi ent was accused of drumming at midnight.","我们楼里最安静的住户被投诉半夜打鼓。","resident"],["rural","ˈrʊərəl","adj.","乡村的","Rural communities often face longer journeys to essential services.","urban 指城市的。",0,"乡村居民往往需要走更远的路才能获得基本服务。","In his rural village, families made that noise beating dusty rugs.","在他的乡下老家，人们拍打积灰的地毯时就是这个动静。","rural"],["social","ˈsəʊʃəl","adj.","社会的；社交的","Social expectations can influence career choices.","sociable 常指爱交际的。",0,"社会期待可能影响职业选择。","Someone shared the meeting online, and social media made it worse.","有人把会议传到网上，社交媒体把事情闹得更大了。","social"],["volunteer","ˌvɒlənˈtɪə","n./v.","志愿者；自愿做","Volunteers helped residents use the new booking system.","voluntary 是自愿的。",0,"志愿者帮助居民使用新的预约系统。","Asha asked for a volunteer to follow the sound downstairs.","阿莎问谁愿意顺着声音到楼下一探究竟。","volunteer"],["widespread","ˈwaɪdspred","adj.","广泛的；普遍的","The change won widespread support among local residents.","broad 泛指宽广，widespread 强调分布广。",0,"这项变动在当地居民中获得了广泛支持。","There was widespread agreement that the noise came from upstairs.","大家普遍认定，声音是从楼上传来的。","widespread"],["abolish","əˈbɒlɪʃ","v.","废除","The council decided to abolish charges for library cards.","abandon 泛指放弃。",1,"地方议会决定取消图书证收费。","The committee voted to abolish the rule that had silenced Asha.","委员会投票废除了原先让阿莎没法说话的那条规定。","abolish"],["barrier","ˈbæriə","n.","障碍；屏障","Unclear instructions can become a barrier to using public services.","boundary 指界限。",1,"说明不清楚可能妨碍人们使用公共服务。","That was a barrier for anyone living with their parents.","这条规定卡住了所有和爸妈一起住的人。","barrier"],["bureaucracy","bjʊəˈrɒkrəsi","n.","官僚体制；繁琐程序","The scheme reduced bureaucracy by introducing a single application form.","democracy 是民主制度。",1,"该方案通过采用统一的申请表，简化了繁琐的行政手续。","He fought bureaucracy by handing me three more forms.","他说要简化手续，转手又递给我三张表。","bureaucracy"],["citizen","ˈsɪtɪzən","n.","公民；市民","Citizens were invited to comment on the development plans.","resident 是居住者，身份不一定是公民。",1,"有关方面邀请市民就发展规划发表意见。","Even the chair admitted that being a good citizen meant listening.","连主席都承认，一个好 amed Dev recognised the rhythm from his childhood.","一位叫德夫的移民邻居听出了那个节奏，他小时候听过。","immigrant"],["integrate","ˈɪntɪɡreɪt","v.","融入；整合","The project integrated services that had previously operated separately.","integrity 指正直或完整性。",1,"该项目整合了此前各自独立运作的服务。","He asked the committee to integrate younger tenants into future inspections.","他请委员会以后检查楼里的问题时，也让年轻住户参加。","integrate"],["justice","ˈdʒʌstɪs","n.","公正；司法","Effective access to justice depends on affordable legal advice.","justification 是理由或辩解。",1,"要切实获得司法救济，人们需要负担得起的法律咨询。","For Asha, justice meant getting an apology on that very noticeboard.","对阿莎来说，讨回公道就是让道歉贴到同一块公告板上。","justice"],["marginal","ˈmɑːdʒɪnəl","adj.","边缘的；微小的","The change produced only a marginal improvement in access.","minimal 强调最少或极小。",1,"这一变动只略微改善了人们获得服务的机会。","A foam pad made only a marginal difference to the noise.","塞了块海绵垫，动静也只小了一点。","marginal"],["migration","maɪˈɡreɪʃən","n.","迁移；迁徙","Rural migration changed the age profile of several districts.","immigration 偏迁入某国。",1,"乡村人口的迁移改变了几个地区的年龄结构。","Dev joked that migration hadn't made him forget his mother's carpets.","德夫开玩笑说，搬到异国也没让他忘了妈妈的地毯。","migration"],["tradition","trəˈdɪʃən","n.","传统；惯例","The festival continues a tradition that has adapted across generations.","custom 常指具体风俗。",1,"这个节日延续了一项历经数代、不断调整的传统。","We started a tradition of bringing something noisy and something delicious.","我们有了个新传统，赴会时带一样能弄出声的东西，再带一样好吃的。","tradition"],["affiliation","əˌfɪliˈeɪʃən","n.","隶属；关联","Political affiliation influenced some residents' responses.","affection 是感情。",2,"政治归属影响了部分居民的回答。","The chair then cited Dev's affiliation with a drumming club as evidence.","主席接着说，德夫是鼓乐社的成员，这就是证据。","affiliation"],["civic","ˈsɪvɪk","adj.","公民的；城市公共的","Libraries can support civic participation by hosting discussions.","civil 也可指民事的或礼貌的。",2,"图书馆可以通过举办讨论活动来促进公民参与。","Asha called reporting the loose hinge her civic duty, then filed it twice.","阿莎说，上报松掉的门铰链是她的公民义务，然后她报了两遍。","civic"],["conform","kənˈfɔːm","v.","遵守；符合","People sometimes conform
