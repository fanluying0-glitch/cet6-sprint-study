ne","baseline"],["measure","measured"]]],["His hypothesis was that the rider took a detour. He set one parameter to check the app whenever the order ran five minutes late.","他的假设是骑手绕路。他还定了个参数，迟五分钟就去查一次软件。",[["hypothesis","hypothesis"],["parameter","parameter"]]],["Then he remembered he lived in Building Three. His saved address had said Building Five since last year.","后来他想起来，自己住三号楼。软件里存的却是五号楼，从去年就没改过。",[]]]],["我爸证明数学能管住猫",[["Dad wanted empirical data to confirm that our cat came running at the rustle of a plastic bag.","我爸说，得有实测数据，才能确认猫一听见塑料袋响就跑过来。",[["empirical","empirical"],["confirm","confirm"]]],["He used the cat's meow as his indicator and recorded each interval to quantify how quickly she responded.","他把猫叫当信号，记下每次间隔，用数字算猫来得有多快。",[["indicator","indicator"],["interval","interval"],["quantify","quantify"]]],["He checked the accuracy of the timer and tried to keep the trials comparable.","他核对了计时器准不准，也尽量把几次测试放在相近的条件下做。",[["accuracy","accuracy"],["comparable","comparable"]]],["When the rustle and the meow were almost simultaneous, he took the correlation as proof of a causal link.","袋子和猫几乎同时出声时，他就把两件事有关，当成了一件事引起另一件事的证明。",[["simultaneous","simultaneous"],["correlation","correlation"],["causal","causal"]]],["Mum locked up the cat food. Dad shook bags for half the evening, and the only one who came running was me.","我妈把猫粮锁起来了。我爸晃了半晚上袋子，最后跑过来的只有我。",[]]]],["门铃拍到一个会消失的人",[["I checked footage from the external camera to determine who the vanishing figure was.","我去查外面的监控录像，想弄明白那个会消失的人是谁。",[["external","external"],["determine","determine"]]],["From one sample, I could infer from the reflection that the figure wore a uniform. From the footsteps, I deduced it was a child.","我截了一段录像，凭反光推断那个人穿着校服，再凭脚步声推断是个孩子。",[["sample","sample"],["infer","infer"],["deduce","deduced"]]],["My roommate suspected the figure was a visual artifact. We derived one prediction from that idea. It would disappear if we changed the angle.","室友怀疑那个人影是成像假象。按他的想法推算，换个角度，人影就该消失。",[["artifact","artifact"],["derive","derived"]]],["We managed to reproduce the image at the original angle and replicate the disappearance. The security footage corroborated our result.","我们在原角度重现了人影，也复现了它消失的过程。保安的录像证实了我们的结果。",[["reproduce","reproduce"],["replicate","replicate"],["corroborate","corroborated"]]],["It was a bubble tea shop's cardboard standee. The glass door had reflected it twice.","那是奶茶店的人形广告立牌，玻璃门把它映出了两个影子。",[]]]],["谁把冰箱里的蛋糕吃了",[["My weight-loss goal was abstract. A missing cake was extremely concrete, and my tentative suspect was my roommate.","减肥目标挺抽象，冰箱里少了蛋糕可太具体了。我暂时把嫌疑锁定在室友身上。",[["abstract","abstract"],["tentative","tentative"]]],["He had a tendency to sneak snacks, but one clue was integral to the case. The box was still sealed.","他是有偷吃零食的习惯，可这回有个关键线索。盒子还封着。",[["tendency","tendency"],["integral","integral"]]],["My new finding was that the box felt suspiciously light. I weighed it to get more robust evidence.","我的新发现是，盒子轻得有些可疑。为了让证据更扎实，我拿去称了称。",[["finding","finding"],["robust","robust"]]],["The method was applicable here, though I wouldn't generalise from it to every missing cake.","这个办法在这里用得上。可要是每回丢蛋糕都照这么查，我还是会谨慎点。",[["applicable","applicable"],["generalise","generalise"]]],["I finally grasped the concept that an empty box has weight too. From the order history, I concluded I'd bought one six-inch cake box.","最后我终于弄懂一个道理，空盒子也是有重量的。我去翻订单，得出的结论是，我买的是「六寸蛋糕盒一只」。",[["concept","concept"],["conclude","concluded"]]]]]],[["一等奖原来住在食堂",[["Someone asserted that the winning photo at the school anniversary had been altered.","校庆摄影赛刚评完奖，就有人一口咬定得奖照片动过手脚。",[["assert","asserted"],["alter","altered"]]],["The cat in the canteen queue appeared a little too well behaved.","食堂队伍里那只猫，看着未免太懂规矩了。",[["appear","appeared"]]],["Xiao Zhou accompanied the judges to meet a canteen worker known for her approachability. She cheerfully acknowledged that she saved the cat a place.","小周陪评委去找那位出了名好说话的食堂阿姨。阿姨乐呵呵地承认，每天都给猫留了个位置。",[["accompany","accompanied"],["approachability","approachability"],["acknowledge","acknowledged"]]],["The judges hoped to capture the scene themselves and gather compelling evidence.","评委打算亲手拍下现场，找点让人信服的证据。",[["capture","capture"],["compelling","compelling"]]],["Contrary to expectations, the photo was real. The worker produced a register: the cat had attained a record of twenty days in a row without being late.","没想到，照片居然是真的。阿姨掏出一本考勤册：那只猫已经连续二十天准时来排队了。",[["contrary","contrary"],["attain","attained"]]]]],["停电通知差了一位数字",[["The dorm group chat warned of a power cut. The warden posted a notice to debunk the rumour, but people had already lit candles.","宿舍群都在传今晚要停电。值班阿姨贴出通知辟谣，可蜡烛已经点起来了。",[["debunk","debunk"]]],["One digit in the building number was crucial. The old screenshot contradicted that morning's notice.","楼号里有一位数字要命。群里的旧截图跟今早的新通知根本对不上。",[["crucial","crucial"],["contradict","contradicted"]]],["She explained the extent of the mix-up: only the other building would lose power.","她把误会的范围说清楚了：停电的只有隔壁那栋。",[["explain","explained"],["extent","extent"]]],["She put the emphasis on that fundamental difference and held up both notices to illustrate it.","她把两张通知举起来比，一再强调这才是最要紧的区别。",[["emphasis","emphasis"],["fundamental","fundamental"],["illustrate","illustrate"]]],["Despite the false alarm, she still endorsed keeping a torch handy, especially for the student with three boxes of candles.","虽然白紧张了一场，她还是赞成备个手电筒，特别是那个囤了三箱蜡烛的舍友。",[["despite","despite"],["endorse","endorsed"]]]]],["想白喝奶茶的会计",[["At the prospect of milk tea sponsorship, the club president incorporated the notion of free refills into the festival plan.","一听说奶茶店可能赞助校庆，社长兴冲冲地把免费续杯写进方案。",[["prospect","prospect"],["notion","notion"],["incorporate","incorporated"]]],["The treasurer spotted one particular rule: the offer covered only the first ten people.","财务却盯住了一条细则：只送给前十位。",[["particular","particular"]]],["The shopkeeper would readily quote a price for everyone else, but refused to expand the scope of the offer.","超出名额的人，店主倒乐意报价；可赞助范围一点都不肯扩大。",[["readily","readily"],["quote","quote"],["scope","scope"]]],["The treasurer stuck to the principle of fairness and warned that a rush could pose a safety risk.","财务坚持公平，还提醒大家，一拥而上容易出事。",[["principle","principle"],["pose","pose"]]],["It looked probable that the treasurer would get the first cup. She had already paid for it herself.","最后最有可能先喝到奶茶的，反而是财务本人。她已经自己付了钱。",[["probable","probable"]]]]],["修车摊搬进停车棚",[["As urbanisation turned the vacant lot into flats, the old repair stand lost its space. The property managers agreed to undertake the search for another spot.","随着城市化推进，空地上盖起了住宅，老修车摊没了去处。物业答应负责另找地方。",[["urbanisation","urbanisation"],["undertake","undertake"]]],["They had to tackle the noise first. Opinions varied widely depending on what time of day people were at home.","得先想办法处理噪音。居民什么时候在家，意见就跟着变。",[["tackle","tackle"],["vary","varied"]]],["The ultimate solution was to shift the stand into the parking shelter and supplement the walls with a soundproof panel.","最终的方案是把摊位挪进停车棚，再加块隔音板。",[["ultimate","ultimate"],["shift","shift"],["supplement","supplement"]]],["Good ventilation was vital in that space, so the plan warranted one more safety check.","那个棚里通风很要紧，方案值得再做一遍安全检查。",[["vital","vital"],["warrant","warranted"]]],["An unprecedented queue formed on the first morning. At the front stood the property manager, pushing his child's bike.","试营业头一早就排了前所未有的长队。排在最前面的，是推着孩子自行车的物业经理。",[["unprecedented","unprecedented"]]]]],["一张表救不了团购",[["The residents' group orders had a price advantage, but tight pickup hours constrained how many people could use them.","小区团购买得便宜，可取货就那么一会儿，赶得上的人并不多。",[["advantage","advantage"],["constrain","constrained"]]],["The coordinator and her counterpart in the next building were interdependent. When each lost an order, neither wanted to admit it.","这栋楼的负责人跟隔壁楼的同行原本互相帮忙。一人弄丢一单后，谁都不愿认。",[["counterpart","counterpart"],["interdependent","interdependent"]]],["The residents' committee asked them to elaborate and checked which claims the order records justified.","居委会让两边把事情讲详细，再拿订单记录看谁的说法站得住。",[["elaborate","elaborate"],["justify","justified"]]],["Qualitative feedback revealed the same complaint again and again: people getting off work late could never collect their vegetables.","看了大家的文字反馈，比什么数据都清楚：下班晚的人老是赶不上取菜。",[["qualitative","qualitative"]]],["They reached a compromise: one person would take the early shift and the other the late one. The shifts would complement each other, and one missing bag would no longer undermine trust in the whole scheme.","两人各让一步，一人守早班，一人守晚班。值班时间正好互补，以后也不至于丢一袋菜就把大家的信任全丢了。",[["compromise","compromise"],["complement","complement"],["undermine","undermine"]]]]]],[["校史展台上的大搪瓷缸",[["The school history club wanted to exhibit an old enamel mug. The president was convinced it was ancient.","校史社想展出一只老搪瓷缸。社长深信这一定是古物。",[["exhibit","exhibit"],["ancient","ancient"]]],["The architecture in the photo was characteristic of the Republican era, but the craft used to decorate the mug was distinct from anything the club had seen in that period.","照片里的楼是典型的民国建筑，搪瓷缸上的装饰工艺却跟他们见过的民国物件很不一样。",[["architecture","architecture"],["characteristic","characteristic"],["craft","craft"],["distinct","distinct"]]],["Students searched historical records to document the evolution of the mug's design.","大家去翻历史档案，想把这只缸的款式是怎么演变的记录下来。",[["historical","historical"],["document","document"],["evolution","evolution"]]],["It turned out to be a souvenir from an exchange between two schools.","查到最后，原来是两所学校交流时送的纪念品。",[["exchange","exchange"]]],["An alumnus recognised it at once. He used to eat instant noodles out of it.","有位校友一眼认出来了。当年他就是用它泡方便面的。",[]]]],["外婆的修伞摊",[["The little stone monument at the entrance to the lane advertised the Moon Matchmaker Umbrella Shop. Everyone had a romantic interpretation of that name.","巷口的小石碑上刻着「月老伞铺」。这名字一听，谁都往浪漫的地方猜。",[["monument","monument"],["interpretation","interpretation"]]],["She inherited the umbrella stand from her grandmother, restored the sign and took charge of the preservation of the old umbrella frames.","她接过外婆的修伞摊，修好旧招牌，老式伞骨也尽力留着。",[["inherit","inherited"],["restore","restored"],["preservation","preservation"]]],["The neighbours gave her work the recognition it deserved, and the business began to prosper again.","街坊都认可她的手艺，摊子的生意也重新红火起来。",[["recognition","recognition"],["prosper","prosper"]]],["Her grandmother's influence showed in the care she took over every umbrella.","看她一把一把修得那么仔细，就知道学的是外婆。",[["influence","influence"]]],["One day she took down the sign, and faded writing on the back revealed the origin of the name. Grandma's surname was Yue, meaning moon.","有天她把招牌拆下来，背面褪色的老字道出了名字的来历：外婆姓月。",[["reveal","revealed"],["origin","origin"]]]]],["一场特别短的龙舟赛",[["The village held an opening ceremony to commemorate its old ferry crossing.","村里为了纪念老渡口，办了场开幕仪式。",[["commemorate","commemorate"],["ceremony","ceremony"]]],["Children used phones to chronicle the paddlers' technique. Their clips went into wide circulation and gave local tourism a boost.","孩子们用手机拍下划桨的技巧。短视频到处流传，还把村里的旅游带火了。",[["chronicle","chronicle"],["technique","technique"],["circulation","circulation"],["tourism","tourism"]]],["Striking the gong before the race was a local ritual and a symbol of the dragon boat teams.","赛前敲一声锣，是当地的仪式，也是龙舟队认得的标志。",[["ritual","ritual"],["symbol","symbol"]]],["The younger villagers saw the significance of the custom and set the footage to contemporary music.","年轻人明白这个习惯的意义，就给视频配上了现代音乐。",[["significance","significance"],["contemporary","contemporary"]]],["The gong rang. The judge looked down and discovered that both boats were still tied up.","锣响了。裁判低头一看，两条船都还拴着。",[]]]],["鱼缸里的石头要归还吗",[["A museum employee and practitioner of archaeology heard an oral account in a village: a relic of a dynasty based in the next province lay by the old well.","博物馆一位从事考古的人到村里听到个口述传闻：邻省某个王朝的遗物就藏在老井边。",[["practitioner","practitioner"],["oral","oral"],["province","province"],["dynasty","dynasty"],["relic","relic"]]],["The museum got permission to excavate and uncovered a plaque made of stone indigenous to the area.","博物馆获准发掘，找出一块用本地石料刻的牌子。",[["excavate","excavate"],["indigenous","indigenous"]]],["An old man's manuscript portrayed it as an official seal.","一位老人的手稿把它写成了一枚官印。",[["manuscript","manuscript"],["portray","portrayed"]]],["An expert checked whether anyone had forged the lettering.","专家仔细查看那几个字是不是伪造的。",[["forge","forged"]]],["A villager recognised it instantly. His grandfather had carved the stone to prop up a fish tank.","一位村民一眼就认出来了：这石头是他爷爷刻来垫鱼缸的。",[]]]],["旧街的新招牌",[["After the old street's revival, volunteers led an urban archaeology walk along the original route.","老街复兴后，志愿者沿着原先的路线带大家逛了一趟，边走边讲街区考古。",[["revival","revival"],["route","route"],["archaeology","archaeology"]]],["A textile shop had put a pottery vessel on display.","一家布店展出了一个陶盆。",[["textile","textile"],["pottery","pottery"],["vessel","vessel"]]],["The inscription, written in fine calligraphy, said that even a single coin could not be owed.","盆上字倒写得漂亮，题的却是「一文不赊」。",[["calligraphy","calligraphy"],["inscription","inscription"]]],["The magic treasure bowl of local folklore turned out to be where the shopkeeper kept the bills.","当地传说里那只能聚宝的盆，原来只是老板放账单的地方。",[["folklore","folklore"]]],["The real secret of the street's prosperity, it seemed, was simply never selling on credit.","这条街兴旺的秘诀看来很朴素，就是从来不赊账。",[["prosperity","prosperity"]]]]]],[["节目单上藏着张外卖单",[["The accelerated rehearsal for the graduation show caught everyone off guard. Nobody could anticipate that the hall lights would suddenly cease working.","毕业晚会彩排突然提了速。谁都没料到，礼堂的灯说灭就灭。",[["accelerated","accelerated"],["anticipate","anticipate"],["cease","cease"]]],["Fixing the lighting at short notice was too complex, so the teacher declared that they would stick to the conventional running order.","临时修灯太复杂，辅导员直接宣布，演出还是照原来的顺序走。",[["complex","complex"],["declared","declared"],["conventional","conventional"]]],["The lighting technician had a definite plan: convert all those phones into stage lights.","灯光师倒有个准主意：把大家的手机都拿来打光。",[["definite","definite"],["convert","convert"]]],["A song would divert the audience's attention, and they could eliminate the introduction altogether.","先唱歌转移观众的注意，报幕干脆就省了。",[["divert","divert"],["eliminate","eliminate"]]],["As the class stepped onto the dark stage, the host realised he was holding his takeaway receipt, not the programme.","全班摸黑上台时，主持人才发现自己捏着的是外卖小票，哪是什么节目单。",[]]]],["占座大战，输给了凉水壶",[["Under the initial arrangement in the study hall, the majority agreed that leaving a bag on a chair counted as sitting in it.","自习室原来的规矩是，大多数人都认，只要椅子上有个书包，座就算有人了。",[["initial","initial"],["majority","majority"]]],["The class representative felt an obligation to help. Staying neutral, she found the real obstacle: two classes ended at exactly the same time.","班长觉得有义务管管。她先不站队，才发现真正的问题是两个班刚好同一时间下课。",[["obligation","obligation"],["neutral","neutral"],["obstacle","obstacle"]]],["Their demands were mutually incompatible. Rows of unused seats at quiet times gave the caretaker an insight into what was going wrong.","两边想占的位置撞在了一起，偏偏人少的时候又会空出一整排。管理员看着空座，想通了问题出在哪。",[["mutually","mutually"],["insight","insight"]]],["A feasible fix was to give seat reservations a time limit. After implementation, the rules began to evolve.","他想了个可行的办法，做一张限时占座牌。实行以后，大家占座的规矩也慢慢变了。",[["feasible","feasible"],["implementation","implementation"],["evolve","evolve"]]],["The first item removed for overstaying was the class representative's own water jug.","第一个占座超时被挪走的，是班长自己的凉水壶。",[]]]],["食堂比赛怎么成了赶集",[["The canteen put out an urgent notice: the dumpling contest and skipping contest would share the sports ground. Staff started to promote both.","食堂发了紧急通知：下午的包饺子赛和跳绳赛要共用操场。员工开始替两场活动做宣传。",[["urgent","urgent"],["promote","promote"]]],["After the last-minute alteration, the two events drew more than a hundred entrants in aggregate.","临时改完安排，两场比赛加起来过了一百人报名。",[["alteration","alteration"],["aggregate","aggregate"]]],["An attendant noticed a parallel between the events. Both had a long queue.","服务员发现两场比赛有个共同点：队都排得老长。",[["attendant","attendant"],["parallel","parallel"]]],["During the transition from one event to the other, an abrupt change in the weather sent significantly more people running across the grounds.","两场比赛转场时，天突然变了，操场上跑来跑去的人明显多了。",[["transition","transition"],["abrupt","abrupt"],["significantly","significantly"]]],["The organisers made check-in compulsory before anyone could get a bowl of soup. Finally, the queue moved in one direction.","组委会干脆规定，想领一碗汤得先签到。总算大家都往一个方向排了。",[["compulsory","compulsory"]]]]],["团建费是怎么省下来的",[["The office outing had gone over budget for three consecutive years. This time, inadequate funds for the coach caused a refund crisis.","公司团建已经连续三年超预算。这回包车钱又不够，退费的事一下成了难题。",[["consecutive","consecutive"],["inadequate","inadequate"],["crisis","crisis"]]],["A colleague formulated a plan to take taxis in groups. The downside was that traffic jams would become inevitable if they left any later.","有人琢磨出分组打车的办法。坏处是，再晚一点出发，肯定得堵在路上。",[["formulate","formulated"],["downside","downside"],["inevitable","inevitable"]]],["To ensure equity for the interns, agreeing who would share each taxi had to precede departure.","为了让实习生也能公平参加，出发前就得先说好谁跟谁拼车。",[["equity","equity"],["precede","precede"]]],["Gradual sharing of the costs made the trip more manageable and reduced the likelihood of anyone falling behind.","费用分批摊开付，大家负担得起，迟到的可能也小了。",[["gradual","gradual"],["likelihood","likelihood"]]],["Just one person arrived late at the meeting point. The manager had taken the metro in the wrong direction.","到了集合点就差一个人：经理把地铁坐反了。",[]]]],["群里最安静的一分钟",[["An inadvertent post told the neighbourhood running group to meet before dawn. A subsequent check showed that the sender had overlooked the scheduling button.","社区夜跑群误发了一条消息，通知大家天没亮就集合。事后一查，原来发消息的人漏看了定时按钮。",[["inadvertent","inadvertent"],["subsequent","subsequent"],["overlook","overlooked"]]],["The administrator put a new time to a vote. The building representative abstained.","群主让大家投票选新时间。楼长投了张弃权票。",[["abstain","abstained"]]],["The only viable answer that night was the cessation of the stream of alarm reminders.","那晚唯一管用的办法，就是让闹钟提醒接龙赶紧停下来。",[["viable","viable"],["cessation","cessation"]]],["The alerts were disruptive to sleep and could impede people's work the next morning. With no new alerts, the late-night messages dwindled.","提醒声扰人睡觉，第二天上班都得受影响。不再发提醒后，深夜消息也渐渐少了。",[["disruptive","disruptive"],["impede","impede"],["dwindle","dwindled"]]],["The administrator brought round soya milk to offset the trouble. Everyone agreed to rename the chat the Failed Early Risers' Support Group.","群主送豆浆给大家赔个不是。全群最后一致同意改名为「早起失败互助会」。",[["offset","offset"]]]]]]];
const WORD_READINGS = [{"title":"A Safe Place to Say Something Difficult","paragraphs":["When the city asked library staff to adopt a new booking system, its managers made an assumption: if they could demonstrate the software, everyone would adapt. An early survey seemed to indicate that most workers understood the change. Yet the first week produced a different outcome. Employees were reluctant to admit confusion, and organised activities began late. An incident at the busiest branch prompted a frustrated visitor to claim that nobody cared. Staff did not recognise their own experience in that account.","The training team decided to assess what people already knew and identify the underlying problem. They found little evidence that staff lacked technical competence. More often, people would hesitate to ask for help because they feared colleagues would perceive the question as criticism. The team was initially skeptical of one proposal: simulate a difficult conversation. Some managers had been quick to attribute every delay to the software. This approach would require them to reflect on their own role as well.","The trainers chose to conduct the exercise at a quiet branch. Each scenario would involve a misunderstanding between two staff members, with no real customer present. Before anyone could misinterpret the task as a performance review, the trainers made clear that mistakes carried no penalty. They asked staff to engage in short exchanges, interact with a different partner each time and respond to detailed feedback. A second facilitator would modify the next scenario to expose a difficulty the first had missed.","Could the practice help staff acquire more effective habits and retain them afterwards? The team decided to establish an informal comparison. Half the branches would implement the exercise immediately; the rest would continue with the old training for four weeks. The trainers would track whether people asked for help earlier and whether the resulting conversations would affect the frequency of delays. The aim was to suggest a practical change, not to assume a single exercise could overcome every obstacle.","The number of late sessions fell at branches that used the exercise. It was too early to say how the new training might contribute to that result. Some branches had also received newer equipment, which could account for part of the difference. Still, interviews pointed to one potentially significant gain: staff had more confidence in speaking up. Managers decided to embrace the new routine, keep comparing branches and reinforce helpful responses in ordinary meetings. They saw its potential to facilitate learning long after the software itself became familiar."],"questions":[{"prompt":"What did the managers initially expect?","options":["A demonstration would be enough for staff to adjust.","Workers would refuse to answer the survey.","New equipment would be needed before training started.","Visitors would teach staff how to use the system."],"answer":0,"explanation":"第 1 段先说 managers made an assumption，后面解释他们以为展示软件后，员工就能适应。adjust 对应 adapt。"},{"prompt":"Why did staff often hesitate to ask for help?","options":["They thought customers would have to wait longer.","They worried their colleagues might take the question as criticism.","They believed the exercise would replace actual training.","They were unsure whether the software was ready."],"answer":1,"explanation":"第 2 段 because 后解释原因。perceive the question as criticism 对应 take the question as criticism。"},{"prompt":"What was one purpose of changing the scenarios?","options":["To give managers a way to grade individual workers.","To persuade real customers to join the exercise.","To bring out a difficulty that an earlier scenario had not revealed.","To make every pair repeat the same conversation."],"answer":2,"explanation":"第 3 段最后一句里，modify 的目的由 to expose 引出。选项用 bring out 改写 expose。"},{"prompt":"Why did the author mention the newer equipment?","options":["To explain why the first survey was inaccurate.","To show that the simulation depended on specialist devices.","To explain why the other branches requested extra training.","To acknowledge another possible cause of the improvement."],"answer":3,"explanation":"末段说设备也可能解释部分差异。作者保留另一种解释，因此尚不能把全部效果归给模拟训练。"},{"prompt":"Which conclusion is best supported by the passage?","options":["All branches should abandon technical training.","Safe practice may help staff speak up, but its effect deserves further checking.","Staff confidence rose mainly because the booking system became easier.","The new system succeeded as soon as all branches used it."],"answer":1,"explanation":"末段结合两个信息：访谈显示大家开口更有信心，但设备等因素也可能影响结果，主管还要继续比较。"}]},{"title":"A Place to Learn After the Last Bell","paragraphs":["Families looking for extra help with schoolwork often find that the most visible option comes with tuition fees. A public library in a small town offered an alternative by turning a spare room into a study centre on weekday evenings. Its primary goal was to address inequality in access to support. The immediate priority was to give children a quiet place to work and a dependable way to obtain help when they got stuck. The library was already a public resource, so it could do this without trying to reproduce the school curriculum.","The organisers had to decide how to allocate places within the room's limited capacity. They could restrict attendance to children who lived nearby, but that would exclude some pupils with the greatest need. Instead, any child with a valid library card could register. The instruction on the sign was simply to show the card and choose a session. Children did not have to qualify by taking a test or enroll for an entire term; they could withdraw and return when they needed help. One nearby branch even offered to transfer spare tables to the centre.","A mentor was available each evening to match volunteers' knowledge to the subject a child brought in, whether that discipline was mathematics, science or languages. Volunteers did not always have formal teaching experience, but short training in tutoring and digital literacy gave them adequate preparation. Children could participate on a flexible timetable while working in a stable environment where they could concentrate. The guidance was relevant to their immediate homework, and there was also time for discussion that could enrich what they had already learned in class.","An independent team came to evaluate the project. It used a survey alongside attendance records rather than relying on exam performance as the only criterion. An interesting pattern appeared: two branches with equivalent opening hours saw different levels of use. At one, session numbers began to decline because the last bus left early. Numerous parents reported the same problem. In this context, free sessions offered little incentive to stay if a child could not get home. That finding led them to revise the timetable and set a new procedure for booking shorter sessions when demand was likely to exceed capacity.","The challenge now is to expand the programme without losing the flexibility that made it useful. A larger centre might enhance the range of subjects available, but the benefit of more volunteers would not outweigh the cost to children who could not reach it. The team therefore recommended making substantial changes to existing branches before building somewhere new. A successful method of offering support begins with asking which obstacles the intended users actually face."],"questions":[{"prompt":"What was the library's primary aim in opening the study centre?","options":["To give local schools a new curriculum to follow.","To make additional help available to children who might lack it.","To develop a fee-paying service that could support library budgets.","To encourage children to spend more time travelling between schools."],"answer":1,"explanation":"第1段直接说明中心想缩小获得学习支持的差距，例如给孩子一个能安静学习并及时问问题的地方。"},{"prompt":"How did the organisers make it easier for children to join the programme?","options":["They reserved the rooms for pupils who lived closest to the library.","They gave each participant a full term of compulsory lessons.","They selected children who had passed a test in their subject.","They required a library card and allowed children to return as needed."],"answer":3,"explanation":"第2段写到持有效图书卡即可登记，无需参加资格考试，也无需报满一学期，有需要时还可以回来。"},{"prompt":"What does the third paragraph say about the guidance children received?","options":["It addressed current schoolwork and could extend learning through discussion.","It was limited to tasks in mathematics and science.","It was available only if children accepted a fixed timetable.","It was aimed primarily at testing the skills of the volunteers."],"answer":0,"explanation":"第3段最后一句说辅导和眼下的作业相关，也留了讨论时间，帮助学生拓展课堂所学。"},{"prompt":"What did the evaluators discover about two branches with equivalent opening hours?","options":["One branch could accept more pupils because its rooms were larger.","One branch demanded higher marks from children in its programme.","Transport could affect attendance despite identical opening hours.","Transport mattered to both branches only when admission fees increased."],"answer":2,"explanation":"第4段指出两处开放时段相同，使用情况却不同，其中一处因为末班车太早，学生参加的人数开始下降。"},{"prompt":"Which point is the author making in the final paragraph?","options":["Consolidating services in one large centre should always be the first step.","The way a programme grows should reflect the barriers its users face.","Offering a broader mix of subjects makes travel difficulties less important.","A flexible programme cannot expand beyond a single branch."],"answer":1,"explanation":"末段指出扩大规模不能牺牲原本的灵活性和可达性。团队建议先改善现有分馆，因地制宜解决学生面临的障碍。"}]},{"title":"When a City Has Too Much Water and Too Little","paragraphs":["An urban district can flood in summer and still face drought a few months later. The same weather forecast that promises abundant rain may lead residents to wonder why clean water remains scarce. The answer is partly in the streets. When hard surfaces cannot absorb rain, water begins to accumulate in low places instead of seeping into the ground. It also picks up any pollutant washed from the road. Where waste disposal is poorly managed, stormwater may contaminate streams that residents once used. Moving it out of the district quickly can protect one street while transferring the problem to another.","One adaptation is to maintain planted spaces alongside existing drainage infrastructure. The two can work together to store water for short periods. A shallow basin can mitigate the impact of a severe storm by slowing the flow and reducing erosion downstream. If a basin retains spare capacity between storms, it can intercept a sudden surge before water reaches a vulnerable part of the neighbourhood. Planted basins can also provide habitat for birds and insects, helping to preserve biodiversity. But trees and plants chosen without regard for the area's ecology may struggle. And polluted runoff can degrade soil over time, so engineers must estimate what comes into the basin as carefully as what leaves it.","Urban agriculture offers another use for stored rainwater. Families may cultivate vegetables in small plots, using compost to help soil retain moisture and drip irrigation to send water directly to roots. Even a modest harvest can support a family's livelihood. Yet asking gardeners to recycle water does not mean every supply is suitable. Any pesticide carried into a storage pond may make its water unsafe for particular uses. Testing, and a clear limit on which sources gardeners may use, are essential when a neighbourhood wants to expand food production.","Equipment can create a different problem. A solar pump uses renewable electricity and can avoid the direct emission of carbon dioxide from burning diesel. Yet cheap pumping may encourage growers to consume more water and eventually exhaust an affordable local source. Officials need to regulate withdrawals, especially if declining groundwater levels threaten households without an alternative. Installing better technology without changing the rules may accelerate the very decline the project was supposed to prevent.","A sustainable water policy therefore needs to ask where water goes, who can use it, and which choices may deplete the reserves that others rely on. Officials should not abandon ordinary conservation measures just because a new project can generate interest. They can improve resilience by combining small changes and checking for adverse environmental effects over several seasons. The threat is easiest to underestimate in a wet month, when flooded streets make it look as though water could never run out."],"questions":[{"prompt":"What is the main point of the passage?","options":["Urban flooding indicates that a city has collected enough water for future use.","Cities can best manage water by making every drainage channel wider.","Managing a city's water requires attention to storage, safe use and long-term supply.","Urban gardens should replace most of a city's conventional drainage system."],"answer":2,"explanation":"全文从城市同时遇到积水与缺水说起，讨论如何蓄水、如何安全利用，以及如何通过节水和管控长期取水来保护储备。"},{"prompt":"Why might draining rainwater away quickly fail to solve the underlying problem?","options":["The water and the resulting difficulties may simply move to a different location.","The process inevitably stops rainfall from entering every district.","Removing rainwater always exposes previously clean soil to pesticides.","Draining rainwater makes a reliable weather forecast harder to obtain."],"answer":0,"explanation":"首段末句指出，迅速排水可能让一条街免于积水，却把问题转移到另一条街。"},{"prompt":"Why does the author say engineers should examine what enters a planted basin?","options":["Birds and insects usually reduce the amount of rain it can hold.","The process is needed to forecast exactly when the next storm will occur.","The design can work only where rainwater contains no solid material.","Polluted runoff can damage the basin's soil over time."],"answer":3,"explanation":"第二段最后一句给出直接因果：流入的径流如果带有污染物，长期下来会损害土壤，因此不能只看流出去的水。"},{"prompt":"What risk can arise when growers switch to solar pumps?","options":["The pumps must use more diesel on cloudy days.","Lower pumping costs may lead to excessive withdrawals from a shared water source.","Better equipment will make groundwater harder to reach.","Adopting renewable energy makes testing stored rainwater unnecessary."],"answer":1,"explanation":"第四段说明，太阳能设备可以避免柴油燃烧的直接碳排放，但抽水更便宜也可能刺激过量取水，导致水源耗尽。"},{"prompt":"Which approach would the author most likely support?","options":["Judge a conservation project during one exceptionally wet month.","Replace rules about water withdrawals with general advice on saving energy.","Test water, control withdrawals and monitor the effects of several measures over time.","Reserve every drop of stored rainwater for emergency use."],"answer":2,"explanation":"第三段提到检测，第四段主张规范取水，末段建议将多种措施结合起来，并跨季节监测影响。"}]},{"title":"The Newspaper That Lost Its Context","paragraphs":["When a small town library put its newspaper archive online, the goal was accessibility. Searching several decades of local media would no longer mean travelling to the library and turning the pages by hand. Teachers expected the platform to draw a younger audience, and older residents welcomed a new channel for sharing family history. The project was especially attractive because the library could automate much of the scanning without hiring a permanent team.","The difficulty became clear when an anonymous account posted a fragment from a 1980s newspaper. The photograph showed shopkeepers carrying goods into the street. A new caption claimed that police had forced the shops to close, and the excerpt began to circulate as credible evidence. The word “forced” in the caption carried a connotation of punishment. In fact, the shops were clearing space for repairs. The original report discussed their frustration with delays, and that nuance had disappeared. Without the surrounding paragraphs, the photograph was ambiguous. The angry commentary reflected a bias towards dramatic stories, but readers had little reason to exaggerate deliberately. They simply did not know enough to interpret the image or verify what a seemingly reliable source was trying to convey.","To understand what had happened, the librarian began to analyze the search data. The algorithm allowed users to filter by date, but it ranked isolated images above complete pages. A scanning device could detect the outline of a photograph, yet shadows at the edges could interfere with its ability to read the accompanying text. As a result, a small error in scanning could distort the record. Another problem began to emerge: a tool designed to enable quick searches could mislead users precisely because its results looked so clean and complete.","The library worked with the local paper to distribute a correction and insert a link to the original page. An editorial explained why the library could clarify the context without having to disclose private details. In another disputed case, for example, finding the identity of someone in a photograph would have required going through confidential records. The team decided that public curiosity did not outweigh a person's privacy and sought consent before sharing information supplied by families.","Making a collection easier to search, then, is only the first step. Libraries need to communicate what a result does and does not establish, monitor how material gets reused and make it easy to cite a complete source. Older collections often transmit information across generations through captions and notes that new readers are tempted to ignore. A good digital tool helps readers distinguish the original account from what later users have made of it."],"questions":[{"prompt":"What was the library's original purpose in putting the newspaper collection online?","options":["To replace local news reporting with public commentary.","To make old issues easier to consult and share.","To identify the people in all historical photographs.","To reorganise family records into one private database."],"answer":1,"explanation":"第1段首句点明目标是 accessibility，后两句解释无需亲自到馆翻报纸，也更便于分享地方和家族历史。"},{"prompt":"What made the mistaken interpretation of the shop photograph seem persuasive?","options":["Several people in the photograph confirmed it.","The captions on the original newspaper pages supported it.","An official announcement about the shops preceded it.","The fragment was presented as convincing evidence without its wider context."],"answer":3,"explanation":"第2段指出，配错说明的照片片段被当作可信证据传播，原报道有关维修的上下文和细节都丢了。"},{"prompt":"Why does the author say that clean-looking search results could mislead readers?","options":["They appeared complete, although the system might omit nearby text.","They combined unrelated reports from different towns.","They hid the dates of all sources from the reader.","They gave lower rankings to newer newspaper reports."],"answer":0,"explanation":"第3段说明图片会优先显示，扫描还可能漏掉随附文字。界面看起来干净完整，读者就容易误以为信息已经齐全。"},{"prompt":"How did the library respond when a photograph raised questions about someone's identity?","options":["It removed every photograph whose subject was unknown.","It allowed families to publish corrections on behalf of other families.","It treated privacy as more important than satisfying public curiosity.","It opened confidential records to users who had read the original article."],"answer":2,"explanation":"第4段最后讲到团队认为公众的好奇不应凌驾于个人隐私之上，所以分享家人提供的信息前会征求许可。"},{"prompt":"Which principle would the author most likely recommend for a new digital archive?","options":["Highlight the latest user interpretations above original materials.","Let users inspect originals and recognise what evidence is missing.","Remove all captions and notes to simplify searching.","Limit the collection to well-known and uncontroversial stories."],"answer":1,"explanation":"末段建议帮助读者找到完整来源、明白检索结果的证明限度，并区分原始记录和后人的解读。"}]},{"title":"What a New Machine Cannot Measure","paragraphs":["A small bakery can spend years building its reputation before it is invited to provide food for a large corporation. For one entrepreneur with four branches, a corporate catering contract appeared to be the next natural step. At a tasting appointment, however, the client was demanding about delivery times and wanted the same design on hundreds of cakes. The apparent increase in turnover mattered little if the cost of extra labour and equipment left no profit margin. The owner decided to calculate the likely expenditure before making any commitment.","Her first response was to explore automation. A supplier could assemble a machine whose simple mechanism put an identical amount of icing on every cake. A baker who had started as an apprentice took the initiative to collaborate with technicians who specialise in food equipment. Their technical expertise made the machine more efficient, but they warned the owner that the innovation would raise productivity only when orders were predictable. It would do little for the shop that received ten different cake designs each afternoon.","Management also reconsidered how the bakery treated its workforce. The personnel manager initially planned to hire for a new vacancy. Finding a competitive salary might help recruit a skilled decorator, but a new employee could take months to learn the existing routines. After talks with the staff, the bakery offered a travel allowance to anyone willing to rotate between branches and agreed to compensate people for extra closing shifts. Staff could negotiate the shifts in advance, knowing who actually had authority to approve a swap.","The owner asked branch managers to assign the standard orders to the machine and delegate unusual orders to the people who knew the customers. She gave decorators enough autonomy to change their schedules and asked one person in each branch to coordinate deliveries. Some staff worried that a machine might make their occupation redundant. In practice, removing routine work gave them more time to practise techniques that mattered in their profession. At the same time, reducing the evening workload improved engagement, which helped managers see who was genuinely ready for promotion.","When the bakery reviewed the project, its main benchmark was neither the number of cakes made nor the length of time people remained at work. Instead, it compared late deliveries, staff departures and orders that had to be remade. The firm went on to institute a policy of testing new technology in one branch before installing it elsewhere. It could compete for larger orders, but its success depended on deciding which tasks to give a machine and which decisions to leave with the people doing the work."],"questions":[{"prompt":"Why did the owner calculate costs before accepting the catering contract?","options":["She wanted to include a gift for the client.","She hoped to pay decorators the same as delivery drivers.","A large volume of sales would not help if additional costs absorbed the profit.","She already knew that the customer would refuse to pay for overtime."],"answer":2,"explanation":"第1段最后两句说明订单看似会增加营业额，可如果额外人工及设备成本吃掉利润，销售额上涨就没什么用。"},{"prompt":"Under which circumstance did the specialists think the machine would be most useful?","options":["When the bakery had many repeatable orders.","When customers wanted to see every cake being iced.","When experienced decorators were absent from every branch.","When most cakes required a different design."],"answer":0,"explanation":"第2段说机器适合把同样分量的糖霜重复挤在许多蛋糕上，订单可预测时才有助于提高产量。"},{"prompt":"What arrangement helped staff move between branches?","options":["Staff had to apply for a new occupation before moving.","Staff were forbidden to exchange shifts.","Decorators lost their usual pay if they worked at another branch.","Staff received help with travel and could negotiate shifts in advance."],"answer":3,"explanation":"第3段末尾提到愿意在不同分店轮换的人可以领交通补贴，班次也能提前协商。"},{"prompt":"What happened to the experienced decorators when standard orders went to the machine?","options":["Management expected them to leave before the contract finished.","They had more time for specialist tasks and developing their skills.","Their promotion depended entirely on the length of their evening shifts.","They were told to stop speaking to regular customers."],"answer":1,"explanation":"第4段区分标准订单和特殊订单，并说明重复任务减少后，师傅可以把时间放在客户和对职业有用的技术上。"},{"prompt":"What conclusion does the author draw from the bakery's experience?","options":["A well-designed machine can replace the need for a staffing policy.","The most accurate measure of success is the number of products made.","Technology works best when companies deliberately divide tasks between machines and people.","Larger clients care more about staff development than delivery times."],"answer":2,"explanation":"末句说成功取决于选出适合交给机器的任务，以及要由工作人员保留的决策权。"}]},{"title":"When a Wellbeing Score Becomes a Job","paragraphs":["A large office introduced a wellbeing app because many employees had a sedentary routine. Workers could log walks, and prizes provided extra motivation. The condition for entering the prize draw was a consistent record rather than a single exceptional performance. At first the organisers were pleased: employees had a positive attitude towards the project, and several said it helped them develop a new habit. The organisers expected the change in behaviour to improve health and break up prolonged periods of sitting.","After a few weeks, however, some workers reported unexpected anxiety. Constant exposure to notifications added to their mental workload, and they felt a compulsion to check their totals. A message intended as a harmless stimulus could trigger an impulse to open the app during a meeting. One worker became conscious of how often the alerts could distract her from a task involving intense cognitive effort. Another said that the pressure to add an evening walk had become so persistent that he ignored his physical fatigue. Neither found an easy way to cope.","The difficulty had less to do with the intensity of the walking than with how the programme affected the perception of success. The high prevalence of impressive totals made a modest walk seem inadequate. People were particularly susceptible to this comparison on days when they had less time, and experienced athletes were not immune. One participant postponed lunch to pass a daily threshold; another began treating a reduced appetite as a sign of success rather than giving any thought to nutrition. A tool intended to help had introduced disorder into routines that previously worked well.","Before planning an intervention, organisers went to observe what people actually did with the app and asked former users why they stopped. They found that the wish to track a symptom did not imply that a worker wanted to seek advice from colleagues. Nor could a total on a screen diagnose a condition or guide treatment, therapy or rehabilitation. There was a risk that accurate-looking numbers would draw attention away from how people felt. Showing empathy meant recognising these different needs. Some people wanted private reminders and others wanted no reminders at all, and neither group should have to resist public pressure to participate.","The office removed the ranking and allowed users to reduce alerts. One consequence was a drop in the numbers displayed on the app, but more workers started taking short walks with colleagues. An optional programme can foster a healthier routine if it has some tolerance for missed days. Its purpose is to prevent useful breaks from disappearing into the working day, not to create another job for the person already doing the work."],"questions":[{"prompt":"Why did the organisers originally introduce the app?","options":["To make workers share personal health information with colleagues.","To identify employees who were already taking regular exercise.","To encourage movement and interrupt long periods of sitting.","To find out why employees stopped attending meetings."],"answer":2,"explanation":"第1段首尾说明办公室原先想借这个应用改善久坐习惯。奖励只是鼓励员工行动的手段。"},{"prompt":"What unexpected experience did some participants report?","options":["Notifications made them feel compelled to check their totals.","They could not understand the written rules of the prize draw.","Their colleagues prevented them from leaving the office to walk.","Walking together made it harder to concentrate in meetings."],"answer":0,"explanation":"第2段说通知加重了心理负担，有人因此忍不住反复查总分，甚至在开会时也会被提示打断。"},{"prompt":"According to the passage, why did a modest walk start to seem inadequate?","options":["The office decided that short walks were unsafe.","Most participants found that they no longer enjoyed walking.","The daily threshold was measured in minutes rather than steps.","Workers compared their totals with conspicuously high scores."],"answer":3,"explanation":"第3段第二句直接说，高分太常见，衬得普通散步显得不够好。核心是比较改变了员工对达标的看法。"},{"prompt":"What did the organisers learn from talking to users?","options":["They could diagnose problems by combining everyone's scores.","Workers differed in how much feedback, attention and advice they wanted.","A person who monitored a symptom almost always wanted public support.","Former users wanted a stricter daily threshold before they would return."],"answer":1,"explanation":"第4段指出，有人想要私下提醒，有人完全不想被提醒，也不能把记录症状当成寻求同事建议。"},{"prompt":"What do the revised programme's results illustrate?","options":["Removing goals prevents all healthy habits from forming.","Private reminders produce higher scores than public rewards.","Lower app totals can coexist with more voluntary activity.","Employees need to be given a prize for every walk."],"answer":2,"explanation":"最后一段说取消排名后，应用上的数值降了，却有更多同事相约散步，说明活动效果不能只看计分。"}]},{"title":"Giving Broken Appliances a Second Chance","paragraphs":["For a household balancing food, transport and rent, replacing a broken washing machine can upset an entire monthly budget. During a recession, when income is insecure, even a repair bill can become a serious burden. The disparity between those who can afford replacement and those who cannot is wider than an advertisement might suggest. A landlord may agree to replace a shared appliance, but for families managing their own domestic equipment, the decision often lands on them.","One reason repair feels uncompetitive is how companies that manufacture appliances market new products. A temporary discount makes a purchase seem urgent, while prices for spare parts fluctuate with the value of a currency and the price of an imported commodity such as copper. Once an older model is discontinued, the supply of parts can dry up even when demand remains. A firm that retains a monopoly on replacements has little incentive to make repairs easier.","A local agency might respond with a repair scheme. Instead of using a welfare fund to buy replacement appliances, it could finance repairs with a small subsidy for each successful job. A city could cover the cost through general tax revenue or levy a charge on discarded devices. The economic argument is that reducing avoidable spending could help people experiencing poverty. However, the programme needs a financial plan that survives changes in public funding.","A shared workshop needs more than the right equipment. A reliable testing bench may be its most valuable asset, but space to accommodate multiple jobs does little good if there is a shortage of skilled technicians. Local courses take time to train new workers, especially when employers cannot spare experienced staff to teach. Suppose a shop makes an investment in training and aims to recover its costs through a small charge on each transaction. That may be less lucrative than selling replacements, yet the shop could still earn a profit. The consumer keeps useful property in service, and a larger proportion of each payment goes to local labour.","Repair is sometimes praised as a badge of a frugal lifestyle, but that view misses a broader trend. During high inflation, a practical service could yield real savings for people who never intended to become environmentalists. It should not displace replacement when a repair is genuinely unsafe, and no individual workshop can solve a municipal deficit or protect every small business from bankruptcy. The point is to give buyers a meaningful choice between replacing and restoring the things they already own."],"questions":[{"prompt":"What concern does the opening paragraph highlight?","options":["To suggest that most households dislike sharing machines.","To show how replacing a machine can place unequal pressure on household finances.","To explain why landlords usually refuse to replace older appliances.","To argue that families are responsible for the recession."],"answer":1,"explanation":"首段把更换机器和月度预算联系起来，并指出不同家庭负担更换费用的能力差距很大。"},{"prompt":"What can happen when an older model goes out of production?","options":["Consumers immediately stop looking for its spare parts.","Most repair shops obtain a permanent discount.","Spare parts may become hard to obtain even though people still need them.","Manufacturers lose control over the sale of all replacement products."],"answer":2,"explanation":"第二段第三句明确指出，老型号停产后，配件供应可能枯竭，而需求依然存在。"},{"prompt":"How might a local government support the repair scheme?","options":["By helping pay for successful repairs and finding a lasting source of funding.","By using its entire welfare budget to replace home appliances.","By requiring manufacturers to lower all appliance prices.","By asking workshops to operate at a loss throughout a recession."],"answer":0,"explanation":"第三段建议给每次成功维修补贴，并通过一般税收或就废弃设备收费筹资，最后强调资金安排要经得住变化。"},{"prompt":"What limitation of shared workshops is noted in the fourth paragraph?","options":["They generally cannot charge customers for individual repairs.","They direct all payments to overseas labour.","They always need to replace the equipment they receive.","Suitable tools do not remove the need to find trained technicians."],"answer":3,"explanation":"第四段第二句先说工具能应付许多活，再指出熟练技工仍然短缺。"},{"prompt":"Which statement best captures the author's main point?","options":["Repair is worth supporting because it gives households another practical choice.","Repair can solve a town's major financial problems on its own.","Replacement is never justified when a household appliance fails.","The main task of a repair workshop is to promote environmental lifestyles."],"answer":0,"explanation":"末段明确提出目标是给消费者提供真正可行的选择，同时承认维修有安全和财政方面的边界。"}]},{"title":"Who Gets to Tell a Neighbourhood's Story?","paragraphs":["Imagine a community developing a walking tour through its oldest streets. One resident sees a chance to share the district's history, while another sees a future of strangers photographing the front gate. Conflict grows when the dominant perspective is that a minority should stay quiet for the sake of a popular plan. When early consultation becomes the norm, organisers may discover more widespread concerns than they expected. They can also stop one stereotype about the district from hardening into the story a whole generation hears.","The first obstacle is often the consultation policy itself. A public meeting on a Tuesday afternoon may sound accessible until people working that shift find themselves unable to attend. A property ownership requirement that decides who is eligible to vote creates another barrier. It can exclude families who have rented locally for years. Equal access depends on representation, manageable bureaucracy and an open debate that people can join in person or through social media.","The demographic makeup of a district can change quickly. Migration from a rural area and the arrival of a new immigrant family produce diverse accounts of what the same street means. An ethical tour makes room for this ethnic and cultural diversity without treating every person as the official voice of a group. Someone's affiliation with a restaurant association, for example, tells us something about their work. It does not tell us how they feel about tourism.","A volunteer who guides tours can also advocate for changes that integrate local businesses into the project. Mutual trust grows when the tour is a collective effort and residents can help decide where visitors stop to eat. But the benefits may be marginal if the tour ignores institutional discrimination and offers prominent stalls only to the same established businesses. A serious civic process asks what justice looks like in practice, including who benefits and who bears the disruption.","None of this requires every citizen to reach a consensus on a single account. The organisers could abolish the rule that every speaker must conform to an approved script. Equality does not mean that every version of a tradition is identical. The tour could treat local heritage in the plural by letting several people describe the same event. That approach may build more social cohesion than a polished story everyone is expected to repeat. Its legacy could be a greater willingness to listen, long after the last visitor has gone."],"questions":[{"prompt":"What benefit of early consultation does the opening paragraph identify?","options":["It ensures that visitors never enter residential streets.","It makes a district easier to describe with one familiar label.","It helps organisers discover concerns they might otherwise miss.","It allows the most popular plan to be adopted without delay."],"answer":2,"explanation":"首段指出，把尽早征询意见当成常规做法，组织者可能发现居民的顾虑比原来想象的普遍。"},{"prompt":"Why does the author bring up a meeting on a Tuesday afternoon?","options":["To show that a meeting formally open to all may still be hard for some to attend.","To argue that holding a vote on a weekday makes it illegal.","To illustrate the advantage of allowing only property owners to vote.","To suggest that people who work shifts oppose all walking tours."],"answer":0,"explanation":"第二段用工作时段撞上会议的例子说明，名义上的公开与实际可参与性是两回事。"},{"prompt":"What can be inferred about an individual who belongs to a restaurant association?","options":["They are necessarily in favour of attracting more tourists.","They are best placed to speak on behalf of every immigrant household.","They are unlikely to understand the effects of tourism.","Their membership does not by itself reveal their personal views on tourism."],"answer":3,"explanation":"第三段末两句明确限定了推断范围。社团隶属关系能透露工作背景，但无法表明个人对旅游的态度。"},{"prompt":"When might a collective tour bring only limited benefits to the community?","options":["When residents help decide where visitors should spend their money.","When only the businesses already in a strong position get the best opportunities.","When two volunteers disagree on how to describe a historic event.","When some residents are interested in guiding more than one group."],"answer":1,"explanation":"第四段指出，若忽视制度性歧视，显眼摊位一直分给原本占优的商家，收益就可能有限。"},{"prompt":"Which approach to local history does the author favour?","options":["Letting the most widely accepted account replace all other accounts.","Removing discussion of old traditions from tourist activities.","Giving different residents room to present their own versions of the district's story.","Asking all residents to follow the same carefully written script."],"answer":2,"explanation":"末段提议不再要求每位讲述者照念同一份讲稿，让不同居民讲述同一事件，借此增进邻里了解。"}]},{"title":"Can a Quiet Classroom Tell Us Who Is Learning?","paragraphs":["Imagine that a school buys a sensor that advertises an ability to measure classroom concentration. In initial tests, the device is accurate at recording changes in classroom sound. To associate silence with attention, however, is to take a specific claim about learning and turn it into a much more controversial one. Attention is an abstract concept, and a single indicator is an approximate description. Before adopting the device, a school should ask exactly what problem it is trying to solve.","A sensible experimental framework would begin by asking teachers to define their objective. One hypothesis could be that reducing noise clears the way for better reading. A constraint is that some learning tasks require pupils to talk to each other. Researchers could use ordinary lessons as a baseline and adjust one parameter at a time, such as when group discussions are allowed. Holding other conditions steady would make the main variable easier to interpret.","The next question is what empirical finding would confirm a real improvement. To quantify progress, researchers might ask a sample of pupils to answer comparable questions at a fixed interval. They would check the accuracy of the sensor's timestamps and inspect the sequence of events before treating a change in noise as meaningful. A simultaneous drop in noise and improvement in test scores, repeated across lessons, would show a correlation. It would not, on its own, establish a causal relationship.","A more detailed review might find an anomaly that the sensor missed. A teacher who shuts the windows after lunch can reduce external noise, even though the pupils inside are talking as much as before. The apparent change in student behaviour would then be a measurement artifact. Researchers could derive different predictions from the two explanations. They would need to determine which source produced the sound and examine discrete periods of activity instead of trying to infer everything from a daily average.","To deduce that silence improves learning, researchers would need a more robust result than a single quiet lesson. Independent observers could corroborate the record and other schools could try to reproduce the procedure and replicate the result. Even then, researchers might conclude that the result is applicable to certain lessons only. A tendency to generalise too quickly would introduce further uncertainty. The sensible response to a tentative result is to report it as such. A conversation about what counts as learning is integral to deciding whether the device is useful."],"questions":[{"prompt":"What distinction does the opening paragraph make about the sensor?","options":["Recording classroom sound is different from establishing how attentive pupils are.","Recognising speech is harder than recording all outside noise.","Pupils who speak often are necessarily less attentive.","Schools disagree about whether the device can record any speech at all."],"answer":0,"explanation":"开头承认设备能准确记录室内声音的变化，同时指出安静只是粗略指标，不能直接代表专注。"},{"prompt":"Why would researchers use ordinary lessons as a baseline?","options":["To make sure no pupils ever talk to one another.","To avoid collecting data after the device is installed.","To allow every condition to change between the two sets of lessons.","To provide a point of comparison while changing one condition at a time."],"answer":3,"explanation":"第二段最后两句解释，普通课堂可作比较基准，每次只改一个条件、保持其余条件稳定，有助于理解变量的作用。"},{"prompt":"What would a simultaneous decline in noise and improvement in scores establish by itself?","options":["That all pupils learned more because they were quiet.","That the two changes occurred together.","That the teacher used an unreliable timer.","That schools should immediately abandon group work."],"answer":1,"explanation":"第三段末尾区分相关与因果。同时出现只能支持两者有关，单凭这一观察无法证明是安静带来进步。"},{"prompt":"Why does the text mention closing the windows?","options":["To show why pupils are more attentive in the afternoon.","To argue that the sensor is unable to detect any outside sounds.","To illustrate a lower noise reading that need not reflect changed pupil behaviour.","To identify the best time for teachers to allow group discussion."],"answer":2,"explanation":"第四段的关窗例子说明，外部噪音减少也会让读数下降，即使学生仍然一样爱说话。"},{"prompt":"What is the author's recommendation in the final paragraph?","options":["Treat preliminary findings cautiously and examine what counts as learning.","Generalise every result once the classroom becomes quieter.","Ignore repeated findings when they concern a single school.","Replace classroom discussion with silent study wherever possible."],"answer":0,"explanation":"末段要求如实说明结果的不确定性，并提醒学校先讨论如何衡量学习，再判断设备有没有用。"}]},{"title":"When a Rumour Outruns the Notice","paragraphs":["Rapid urbanisation can be accompanied by a loss of familiar meeting places, so a local library often feels more important than its budget suggests. When a photographed notice appears to announce its closure, residents may assert that officials have already decided the matter. One particular image can capture attention faster than an official explanation. Cropping a date can alter the meaning of a notice and produce what looks like compelling evidence. Contrary to the rumour, however, the library may only be shutting for repairs. The consequences are real even when the story is not.","It is tempting to debunk the notion with a notice that contradicts the original post. A correction is vital, but it will not necessarily tackle the fundamental source of the suspicion. For instance, people may quote the council's earlier promises and ask why this week's decision seems different. An official who can explain the scope of the repairs and elaborate on the timetable has an advantage over a statement that merely says the post is wrong. Such a response can illustrate what actually happened while making clear which details are still uncertain.","Approachability helps. A librarian may acknowledge the extent of the disruption before asking residents to share what they need. This puts the emphasis on a crucial distinction: an explanation can be accurate without resolving a practical problem. If the probable reopening date is a month away, a student facing exams will still need somewhere quiet. The library might undertake to keep a classroom open, or supplement its reduced hours with temporary study sessions. Despite the unprecedented volume of complaints, staff can often incorporate requests quickly once they know what people are missing.","The prospect of finding a workable compromise depends on recognising that local institutions are interdependent. A library manager and her counterpart at a community centre may readily see how their services complement each other. Yet the cost of heating a classroom can constrain what either institution offers. They need a principle for deciding who gets priority, and they should be clear about which costs would justify a shift in opening hours. Such decisions vary with local demand. A council can endorse an arrangement without pretending it will suit every resident.","The ultimate test is whether the institution can attain a result that people see as both useful and fair. Counting visitors may show how a new arrangement is used, but qualitative feedback can reveal why people stop coming altogether. In some cases, complaints warrant another adjustment; in others, a clear explanation is enough. Treating all questions as hostile can pose an avoidable risk: it may undermine trust long after the repairs are completed."],"questions":[{"prompt":"What is the main argument of the passage?","options":["Libraries should avoid announcing closures online.","An effective response to a rumour combines factual correction with attention to practical concerns.","A community centre is usually a cheaper substitute for a library.","Residents should not question local officials while a library is being repaired."],"answer":1,"explanation":"第二段强调澄清事实很重要，第三至第五段则说明还要回应停修给居民带来的实际困难。两者共同构成作者的主张。"},{"prompt":"Why does the author refer to a student facing exams?","options":["To show that a correct notice does not remove the need for an alternative service.","To explain why all libraries should have extended opening hours.","To suggest that students were responsible for the original rumour.","To argue that an exam timetable is more reliable than a council notice."],"answer":0,"explanation":"哪怕学生知道图书馆只是维修，也得另找安静地方复习。这个例子区分了事实澄清与实际需求。"},{"prompt":"What does the passage suggest can limit cooperation between local institutions?","options":["The need to count visitors.","The availability of a new timetable.","A lack of public interest in quiet places.","The practical expense of keeping a space available."],"answer":3,"explanation":"第四段直接举了教室供暖的例子，指出开辟临时空间的成本会限制机构能提供什么。"},{"prompt":"In the last paragraph, what is the function of qualitative feedback?","options":["To verify the number of people using the library.","To assess the council's success in reducing spending.","To help explain why former visitors no longer use the service.","To forecast the price of the next set of repairs."],"answer":2,"explanation":"数据能告诉管理者有多少人在用新安排，文字反馈则有助于解释有些人为什么不再来了。"},{"prompt":"Which action would the author be most likely to support?","options":["Tell residents what changed, ask what they need, and adapt services when justified.","Repeat the same correction until questions stop.","Promise full access even when heating costs make this impossible.","Refuse to answer residents who share cropped photographs."],"answer":0,"explanation":"文章倡议说明事实，了解需求，并结合成本和反馈作必要调整。选项中的三步分别对应文章的几个段落。"}]},{"title":"Who Owns the Story of an Old Object?","paragraphs":["A small museum in a coastal province wants to exhibit a pottery vessel. A handwritten label claims it came from an ancient dynasty, and its elegant calligraphy certainly looks old. Yet the museum's records reveal that the vessel arrived with a donation from a textile shop only a few decades ago. There is no request to return the object, and no evidence anyone tried to forge the label. The difficulty is deciding what the museum can fairly say about its origin when different pieces of evidence are open to different interpretations.","In archaeology, an object does not have to be a royal relic to have historical significance. Consider a bowl that a family might inherit, repair and use for several generations. An inscription can document who owned it, while a photograph may show a distinct technique used to restore its handle. A manuscript could chronicle its exchange between two households. Oral histories might explain how it became a symbol of hospitality. Even local folklore about the bowl can matter: it reveals which qualities a community chose to celebrate, regardless of whether the events described actually took place.","For a practitioner, challenging a story requires care. The design of the vessel might show the influence of a craft indigenous to the area, but this tells us little about its exact date. A researcher could ask permission to excavate near a workshop, or follow a trade route to locate comparable objects. The architecture of the old workshop may shed light on how objects moved into circulation. Yet a generous donor's desire for recognition could encourage a museum to portray a familiar object as something more extraordinary than the evidence supports.","Preservation also involves choices about what to show alongside an object. A contemporary recording can help explain the evolution of a village ceremony, for example. A video might show that a certain ritual, once performed at a monument, recently moved to a school hall. Such changes are characteristic of living traditions. A museum can commemorate the people involved by recording different versions of their experience, rather than forcing everyone to agree on one official interpretation.","A revival of interest in ordinary objects may help nearby businesses prosper, and tourism may offer income to artists who teach traditional skills. But prosperity is an unreliable measure of whether a museum has told a story well. Promising a royal connection can draw a crowd, while showing how the evidence was pieced together lets visitors see why the story matters even without a queen. The most engaging exhibit may be the one that leaves its audience with a good question."],"questions":[{"prompt":"What makes the pottery vessel difficult for the museum to present?","options":["Several families insist that the vessel should be returned to them.","The vessel's handle cannot be repaired.","The historical records date the vessel more precisely than the museum expected.","The available evidence leaves room for different versions of its history."],"answer":3,"explanation":"首段区分了标签声称的年代和博物馆记录的入藏时间，作者明确说不同证据存在不同解释，因此应慎重说明来历。"},{"prompt":"Why does the author mention local folklore about a bowl?","options":["To show why researchers should accept folklore as factual evidence.","To show that stories can reveal community values even when their events are unverified.","To suggest that visual evidence has little use in archaeology.","To argue that exceptional objects receive less attention than ordinary ones."],"answer":1,"explanation":"第二段指出，即使故事中所讲的事件是否发生无法证实，它仍能反映一个社区愿意纪念和推崇的事物。"},{"prompt":"Which inference about identifying an object's date is supported by the passage?","options":["A design associated with a local craft cannot, by itself, establish an exact date.","A local style is enough to establish the exact dynasty that made an object.","The generosity of a donor makes a date more credible.","An object given by a shop is almost certainly recent."],"answer":0,"explanation":"第三段说本地工艺的影响可能体现在设计中，但这不能提供关于确切年代的充分信息。"},{"prompt":"What does the account of a ritual moving to a school hall demonstrate?","options":["Museums should give schools responsibility for all public ceremonies.","A ceremony loses its value when moved away from a monument.","A tradition can continue to matter while changing over time.","A video is valuable only when all interviewees remember an event in the same way."],"answer":2,"explanation":"第四段将仪式换场地称为活态传统的典型变化，表明传统可以有延续性，也可以变化。"},{"prompt":"Which title best captures the passage's main point?","options":["Why Tourism Is the Only Way to Save Small Museums","How One Family Recovered Its Missing Pottery","How to Spot a Forged Label in a Museum","Telling the Truth About Ordinary Objects Can Make a Better Exhibit"],"answer":3,"explanation":"文章从展品来历存疑入手，论述博物馆可诚实展示证据、承认不确定性，并发掘普通物件的意义。"}]},{"title":"A Trial Run Before a Permanent Change","paragraphs":["A conventional response to a long queue at a public clinic is to open another desk. That solution may be feasible in a large hospital, but a neighbourhood clinic with inadequate staff might have to convert a spare room into a check-in area or divert a nurse from some other task. Its declared aim may be simple: eliminate unnecessary waiting. In practice, however, it faces a complex question. How can it promote faster treatment without reducing equity for people who cannot afford to arrive very early?","Consider a team asked to formulate a trial. Its initial plan is to make appointments compulsory on three consecutive mornings. The accelerated timetable gives staff little chance to anticipate how patients will respond. They assume that appointment booking and walk-in access are mutually exclusive, when in fact they could run the systems in parallel. This oversight might impede entry for patients with an urgent problem. An attendant can manually admit someone in a crisis, but the arrangement still exposes the downside of an abrupt change.","During implementation, the majority of patients may report shorter waits. Measured in aggregate, the results look encouraging. Yet a subsequent review might provide a different insight if the team asks who had trouble. Some older residents may have been unable to book and simply ceased attending. A manager might overlook that absence because it is hard to distinguish from a quiet day. If a reviewer points out the risk, comparing the records with data collected before the trial can offset an inadvertent bias in the findings.","A viable trial leaves room for an alteration. An advisory board can agree that two adjustments should precede any definite decision: keep one hour available for walk-ins and let people book in person as well as online. Some members may abstain, and a neutral chair can give their concerns a fair hearing. Gradual changes have an advantage in this situation. If the transition is less disruptive, complaints may dwindle and there is less likelihood of patients disappearing from the records during the experiment. Staff have an obligation to make clear that initial improvements do not make further gains inevitable.","A good pilot does not need to continue indefinitely. It may reveal a persistent obstacle such as a fixed number of doctors, or show that some changes can significantly reduce waiting. The team should state in advance what evidence would trigger the cessation of the trial, and how the service may evolve if the changes are kept. This gives patients something more useful than a promise of efficiency: a way to tell whether speed and fair access have improved together."],"questions":[{"prompt":"What is the passage mainly concerned with?","options":["The reasons fewer people choose to work in public clinics.","How to test a service change without overlooking who may be excluded.","The differences in medical quality between hospitals and neighbourhood clinics.","Why a compulsory appointment system is the quickest answer in all clinics."],"answer":1,"explanation":"文章以社区门诊做试点为例，重点是如何在提高效率的同时检验公平性，观察新安排有没有把某些人排除在外。"},{"prompt":"What problem does the team fail to think through before starting its trial?","options":["Patients might make appointments earlier in the day.","An attendant may wish to take time off.","People who cannot book may still need to see a doctor.","Walk-in patients usually want to see a nurse instead of a doctor."],"answer":2,"explanation":"第二段指出，团队误以为预约与现场就诊不能并存。这会让无法预约而又需要及时就医的人遇到障碍。"},{"prompt":"Why might the results measured in aggregate be misleading?","options":["They can miss patients who stop attending instead of reporting a problem.","They always exaggerate how long each patient waited.","They include reports from people who work at other clinics.","They cannot use any information from before the trial."],"answer":0,"explanation":"第三段用老年患者停止就诊的情况说明，只统计参加试点的人可能遗漏没有成功进入系统的人。"},{"prompt":"In the fourth paragraph, what does the author suggest should happen before the final decision?","options":["The board should remove the choice to abstain.","The clinic should close its online service for one week.","The clinic should begin to charge a fee for appointments.","The clinic should preserve walk-in access and provide a choice of ways to book."],"answer":3,"explanation":"第四段列出两个应先于最终决定的调整：保留现场就诊时段，并同时提供现场预约和线上预约。"},{"prompt":"Which statement would the author most likely agree with?","options":["A successful pilot should become permanent as soon as most patients report shorter waits.","A pilot should define in advance what outcomes would lead it to end.","An experiment should proceed at full speed even when a group of patients cannot use it.","A clinic can prove fair access by counting the total number of patients it serves."],"answer":1,"explanation":"末段说明应提前规定什么证据会触发停止试点，以及保留变化时服务会如何调整。"}]}];

      [/\bput\s+.+?\s+into practice\b/i,"put … into practice","把……付诸实践"]
