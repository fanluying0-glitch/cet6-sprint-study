e"],["adjust","əˈdʒʌst","v.","调整；适应","The researchers adjusted for differences in age and income.","adapt 偏适应较大变化或改编。",0,"研究人员在分析中对年龄和收入差异作了调整。","I had to adjust the camera so it could see the whole kitchen.","我得调一下镜头，好让它拍到整个厨房。","adjust"],["approximate","əˈprɒksɪmət / əˈprɒksɪmeɪt","adj./v.","大致的；接近","The figures give an approximate picture of the size of the problem.","accurate 强调准确，approximate 强调近似。",0,"这些数据可以让我们大致了解问题的规模。","The approximate start time was midnight, give or take five minutes.","它大约在半夜十二点开唱，前后差不了五分钟。","approximate"],["associate","əˈsəʊsieɪt / əˈsəʊsiət","v./n.","联系；同事","Researchers found that longer commutes were associated with lower satisfaction.","attribute 指归因，associate 只表关联。",0,"研究人员发现，通勤时间较长与满意度较低存在关联。","I began to associate 'Happy Birthday' with something deeply sinister.","我开始觉得，一听到「生日快乐」就会有诡异的事发生。","associate"],["causal","ˈkɔːzəl","adj.","因果关系的","The results did not establish a causal link between sleep and test scores.","casual 是随意的。",0,"这些结果未能证实睡眠与测试成绩之间存在因果关系。","That didn't prove a causal link, so I fetched a curtain.","这不能证明有因果关系，于是我去找了块窗帘。","causal"],["comparable","ˈkɒmpərəbəl","adj.","可比较的；相近的","The two groups obtained comparable results in the first test.","compatible 是相容的。",0,"两组在第一次测试中取得了相近的成绩。","We needed a comparable recording without any flash.","我们还得录一段没有闪光的录像来对照。","comparable"],["conclude","kənˈkluːd","v.","得出结论；结束","The investigators concluded that further testing was needed.","include 是包括。",0,"调查人员得出结论，认为还需要进一步测试。","I conclude that the fridge is innocent, but I'd check the toaster.","我的结论是，冰箱无辜，不过烤面包机还得再查查。","conclude"],["confirm","kənˈfɜːm","v.","证实；确认","A later study confirmed the pattern in a larger sample.","conform 表示遵从或符合。",0,"后续研究在范围更大的样本中证实了这一规律。","I checked the recording to confirm nobody had entered the kitchen.","我回看录像，确认没人在那段时间进过厨房。","confirm"],["constraint","kənˈstreɪnt","n.","限制；约束","Time constraints affected how the interviews were conducted.","restraint 也可指克制。",0,"时间限制影响了访谈的开展方式。","Our biggest constraint was that we both worked early shifts.","最大的限制是我俩都上早班，没法天天熬夜。","constraint"],["correlation","ˌkɒrəˈleɪʃən","n.","相关性；关联","A strong correlation does not by itself establish causation.","causation 是因果关系。",0,"高度相关本身不足以证明存在因果关系。","There was a correlation between the alley flash and our song.","巷子里的闪光和我们听到的歌声似乎有关。","correlation"],["define","dɪˈfaɪn","v.","界定；下定义","The researchers defined success as completing the course.","refine 是改进或提炼。",0,"研究人员将成功定义为完成课程。","We had to define the problem before blaming half the street.","我们得先把问题说清楚，再去怪半条街的人。","define"],["derive","dɪˈraɪv","v.","源于；获得","The estimates were derived from local transport records.","drive 是驱动，derive from 是源于。",0,"这些估算基于本地交通记录。","We could derive a prediction that blocking the beam would stop the song.","由此我们能推测，挡住那束光，音乐应该就不响了。","derive"],["determine","dɪˈtɜːmɪn","v.","确定；决定","Follow-up interviews helped determine why people withdrew.","detect 偏发现难察觉的现象。",0,"后续访谈有助于查明人们退出的原因。","To determine its source, my roommate waited outside with her phone.","为了找出光从哪儿来，室友拿着手机去外头守着。","determine"],["empirical","ɪmˈpɪrɪkəl","adj.","基于观察或实验的","The argument needs empirical support from well-designed studies.","theoretical 表示理论上的。",0,"这一论点需要由设计严谨的研究提供实证支持。","Our first empirical test ended with the unplugged fridge still singing.","第一次实测的结果是，冰箱拔掉插头也照唱不误。","empirical"],["external","ɪkˈstɜːnəl","adj.","外部的；外在的","External factors affected the results in several locations.","internal 是内部的。",0,"外部因素影响了多个地点的结果。","A curtain would show whether an external light was involved.","挡上窗帘就能查出，这事和外头的光有没有关系。","external"],["finding","ˈfaɪndɪŋ","n.","研究发现；裁决","The main finding was that outcomes varied by age.","result 是结果，finding 偏研究得出的发现。",0,"主要发现是，结果会因年龄而异。","Our final finding was a musical card lodged behind the fridge.","查到最后，我们发现冰箱后面卡着一张会唱歌的卡片。","finding"],["hypothesis","haɪˈpɒθəsɪs","n.","假设；假说","The team designed a new experiment to test its hypothesis.","hypotheses 是复数。",0,"团队设计了一项新实验来检验其假设。","Our hypothesis was that a faulty fridge timer played the tune.","我们的假设是，冰箱计时器坏了才会放音乐。","hypothesis"],["infer","ɪnˈfɜː","v.","推断","The researchers inferred a pattern from the available observations.","imply 是说话者暗示。",0,"研究人员从现有的观察结果中推断出了一种规律。","From the reversing beep, I could infer that a vehicle was backing up.","一听见倒车的提示音，我就推断有辆车在倒车。","infer"],["measure","ˈmeʒə","v./n.","测量；措施","The study used two tests to measure changes in attention.","measurement 是测量过程或结果。",0,"这项研究用了两项测试来衡量注意力的变化。","I used a thermometer to measure how warm the milk got.","我用温度计测牛奶升到了多少度。","measure"],["objective","əbˈdʒektɪv","adj./n.","客观的；目标","The researchers chose an objective measure of performance.","subjective 是主观的。",0,"研究人员选择了一项客观的表现指标。","I tried to stay objective, even when she drew up a suspect list.","哪怕她都列好了嫌疑人名单，我也尽量客观地看待这事。","objective"],["sample","ˈsɑːmpəl","n./v.","样本；抽样","The study relied on a small sample of university students.","example 是例子，sample 是抽取研究的样本。",0,"这项研究使用了一小组大学生作为样本。","I took a sample recording of the alley for comparison.","我录了一小段巷子里的声音，留作对照样本。","sample"],["sequence","ˈsiːkwəns","n./v.","顺序；按序排列","Participants saw the images in the same sequence.","consequence 是后果。",0,"参与者以相同的顺序观看了这些图片。","In every recording, the sequence started with a flash before the music.","每段录像里的顺序都一样，先闪一下，再响起音乐。","sequence"],["specific","spəˈsɪfɪk","adj.","具体的；特定的","The results apply to a specific population.","special 是特别的。",0,"这些结果适用于特定人群。","My roommate swore it started at one specific minute, 12:03.","室友发誓它每次都在同一个时间开唱，凌晨十二点零三分。","specific"],["variable","ˈveəriəbəl","n./adj.","变量；可变的","The analysis controlled for several variables, including age.","varied 表示多种多样的。",0,"分析中控制了包括年龄在内的几个变量。","To change one variable, we unplugged the fridge before midnight.","为了只改变一个变量，我们在半夜到来前拔了冰箱的插头。","variable"],["accuracy","ˈækjərəsi","n.","准确性；精确度","The software improved the accuracy of the estimates.","precision 偏精度或重复值接近。",1,"该软件提高了估算的准确性。","Timestamp accuracy mattered because we were comparing recordings from different nights.","时间戳得够准，因为我们比较的是不同晚上录的内容。","accuracy"],["anomaly","əˈnɒməli","n.","异常；反常现象","One apparent anomaly disappeared when the samples were checked again.","abnormality 泛指异常，anomaly 常指违背预期模式的情况。",1,"重新检查样本后，一处看似异常的现象消失了。","The baffling anomaly was that our fridge sang every night at midnight.","说不通的是，我们家冰箱每晚一到半夜就唱歌。","anomaly"],["parameter","pəˈræmɪtə","n.","参数；范围界限","The researchers set the parameters before collecting data.","perimeter 是周长或周界。",1,"研究人员在收集数据之前设定了参数。","One parameter for the test was keeping the milk below five degrees.","我们为实验设了一个条件，牛奶得保持在五度以下。","parameter"],["concept","ˈkɒnsept","n.","概念；观念","The concept was difficult to apply to very small groups.","conception 可指构想或形成观念。",1,"这一概念很难应用于规模很小的群体。","The card relied on a simple concept, triggering music with light.","这张卡片用的是个简单原理，见光就放音乐。","concept"],["baseline","ˈbeɪslaɪn","n.","基线；比较基准","Test scores were compared with a baseline taken before training.","benchmark 常指作为参照的标准，baseline 常指干预前水平。",1,"研究人员将测试成绩与训练前测得的基线值进行了比较。","Our baseline was last night's recording with the fridge running.","我们用前一晚冰箱正常运转时的录音作比较基准。","baseline"],["controversial","ˌkɒntrəˈvɜːʃəl","adj.","有争议的","The conclusion remains controversial among researchers.","contradictory 指互相矛盾。",1,"研究人员对这一结论仍有争议。","My roommate's most controversial theory blamed a neighbour she'd never met.","室友最有争议的猜测，是怪一个她都没见过的邻居。","controversial"],["deduce","dɪˈdjuːs","v.","推断；演绎","The team tried to deduce the cause from a series of observations.","deduct 是扣除。",1,"团队试图根据一系列观察结果推断原因。","She could deduce from the van's reversing lights where the flash originated.","看到面包车的倒车灯，她就能推断那道光是从哪儿来的。","deduce"],["experimental","ɪkˌsperɪˈmentəl","adj.","实验的；试验性的","The experimental group followed a different training schedule.","experiential 指基于体验的。",1,"实验组采用了不同的训练安排。","Our experimental setup included a torch, a phone and some very cold milk.","我们的实验设备包括一把手电筒、一部手机，还有一些冰得够呛的牛奶。","experimental"],["framework","ˈfreɪmwɜːk","n.","框架；体系","The framework helps compare results from different studies.","procedure 是具体步骤。",1,"这一框架有助于比较不同研究的结果。","Our framework sorted notes into times, sounds and unusual activity.","我们用一个框架整理记录，分别记下时间、声音和异常动静。","framework"],["generalise","ˈdʒenərəlaɪz","v.","概括；推广","It is difficult to generalise from such a small sample.","generate 是产生。",1,"很难根据这么小的样本得出可普遍适用的结论。","I wouldn't generalise from one singing fridge to all kitchen appliances.","我才不会因为一台冰箱唱过歌，就说所有厨房电器都这样。","generalise"],["indicator","ˈɪndɪkeɪtə","n.","指标；指示器","Attendance can be an indicator of interest in the programme.","indication 指迹象或表示。",1,"出勤情况可以反映人们对该项目的兴趣。","The flash was our best indicator that something had happened outside.","那一下闪光是最明显的信号，说明外面可能有动静。","indicator"],["integral","ˈɪntɪɡrəl","adj.","不可或缺的；组成部分的","Replication is an integral part of scientific research.","integrated 指整合起来的。",1,"重复验证是科学研究不可或缺的一环。","Its light sensor was integral to the whole trick.","整件事少不了卡片上的那个光线传感器。","integral"],["interval","ˈɪntəvəl","n.","间隔；区间","Data were collected at regular intervals during the trial.","intervention 指干预。",1,"试验期间，每隔一段固定时间就收集一次数据。","The music began at a fixed interval after each flash.","每次闪过之后，音乐都在固定的间隔后响起。","interval"],["quantify","ˈkwɒntɪfaɪ","v.","量化；测定数量","The task is to quantify changes in urban noise levels.","qualify 指符合条件。",1,"这项任务是量化城市噪声水平的变化。","We could quantify the delay at about three seconds each time.","我们测了时间差，每次都差不多延迟三秒。","quantify"],["reproduce","ˌriːprəˈdjuːs","v.","重现；繁殖","Other researchers were unable to reproduce the initial result.","produce 是产生，reproduce 强调再次产生。",1,"其他研究人员未能重现最初的结果。","We could reproduce the tune by shining a torch under the fridge.","把手电筒往冰箱底下一照，我们就能让它再唱一遍。","reproduce"],["robust","rəʊˈbʌst","adj.","稳健的；强健的","A robust conclusion should hold under several reasonable assumptions.","rigid 指僵硬不变的。",1,"稳健的结论应当在几种合理的假设下均能成立。","The evidence was robust enough to clear the fridge and our neighbour.","证据够扎实，足以证明冰箱和邻居都是无辜的。","robust"],["tendency","ˈtendənsi","n.","倾向；趋势","The researchers found a tendency to prefer familiar examples.","trend 偏群体现象的变化走向。",1,"研究人员发现，人们往往更偏爱熟悉的例子。","My roommate had a tendency to slide birthday cards behind fridge magnets.","我室友总喜欢把生日卡片塞到冰箱贴后面。","tendency"],["applicable","əˈplɪkəbəl","adj.","适用的","The findings may not be applicable to all age groups.","applied 常指应用的，applicable 是可适用的。",2,"这些研究发现未必适用于所有年龄组。","My roommate asked if the noise rule was applicable to greeting cards.","室友还问，噪音规定适不适用于贺卡。","applicable"],["artifact","ˈɑːtɪfækt","n.","人工制品；测量假象","The pattern turned out to be an artifact of the measuring procedure.","artefact 是常见英式拼写。",2,"这一规律后来被证实是测量过程造成的假象。","The ghostly blur on our footage was an artifact of lens reflection.","录像里那团像鬼一样的虚影，是镜头反光造成的假象。","artifact"],["corroborate","kəˈrɒbəreɪt","v.","证实；佐证","The records corroborate several details in the interviews.","collaborate 指合作。",2,"这些记录为访谈中的几处细节提供了佐证。","A silent night with the curtain closed corroborated our theory.","窗帘拉上后整晚都没响，这印证了我们的猜测。","corroborated"],["discrete","dɪˈskriːt","adj.","分离的；离散的","The team divided the process into three discrete stages.","discreet 表示谨慎的。",2,"团队将这一过程划分为三个相互区分的阶段。","Our recording caught two discrete clicks just before the tune.","音乐响起前，录音里捕捉到了两声分得很开的咔哒声。","discrete"],["replicate","ˈreplɪkeɪt","v.","复现；复制","The researchers tried to replicate the experiment in another school.","duplicate 偏复制副本，replicate 常用于实验复现。",2,"研究人员试图在另一所学校重复这项实验。","We could replicate the result as long as the torch hit one spot.","只要手电筒照中那一个地方，我们就能重复得出同样的结果。","replicate"],["simultaneous","ˌsɪməlˈteɪniəs","adj.","同时发生的","Simultaneous changes in funding made the result hard to interpret.","successive 表示相继的。",2,"资金方面有几项变化同时发生，使研究结果难以解释。","A neighbour's doorbell camera caught a simultaneous flash in the alley.","邻居家的门铃摄像头拍到，小巷也在同一刻闪了一下。","simultaneous"],["tentative","ˈtentətɪv","adj.","暂定的；不确定的","The authors offered a tentative explanation for the trend.","temporary 表示短期的。",2,"作者对这一趋势提出了一种初步解释。","Our tentative fix was to put the card in a drawer.","我们的暂定解决办法是，把卡片塞进抽屉。","tentative"],["uncertainty","ʌnˈsɜːtənti","n.","不确定性","The estimate should be interpreted with some uncertainty.","uncertain 是形容词。",2,"解读这项估算时，应考虑到它存在一定的不确定性。","My main uncertainty was whether the sound came from inside.","我最拿不准的是，声音到底是不是从冰箱里传出来的。","uncertainty"]],[["accompany","əˈkʌmpəni","v.","陪同；伴随","Stress often accompanies a major change in routine.","company 是公司或陪伴。",0,"日常生活发生重大变化时，人们常常会感到压力。","I asked my neighbour to accompany me downstairs for a closer look.","我叫上邻居，请她陪我下楼看个仔细。","accompany"],["acknowledge","əkˈnɒlɪdʒ","v.","承认；确认收到","The authors acknowledged several limitations in the study.","admit 常强调承认错误或不利事实。",0,"作者承认这项研究存在若干局限。","Leo acknowledged that his rubbish bins were blocking the doorway.","里奥承认，堵住门口的是咖啡馆的垃圾桶。","acknowledged"],["alter","ˈɔːltə","v.","改变；修改","Changes in price can alter consumer behaviour.","alternate 指交替。",0,"价格变化会改变消费者的行为。","Someone used a heart emoji to alter the original photo.","有人往原照片上贴了颗爱心，照片就这么被改了。","alter"],["appear","əˈpɪə","v.","出现；似乎","The advantage appears to disappear after several months.","emerge 偏原本不明显而浮现。",0,"这种优势似乎会在几个月后消失。","Through the window, Leo appeared to be proposing to her.","隔着窗户看，里奥像是在向她求婚。","appeared"],["approachability","əˌprəʊtʃəˈbɪləti","n.","易接近性；亲和力","Participants valued the approachability of their supervisors.","accessibility 偏设施或信息可达性。",0,"参与者很看重主管是否平易近人。","Mira's approachability made it easy to ask what we could do.","米拉很随和，我们也就敢开口问能帮什么忙。","approachability"],["assert","əˈsɜːt","v.","断言；维护","Several critics assert that the results are being misread.","assure 是向人保证。",0,"几位批评者坚称，这些结果遭到了误读。","That was enough for our neighbour to assert he'd proposed.","就凭这一帧，我邻居一口咬定他求婚了。","assert"],["attain","əˈteɪn","v.","达到；获得","Few programmes attain such high completion rates.","obtain 偏取得资源或信息。",0,"很少有项目能达到这么高的完成率。","Leo could finally attain the safety rating he needed.","里奥终于能达到重新营业所需的安全等级了。","attain"],["capture","ˈkæptʃə","v./n.","捕捉；刻画","A simple test may fail to capture how well learners apply a skill.","catch 泛指抓住，capture 也可表示准确反映。",0,"一个简单的测试可能无法反映学习者运用这项技能的熟练程度。","The camera did capture Leo offering her a little velvet box.","镜头确实拍到里奥递给她一个天鹅绒小盒子。","capture"],["compelling","kəmˈpelɪŋ","adj.","有说服力的；引人入胜的","The records provide compelling evidence of a change in behaviour.","compulsory 是强制的。",0,"这些记录有力地证明了行为发生了变化。","She thought the photo was compelling evidence of a secret engagement.","她把这张照片当成秘密订婚的铁证。","compelling"],["contrary","ˈkɒntrəri","adj./n.","相反的；相反情况","Contrary to expectations, attendance rose after fees were introduced.","contrast 强调对比。",0,"出乎意料的是，开始收费后，出席人数反而增加了。","Contrary to the rumour, nobody downstairs was drinking champagne.","跟传闻相反，楼下根本没人喝香槟。","Contrary"],["crucial","ˈkruːʃəl","adj.","至关重要的","Regular feedback was crucial to the success of the programme.","critical 也可指批判性的。",0,"定期反馈对项目的成功至关重要。","We'd missed one crucial moment: Leo picking the box up.","我们漏看了一个关键瞬间：里奥把盒子从地上捡起来。","crucial"],["debunk","ˌdiːˈbʌŋk","v.","揭穿；驳斥","The researchers used historical records to debunk a popular claim.","refute 偏以证据反驳论点。",0,"研究人员用历史记录驳斥了一种流行的说法。","One close-up could debunk the entire wedding story.","一个特写镜头就够把婚礼传闻全戳穿了。","debunk"],["despite","dɪˈspaɪt","prep.","尽管","Despite initial resistance, the plan won broad support.","although 是连词，后接从句。",0,"尽管起初遇到阻力，这项计划最终还是获得了广泛支持。","Despite the rain, our whole street turned up for the reopening.","虽然下着雨，整条街的人都来了，给重开张的咖啡馆捧场。","Despite"],["emphasis","ˈemfəsɪs","n.","重点；强调","The course places greater emphasis on applying ideas to new cases.","emphasise 是动词。",0,"这门课更强调把所学理念应用到新的案例中。","Mira put particular emphasis on keeping the passage clear every day.","米拉特意强调，这条通道每天都要保持畅通。","emphasis"],["endorse","ɪnˈdɔːs","v.","支持；认可","Several organisations endorsed the proposal after reviewing the evidence.","enforce 是强制执行。",0,"查阅证据后，几个机构表示支持这项提案。","Mira agreed to endorse the cake, so she took two slices.","米拉同意给蛋糕做个口头推荐，于是先拿了两块。","endorse"],["contradict","ˌkɒntrəˈdɪkt","v.","反驳；与……矛盾","The new measurements contradict the original prediction.","contrast 强调对比，contradict 表示说法不能同时成立。",0,"新的测量结果与最初的预测相矛盾。","The footage seemed to contradict every detail we'd posted.","看样子，我们发到群里的每个细节都被这段录像推翻了。","contradict"],["explain","ɪkˈspleɪn","v.","解释；说明","Previous experience may explain the difference between groups.","illustrate 侧重借例子说明。",0,"过往经历可能解释这些组之间的差异。","Mira had dropped her hearing aid, which would explain the kneeling.","米拉的助听器掉了，这就能解释他为什么跪在地上。","explain"],["extent","ɪkˈstent","n.","程度；范围","It is unclear to what extent the change affected younger workers.","extend 是延伸或延长。",0,"这项变化在多大程度上影响了较年轻的员工，目前尚不清楚。","I finally saw the extent of our mistake when I pressed play.","我按下播放键，才知道我们误会得有多离谱。","extent"],["fundamental","ˌfʌndəˈmentəl","adj./n.","根本的；基本原则","The debate exposed a fundamental disagreement about the purpose of the scheme.","elementary 偏入门、基础。",0,"这场辩论暴露出各方对该计划的目的存在根本分歧。","The fundamental problem was that every shop had the same narrow passage.","根本问题在于，这一排店铺门口的通道都很窄。","fundamental"],["illustrate","ˈɪləstreɪt","v.","说明；举例说明","The example illustrates why averages can be misleading.","elucidate 侧重解释难懂内容。",0,"这个例子说明了为什么平均值有时会误导人。","She opened the door halfway to illustrate the danger.","她只把门打开半扇，让我们亲眼看看这样有多危险。","illustrate"],["incorporate","ɪnˈkɔːpəreɪt","v.","纳入；吸收","The revised report incorporated comments from the local community.","corporate 表示公司的。",0,"修订后的报告纳入了当地社区的意见。","Leo asked if we could incorporate the bookshop courtyard into our plan.","里奥问，能不能把书店的院子也纳入方案。","incorporate"],["notion","ˈnəʊʃən","n.","观念；想法","The study challenges the notion that longer hours always improve output.","motion 是动作或动议。",0,"这项研究质疑了「工作时间越长，产出就一定越高」的观念。","The group chat loved the notion of a wedding for a licence.","楼群里的人可爱听了，纷纷猜他这是拿结婚换执照。","notion"],["particular","pəˈtɪkjələ","adj.","特定的；讲究的","The guidance applies to a particular group of applicants.","partial 是部分的或偏袒的。",0,"这项指导意见适用于某一类申请人。","One particular frame showed him on both knees.","有一帧特别惹眼：他双膝都跪在地上。","particular"],["pose","pəʊz","v./n.","造成；提出","Rising rents pose a challenge for workers on temporary contracts.","posture 强 ion 偏不同语言间转换。",0,"专家们对这件器物上的场景有不同的解读。","The director's first interpretation involved stolen jewels and a hasty escape.","馆长最初的解读，已经脑补到偷珠宝、仓皇出逃了。","interpretation"],["monument","ˈmɒnjʊmənt","n.","纪念碑；历史遗迹","The monument is now protected by local regulations.","moment 是时刻。",0,"这座纪念碑如今受到当地法规的保护。","The island had no monument to the singer until we erected one.","岛上原来没有纪念这位歌手的纪念碑，后来我们立了一座。","monument"],["origin","ˈɒrɪdʒɪn","n.","起源；来源","The origins of the custom are difficult to establish.","original 是原始的或原创作品。",0,"这种习俗的起源很难确定。","She said the teapot's origin had something to do with Saturday concerts.","她说，这把壶的来历和周六的演出有关。","origin"],["preservation","ˌprezəˈveɪʃən","n.","保存；保护","The project improved the preservation of fragile documents.","prevention 是预防。",0,"这个项目改善了脆弱文献的保存状况。","Her granddaughter cared about the preservation of those notes, doodles included.","她外孙女很在意这些笔记能不能保存下来，连随手画的涂鸦也要保住。","preservation"],["prosper","ˈprɒspə","v.","繁荣；成功","The settlement prospered after a new route opened.","prospect 是前景。",0,"一条新路线开通后，这座聚落繁荣起来。","Even the café began to prosper by selling duck-shaped biscuits.","连咖啡馆都靠卖鸭子形状的饼干红火起来。","prosper"],["recognition","ˌrekəɡˈnɪʃən","n.","认可；识别","The project brought wider recognition to local artists.","recollection 是回忆。",0,"这个项目让当地艺术家获得了更广泛的认可。","The teapot gained national recognition after our intern posted the sound online.","实习生把鸭叫声传上网，茶壶在全国都出名了。","recognition"],["restore","rɪˈstɔː","v.","修复；恢复","Specialists restored the old building using local materials.","recover 偏自行恢复或重新获得。",0,"专家用当地的材料修复了这座旧建筑。","The granddaughter helped us restore the battered whistle to working order.","外孙女帮我们把这个旧得不成样的哨子修到能用了。","restore"],["reveal","rɪˈviːl","v.","揭示；透露","The objects reveal how local families prepared food.","conceal 是隐藏。",0,"这些器物揭示了当地家庭过去是怎样准备食物的。","We lifted the lid to reveal a bus ticket and concert receipts.","一掀盖子，里面只有一张公交车票和几张演出票据。","reveal"],["ritual","ˈrɪtʃuəl","n./adj.","仪式；仪式的","The ritual marked the beginning of the harvest.","routine 是日常程序。",0,"这项仪式标志着收获季的开始。","Recording the quack became a small ritual for visitors.","来参观的人总要录一声鸭叫，渐渐成了个小仪式。","ritual"],["significance","sɪɡˈnɪfɪkəns","n.","重要性；含义","The exhibition explains the historical significance of the site.","significant 是形容词。",0,"展览介绍了这处遗址的历史意义。","The teapot's significance was obvious when everyone joined the final quack.","听见全场跟着嘎地叫完最后一声，谁都明白这把茶壶为什么重要了。","significance"],["symbol","ˈsɪmbəl","n.","象征；符号","The bridge became a symbol of the town's recovery.","sign 泛指征兆、标志或手势。",0,"这座桥成了小镇复苏的象征。","A little duck on the new monument became the band's symbol.","新纪念碑上有只小鸭子，就这样成了乐队的象征。","symbol"],["technique","tekˈniːk","n.","技巧；工艺方法","The weaving technique was passed down within families.","technology 偏技术体系或应用。",0,"这项编织技艺在家族内部代代相传。","The singer's technique for quieting drunks involved one very loud quack.","对付吵闹的醉汉，那位歌手有一招：嘎地叫一声，声音特别大。","technique"],["tourism","ˈtʊərɪzəm","n.","旅游业；旅游活动","Tourism provided new opportunities for artisans in smaller villages.","tourist 是游客。",0,"旅游业为较小村庄里的手艺人带来了新的机会。","Our island museum depended on summer tourism to pay its bills.","岛上的博物馆靠夏天的游客收入来维持开支。","tourism"],["chronicle","ˈkrɒnɪkəl","n./v.","编年史；记录","The letters chronicle a period of rapid change in the city.","chronological 是按时间顺序的。",1,"这些书信记录了这座城市快速变化的一段时期。","Our new display would chronicle her trips between ports and clubs.","新展板将记录她当年往返各个港口和俱乐部的演出经历。","chronicle"],["ceremony","ˈserəməni","n.","典礼；仪式","The ceremony took place in the oldest part of town.","ritual 常强调有象征意义的惯常动作。",1,"仪式在镇上最古老的街区举行。","At the pier's opening ceremony, the mayor quacked a full beat early.","码头的开幕典礼上，市长那声鸭叫整整抢了一拍。","ceremony"],["circulation","ˌsɜːkjʊˈleɪʃən","n.","流通；循环","Printing increased the circulation of practical knowledge.","circulate 是动词。",1,"印刷术让实用知识传播得更广。","By Monday, a clip of the quack was in wide circulation.","到了周一，那声鸭叫的短视频已经到处在传。","circulation"],["commemorate","kəˈmeməreɪt","v.","纪念","The exhibition commemorates the opening of the original library.","celebrate 常强调庆祝。",1,"这场展览是为纪念原来的图书馆开馆而举办的。","We decided to commemorate the singer with another Saturday concert.","我们决定再办一场周六演出，纪念那位歌手。","commemorate"],["contemporary","kənˈtemprəri","adj./n.","当代的；同一时期的","The collection places contemporary paintings beside older works.","temporary 表示临时的。",1,"这批展品把当代画作和年代更早的作品摆在一起。","The glamorous Crown Band had played contemporary jazz in a borrowed shed.","当年那支光鲜的皇冠乐队，是在借来的棚子里演奏当代爵士乐的。","contemporary"],["dynasty","ˈdɪnəsti","n.","王朝；统治家族","The vessels date from the beginning of a new dynasty.","empire 指帝国。",1,"这些器皿可以追溯到一个新王朝建立之初。","He couldn't remember which dynasty, but he was very sure about the queen.","哪个王朝，他说不上来，但女王这一点他可确定了。","dynasty"],["excavate","ˈekskəveɪt","v.","发掘；挖掘","Archaeologists excavated the area around the old market.","evacuate 是撤离。",1,"考古学家在旧市场周围进行了发掘。","The club let us excavate a little beneath its damaged floor.","俱乐部同意让我们在破地板下面稍微挖一挖。","excavate"],["forge","fɔːdʒ","v.","建立；伪造","Trade helped forge lasting links between distant communities.","fabricate 也可指编造。",1,"贸易促进了相距遥远的社区之间建立持久的联系。","Nobody had tried to forge a royal seal; the crown was a logo.","没人伪造过王室印章，那个皇冠只是乐队的标志。","forge"],["indigenous","ɪnˈdɪdʒənəs","adj.","本土的；土著的","Indigenous communities have preserved several distinct languages.","ingenious 是巧妙的。",1,"原住民社区保留了几种不同的语言。","The painted duck was based on a bird indigenous to the island.","壶上画的鸭子，原型是岛上的一种本土鸟。","indigenous"],["manuscript","ˈmænjʊskrɪpt","n.","手稿；写本","A manuscript revealed details missing from printed accounts.","transcript 多指抄本或文字记录。",1,"一份手稿揭示了印刷记载中缺失的细节。","Her family still had the manuscript for her last set.","她家里还留着她最后一场演出的乐谱手稿。","manuscript"],["oral","ˈɔːrəl","adj.","口头的；口腔的","Oral histories offer a perspective missing from official records.","aural 指听觉的。",1,"口述历史提供了官方记录里缺少的视角。","The potter's oral account led us to a jazz club by the ferry.","制陶师口头给我们讲了以前的事，我们顺着线索找到了渡轮码头边的爵士俱乐部。","oral"],["portray","pɔːˈtreɪ","v.","描绘；刻画","Later writers portrayed the settlement as a major cultural centre.","portrait 是肖像。",1," arrass museums.","按本地传说，王室的东西通常能实现愿望，哪会让博物馆难堪。","folklore"],["inscription","ɪnˈskrɪpʃən","n.","铭文；题词","The inscription helped researchers date the object.","description 是描述。",2,"这段铭文帮助研究人员确定了这件器物的年代。","A tin had an inscription that read 'Property of the Queen'.","一只铁盒上还刻着字：「女王所有」。","inscription"],["pottery","ˈpɒtəri","n.","陶器；制陶","Fragments of pottery were found near the entrance.","porcelain 特指瓷器。",2,"人们在入口附近发现了陶器碎片。","A photograph showed the singer's most treasured piece of pottery: our teapot.","还有张照片，歌手手里捧着她最宝贝的陶器，正是我们那把茶壶。","pottery"],["prosperity","prɒˈsperəti","n.","繁荣；富裕","Commercial prosperity changed the city's built environment.","prosper 是动词。",2,"商业繁荣改变了这座城市的建筑环境。","The concerts brought modest prosperity to shops around the museum.","演出给博物馆周边的店铺带来了一点久违的好生意。","prosperity"],["revival","rɪˈvaɪvəl","n.","复兴；复苏","The festival contributed to a revival of interest in traditional music.","reversal 指反转。",2,"这个节庆有助于重新唤起人们对传统音乐的兴趣。","The jazz revival soon outgrew the museum and moved to the pier.","这股爵士乐复兴的热潮很快就挤不下了，活动搬到了码头。","revival"],["textile","ˈtekstaɪl","n./adj.","纺织品；纺织的","Textile production provided work during the winter.","texture 是质感或纹理。",2,"纺织生产在冬季提供了工作机会。","A blue textile patch in the coat matched one in the photo.","外套上一块蓝布补丁，跟照片里的那块对得上。","textile"]],[["accelerated","əkˈseləreɪtɪd","adj.","加速的；速成的","Accelerated growth put pressure on public services.","accelerate 是动词，accelerated 常作过去分词形容词。",0,"增长加快给公共服务带来了压力。","Our accelerated ceremony skipped two readings and an entire song.","婚礼仪式提速后，跳过了两段朗诵和一整首歌。","accelerated"],["anticipate","ænˈtɪsɪpeɪt","v.","预料；预先应对","Planners anticipated that demand would increase after the move.","expect 常指预期，anticipate 还可含预先准备。",0,"规划人员预料，搬迁后需求会增加。","We didn't anticipate that guests would bring their own dogs too.","我们没料到，连婚礼宾客也带了自家的狗来。","anticipate"],["cease","siːs","v.","停止；终止","The service ceased operating when funding ended.","seize 是抓住。",0,"资金一断，这项服务就停止了运营。","The best man asked the barking to cease, with predictable results.","伴郎要求狗别叫了，结果嘛，你猜得到。","cease"],["complex","ˈkɒmpleks","adj./n.","复杂的；综合体","The cost of housing reflects a complex combination of factors.","complicated 强调难处理或难解释。",0,"住房成本反映了多种因素的复杂作用。","Things got more complex when Nina's cousins started entering their dogs.","等妮娜的表亲也给各自的狗报了名，事情更复杂了。","complex"],["conventional","kənˈvenʃənəl","adj.","传统的；常规的","Conventional methods did not capture short-term changes.","convenient 是便利的。",0,"常规方法未能捕捉到短期变化。","Nina didn't want a conventional wedding in a hotel ballroom.","妮娜不想在酒店宴会厅办一场规规矩矩的婚礼。","conventional"],["convert","kənˈvɜːt / ˈkɒnvɜːt","v./n.","转换；转变","The project converted an empty office into affordable homes.","conserve 是保护或节约。",0,"这个项目把一处空置的办公场所改建成了价格可负担的住房。","Staff had agreed to convert the hall into a dance floor.","工作人员已经同意把礼堂改成舞池。","convert"],["declared","dɪˈkleəd","adj.","公开宣称的；申报的","The declared aim was to reduce costs for residents.","decided 可指明确的或坚定的。",0,"公开宣布的目标是降低居民的开支。","The declared winner was the spaniel, whose prize was another piece of cheese.","最后宣布夺冠的是那只西班牙猎犬，奖品嘛，又是一块奶酪。","declared"],["definite","ˈdefɪnət","adj.","明确的；确定的","The evidence does not support a definite conclusion.","definitive 更强调权威、最终。",0,"现有证据不足以得出明确的结论。","The judge gave a definite answer: the dog could join the photo.","裁判给了准话：那只狗可以一起拍照。","definite"],["divert","daɪˈvɜːt","v.","转移；使改道","Some of the funding was diverted to emergency repairs.","convert 是转变用途或形式。",0,"部分资金被调去用于紧急维修。","Nina tried to divert its attention with a piece of cheese.","妮娜试着用一小块奶酪引开它。","divert"],["eliminate","ɪˈlɪmɪneɪt","v.","消除；淘汰","Adjusting for age did not eliminate the difference.","illuminate 是照亮或说明。",0,"将年龄因素纳入调整后，差异依然存在。","Sharing that aisle would eliminate the need for two separate rooms.","过道要是能共用，就不用找两个单独的房间了。","eliminate"],["evolve","ɪˈvɒlv","v.","演变；进化","Workplace practices evolve as new tools become available.","involve 是涉及。",0,"随着新工具投入使用，工作方式也会演变。","Even our seating plan had to evolve as more cousins arrived.","来的表亲越来越多，连座位怎么排也得跟着改。","evolve"],["feasible","ˈfiːzəbəl","adj.","可行的","The option was technically feasible but costly to implement.","visible 是看得见的。",0,"这个方案在技术上可行，但实施成本很高。","The hall made a wedding for forty people financially feasible.","有了这座礼堂，请四十个人办婚礼的钱就有着落了。","feasible"],["initial","ɪˈnɪʃəl","adj./n.","最初的；首字母","The initial rise in attendance did not last.","initiative 是倡议或主动性。",0,"出席人数起初有所增加，但这一增势没有维持下去。","Our initial wedding plan involved forty guests and absolutely no dogs.","我们的婚礼原本只请四十个客人，一个狗客人都没有。","initial"],["insight","ˈɪnsaɪt","n.","洞见；了解","The interviews provide insight into how the policy affected families.","sight 是视力或景象。",0,"这些访谈让人们更深入地了解这项政策对家庭的影响。","The judge offered a useful insight: that spaniel always traded for cheese.","裁判提醒我们一件事：那只狗每次都肯拿东西换奶酪。","insight"],["implementation","ˌɪmplɪmenˈteɪʃən","n.","实施；落实","Implementation was delayed by a shortage of trained staff.","implement 是动词，implementation 是实施过程。",0,"由于缺少受过培训的人员，实施工作被推迟了。","The implementation began with the poodles, who took their positions promptly.","新安排从贵宾犬开始执行，它们立刻各就各位。","implementation"],["majority","məˈdʒɒrəti","n.","多数；大多数","A majority of residents supported the cheaper option.","minority 是少数。",0,"大多数居民支持成本较低的方案。","A majority of our wedding guests wanted to stay and watch.","大多数婚礼来宾居然想留下来看狗展。","majority"],["mutually","ˈmjuːtʃuəli","adv.","相互地；共同地","The two services are designed to be mutually supportive.","multiply 是相乘或增加。",0,"这两项服务在设计上可以相互支持。","The manager insisted that a dog show and a wedding were mutually exclusive.","经理坚持认为，狗展和婚礼只能办一个。","mutually"],["neutral","ˈnjuːtrəl","adj.","中立的；中性的","Participants were given a neutral description of both options.","natural 是自然的。",0,"参与者收到了一份对两个方案的中立介绍。","The hall manager stayed neutral in the dispute over who should leave.","争到该哪一方离场时，礼堂经理两边都不站。","neutral"],["obstacle","ˈɒbstəkəl","n.","障碍","Cost remains a major obstacle to wider adoption.","obstruction 偏阻挡物或阻碍动作。",0,"成本仍是扩大采用范围的一大障碍。","The first obstacle was a spaniel guarding the cake table.","头一个难关是桌边那只西班牙猎犬，它守着蛋糕不让人靠近。","obstacle"],["obligation","ˌɒblɪˈɡeɪʃən","n.","义务；责任","Employers have an obligation to provide basic safety training.","requirement 是要求，obligation 常指承担的责任。",0,"雇主有义务提供基本的安全培训。","Her mum felt an obligation to invite every cousin anyway.","可她妈妈觉得，再怎么说也得把所有表亲都请来。","obligation"],["parallel","ˈpærəlel","adj./n.","平行的；对应关系","There is a parallel between the two cases.","paralysis 是瘫痪。",0,"这两个案例有相似之处。","Nina saw a parallel: both events needed a long central aisle.","妮娜却发现了一个共同点：两场活动都需要一条长长的过道。","parallel"],["promote","prəˈməʊt","v.","促进；推广","The policy aims to promote cooperation among local schools.","prompt 强调促使立刻行动。",0,"这项政策旨在促进当地学校之间的合作。","Meanwhile, the local dog club began to promote its Saturday show.","与此同时，本地爱犬俱乐部开始宣传周六的狗展。","promote"],["significantly","sɪɡˈnɪfɪkəntli","adv.","显著地；明显地","The cost fell significantly after the service was expanded.","substantially 强调幅度大，significantly 也可强调统计显著。",0,"服务扩展后，成本大幅下降。","Their interest in the cake had decreased significantly by then.","到那会儿，它们对蛋糕的兴趣已经明显低多了。","significantly"],["transition","trænˈzɪʃən","n./v.","过渡；转型","The transition to a new system took several months.","transaction 是交易。",0,"过渡到新系统花了几个月。","The transition from dog judging to vows nearly went unnoticed.","从评狗到念婚礼誓词，转得顺到差点没人察觉。","transition"],["urgent","ˈɜːdʒənt","adj.","紧急的；迫切的","The report identified an urgent need for cheaper housing.","emergent 偏新出现的。",0,"报告指出，人们迫切需要价格更低的住房。","An urgent message came from the hall on Saturday morning.","周六一早，礼堂发来一条急讯。","urgent"],["abrupt","əˈbrʌpt","adj.","突然的；唐突的","An abrupt change in policy made planning more difficult.","abruptly 是副词。",1,"政策突然变动，使得制定计划更困难。","Our conversation came to an abrupt end when the first dog barked.","第一只狗一叫，我们的话立刻就断了。","abrupt"],["aggregate","ˈæɡrɪɡət / ˈæɡrɪɡeɪt","n./adj./v.","总量；汇总","The aggregate figures masked large regional differences.","aggravate 是加剧。",1,"汇总数据掩盖了各地区之间的巨大差异。","In aggregate, the two groups needed over a hundred chairs.","两拨人加起来要坐一百多把椅子。","aggregate"],["alteration","ˌɔːltəˈreɪʃən","n.","改变；改动","A minor alteration to the form improved response rates.","alternation 是交替。",1,"对表格的一处小改动提高了回复率。","One alteration on our invitation moved the wedding forward to Saturday.","请柬上改了一处，把我们的婚礼提前到了周六。","alteration"],["attendant","əˈtendənt","adj./n.","伴随的；服务员","The adoption of new technology brought attendant costs.","attendance 是出席。",1,"采用新技术也带来了相应的成本。","An attendant rushed over, but the dog had already swallowed it.","一位服务员连忙跑过来，狗却已经把奶酪吞了。","attendant"],["compulsory","kəmˈpʌlsəri","adj.","强制的；必修的","The government made safety training compulsory.","compelling 是有说服力的。",1,"政府规定必须参加安全培训。","The dog judge agreed, provided that leads remained compulsory indoors.","狗展裁判同意了，前提是室内所有狗都得拴绳。","compulsory"],["consecutive","kənˈsekjətɪv","adj.","连续的；相继的","Rent rose for three consecutive years.","simultaneous 是同时的。",1,"房租连续上涨了三年。","The dog club had booked the same Saturday for five consecutive years.","爱犬俱乐部已经连续五年订了同一个周六。","consecutive"],["crisis","ˈkraɪsɪs","n.","危机；紧要关头","The shortage developed into a regional crisis.","crises 是复数。",1,"短缺逐渐演变成了一场区域性危机。","The seating crisis ended when the club brought out folding chairs.","爱犬俱乐部搬出折叠椅，抢座危机总算解除了。","crisis"],["downside","ˈdaʊnsaɪd","n.","缺点；不利面","A downside of remote meetings is the loss of informal conversation.","drawback 同为缺点，downside 常指某选择的不利面。",1,"远程会议的一个缺点是少了随意交谈的机会。","The downside was that our guests had to sit beside the contestants.","坏处是，我们的来宾得挨着参赛狗坐。","downside"],["equity","ˈekwəti","n.","公平；股权","The proposal sought to improve equity in access to education.","equality 强调平等。",1,"这项提案旨在让获得教育的机会更加公平。","Her uncle owned equity in a hall that we could rent cheaply.","她舅舅是个礼堂的股东，我们去租能便宜些。","equity"],["formulate","ˈfɔːmjəleɪt","v.","制定；明确表述","Local officials met to formulate a response to the shortage.","formalise 是使正式化。",1,"当地官员开会制定应对短缺的措施。","Nina helped formulate a schedule using the back of a menu.","妮娜用菜单背面帮大家排了张时间表。","formulate"],["gradual","ˈɡrædʒuəl","adj.","逐渐的；渐进的","A gradual decline in costs made the system more ","equality","conform","cohesion","tradition","heritage","legacy","plural"],[]]],[["楼上晚上十二点开始拖椅子","我把半夜的异响[[anomaly]]记下来，具体[[specific]]到十二点零三，其实大约[[approximate]]在那个点。录音够准确[[accurate]]，有前后顺序[[sequence]]，两声还各自独立[[discrete]]。我立刻联想到[[associate]]楼上，室友说这个猜测有争议[[controversial]]。为了客观[[objective]]、弄清听不准[[uncertainty]]的地方，我们在门口蹲着听，最后看见室友的定时扫地机器人把板凳从客厅推到了玄关。",["anomaly","specific","approximate","accurate","sequence","discrete","associate","controversial","objective","uncertainty"],[]],["外卖迟到了五分钟","室友想界定[[define]]外卖总迟到的原因，限制[[constraint]]是他一天就吃一顿外卖。他搭好记录框架[[framework]]，调整[[adjust]]实验用的[[experimental]]下单时间，控制变量[[variable]]，拿平时用时作基准[[baseline]]，量[[measure]]了五天。假设[[hypothesis]]是骑手绕路，设定参数[[parameter]]迟五分钟就查一次。后来他发现，自己住三号楼，地址从去年就写着五号楼。",["define","constraint","framework","adjust","experimental","variable","baseline","measure","hypothesis","parameter"],[]],["我爸证明数学能管住猫","我爸说猫一听到塑料袋响就跑来，要用实测[[empirical]]确认[[confirm]]。他把叫声当指标[[indicator]]，记时间间隔[[interval]]，量化[[quantify]]猫到场速度，还校对计时准确性[[accuracy]]，找条件相近[[comparable]]的记录。袋响和猫叫同时[[simultaneous]]出现，他以为相关[[correlation]]就是因果[[causal]]。我妈把猫粮锁起来后，他晃了半晚袋子，最后跑过来的只有我。",["empirical","confirm","indicator","interval","quantify","accuracy","comparable","simultaneous","correlation","causal"],[]],["门铃拍到一个会消失的人","我查到外部[[external]]摄像头，想确定[[determine]]消失的人是谁。取个录像样本[[sample]]，从反光推断[[infer]]他穿校服，凭脚步再推断[[deduce]]是个孩子。室友怀疑虚影是成像假象[[artifact]]，由此得出[[derive]]角度一变就看不见的预测。我们重现[[reproduce]]并重复验证[[replicate]]，保安的录像也证实[[corroborate]]了。那是奶茶店的立牌，玻璃门把它映了两遍。",["external","determine","sample","infer","deduce","artifact","derive","reproduce","replicate","corroborate"],[]],["谁把冰箱里的蛋糕吃了","减肥目标很抽象[[abstract]]，冰箱里少了蛋糕可太具体了，暂时[[tentative]]的猜测是室友。他有偷吃的倾向[[tendency]]，可这次关键[[integral]]线索是盒子还封着。我盘出个新发现[[finding]]，用称重让证据更扎实[[robust]]。推断方法虽适用[[applicable]]，却不能推广[[generalise]]到所有蛋糕。最后理解了一个概念[[concept]]，空盒也有重量。我下结论[[conclude]]，昨天的外卖订单写的是「六寸蛋糕盒一只」。",["abstract","tentative","tendency","integral","finding","robust","applicable","generalise","concept","conclude"],[]]],[["一等奖原来住在食堂","校庆摄影赛，有人断言[[assert]]冠军改动[[alter]]过照片，因为猫在食堂排队，看起来[[appear]]太懂事了。小周陪[[accompany]]评委去查，公认平易近人[[approachability]]的食堂阿姨大方承认[[acknowledge]]，她每天都给猫留位置。本想拍下[[capture]]现场找有力[[compelling]]证据，结果恰恰相反[[contrary]]，照片是真的。阿姨还掏出考勤本：这猫达到了[[attain]]连续二十天准时排队的纪录。",["assert","alter","appear","accompany","approachability","acknowledge","capture","compelling","contrary","attain"],[]],["停电通知差了一位数字","宿舍群疯传今晚要停电，大家刚点完蜡烛，值班阿姨就贴出通知来辟谣[[debunk]]。关键[[crucial]]处是楼号：两栋楼的号码差一位数字，旧截图与今早公告相矛盾[[contradict]]。她解释[[explain]]了误传范围[[extent]]，特意强调[[emphasis]]根本[[fundamental]]区别，拿两份公告举例说明[[illustrate]]。尽管[[despite]]闹了乌龙，她仍赞成[[endorse]]大家备个手电筒，尤其是那个买了三箱蜡烛的舍友。",["debunk","crucial","contradict","explain","extent","emphasis","fundamental","illustrate","despite","endorse"],[]],["想白喝奶茶的会计","校庆有机会[[prospect]]拿到奶茶赞助，社长兴冲冲把免费续杯的点子[[notion]]纳入[[incorporate]]活动方案。财务盯住某条[[particular]]细则：只请前十名。店主乐意[[readily]]给名额之外的人报价[[quote]]，但不肯扩大赞助范围[[scope]]。财务坚持公平原则[[principle]]，指出大家挤着抢会造成[[pose]]安全问题。最后最可能[[probable]]喝到奶茶的人，成了自己出钱点单的会计。",["prospect","notion","incorporate","particular","readily","quote","scope","principle","pose","probable"],[]],["修车摊搬进停车棚","旧街加速城市化[[urbanisation]]，空地修成了小区，老修车摊一下没了地方。物业愿意负责[[undertake]]找位置，大家先着手解决[[tackle]]噪音，发现不同时间段的意见差别[[vary]]很大。最终[[ultimate]]方案是挪[[shift]]进停车棚，再补上[[supplement]]一块隔音板。通风至关重要[[vital]]，值得[[warrant]]再检查一次。试营业第一天排了前所未有[[unprecedented]]的长队，排第一的是物业经理，他推的是自己的童车。",["urbanisation","undertake","tackle","vary","ultimate","shift","supplement","vital","warrant","unprecedented"],[]],["一张表救不了团购","小区团购有价格优势[[advantage]]，却被取货限制[[constrain]]拖累。两栋楼的负责人是同样的岗位[[counterpart]]，本来相互依赖[[interdependent]]，现在各丢了一单，互不承认。居委会请他们详细说明[[elaborate]]，查清了谁的说法站得住脚[[justify]]；定性[[qualitative]]反馈说晚下班的人领不到菜。两人妥协[[compromise]]，一人早值班、一人晚值班，互相补位[[complement]]，免得再伤害[[undermine]]大家对团购的信任。",["advantage","constrain","counterpart","interdependent","elaborate","justify","qualitative","compromise","complement","undermine"],[]]],[["校史展台上的大搪瓷缸","校史社想展出[[exhibit]]一只老缸，社长以为它是古代[[ancient]]器物。照片里这栋楼的建筑[[architecture]]有民国的典型[[characteristic]]风格，缸面工艺[[craft]]却明显不同[[distinct]]。大家翻历史[[historical]]档案记录[[document]]这只缸的演变[[evolution]]，才发现它原是两校交流[[exchange]]时送的纪念品。校友一眼认出：他当年拿它泡过方便面。",["exhibit","ancient","architecture","characteristic","craft","distinct","historical","document","evolution","exchange"],[]],["外婆的修伞摊","巷口碑[[monument]]上刻着「月老伞铺」，大家对名字的解读[[interpretation]]都很浪漫。她继承[[inherit]]外婆的摊子，修复[[restore]]招牌，尽力保存[[preservation]]老式伞骨。邻居认可[[recognition]]她的手艺，生意又兴旺[[prosper]]了。她受外婆影响[[influence]]，每把伞都修得仔细。一次拆下牌匾，背面老字揭示[[reveal]]名字的来历[[origin]]：外婆姓月。",["monument","interpretation","inherit","restore","preservation","recognition","prosper","influence","reveal","origin"],[]],["一场特别短的龙舟赛","村里为纪念[[commemorate]]老渡口，办了开幕仪式[[ceremony]]。孩子用手机记录[[chronicle]]划桨技巧[[technique]]，拍成短视频到处流传[[circulation]]，还带火了村里的旅游[[tourism]]。赛前敲一下锣是当地仪式[[ritual]]，也是龙舟队的标志[[symbol]]。懂了这层意义[[significance]]，年轻人配上了当代[[contemporary]]音乐。可锣刚敲响，裁判才发现两队都没解缆。",["commemorate","ceremony","chronicle","technique","circulation","tourism","ritual","symbol","significance","contemporary"],[]],["鱼缸里的石头要归还吗","博物馆的考古从业者[[practitioner]]来村里采风，听了口述[[oral]]传闻：邻省[[province]]某王朝[[dynasty]]的文物[[relic]]藏在老井边。获准发掘[[excavate]]后，他们找到本土[[indigenous]]石料做的牌子。老人手稿[[manuscript]]把它描绘[[portray]]成官印，专家仔细查了有没有伪造[[forge]]字迹。村民一看就认出来了，牌子原来是他爷爷刻来垫鱼缸的。",["practitioner","oral","province","dynasty","relic","excavate","indigenous","manuscript","portray","forge"],[]],["旧街的新招牌","旧街复兴[[revival]]后，志愿者照老路线[[route]]做了一次街区考古[[archaeology]]导览。纺织品[[textile]]店展出一件陶器[[pottery]]容器[[vessel]]，上面的书法[[calligraphy]]题字[[inscription]]写着「一文不赊」。原来当地民间传说[[folklore]]中的聚宝盆，就是店主放账单的盆。街市繁荣[[prosperity]]的秘密，看来不是许愿，是从来不赊账。",["revival","route","archaeology","textile","pottery","vessel","calligraphy","inscription","folklore","prosperity"],[]]],[["节目单上藏着张外卖单","毕业晚会彩排突然提速[[accelerated]]，大家没预料[[anticipate]]礼堂灯会停[[cease]]。临时改灯光太复杂[[complex]]，辅导员公开宣布[[declared]]沿用常规[[conventional]]流程。灯光师提出一个确定[[definite]]办法：把手机改作[[convert]]照明灯，用歌声转移[[divert]]观众注意，再省去[[eliminate]]报幕。全班摸黑上台时，主持人才发现手里捏的不是节目单，是自己的外卖单。",["accelerated","anticipate","cease","complex","declared","conventional","definite","convert","divert","eliminate"],[]],["占座大战，输给了凉水壶","自习室最初[[initial]]有个占座惯例，多数[[majority]]人觉得书包算人。班长有义务[[obligation]]协调，保持中立[[neutral]]，先找出真正障碍[[obstacle]]：两个班恰好同时下课，大家的占座要求彼此无法兼顾[[mutually]]。管理员从人少时空出整排座位得到启发[[insight]]，做了可行[[feasible]]的限时牌，实施[[implementation]]后规矩慢慢变了[[evolve]]。第一个被挪走的占位物，是班长放的凉水壶。",["initial","majority","obligation","neutral","obstacle","mutually","insight","feasible","implementation","evolve"],[]],["食堂比赛怎么成了赶集","食堂紧急[[urgent]]通知：下午的包饺子赛要和跳绳赛共用操场。员工负责推广[[promote]]活动，临时改动[[alteration]]后，参加人数累计[[aggregate]]过百。服务员[[attendant]]发现两项比赛有个共同点[[parallel]]，都得排长队。转场[[transition]]时天气突变[[abrupt]]，跑动明显[[significantly]]变多。组委会索性规定[[compulsory]]先交参赛签到，再领一碗汤，队伍就只往一个方向走了。",["urgent","promote","alteration","aggregate","attendant","parallel","transition","abrupt","significantly","compulsory"],[]],["团建费是怎么省下来的","办公室连续[[consecutive]]三年办团建都超预算。这次包车钱不够[[inadequate]]，马上遇到退款危机[[crisis]]。同事制定[[formulate]]了分开打车的办法，缺点[[downside]]是再晚一步就免不了[[inevitable]]堵车。为让实习生也公平[[equity]]参与，约定出发前[[precede]]先拼车，费用逐步[[gradual]]摊开，迟到的可能[[likelihood]]也小了。集合时只有一人迟到，原来经理自己坐反了地铁。",["consecutive","inadequate","crisis","formulate","downside","inevitable","equity","precede","gradual","likelihood"],[]],["群里最安静的一分钟","社区夜跑群误[[inadvertent]]发了凌晨集合通知，后续[[subsequent]]一查，原来忽略[[overlook]]了群里那个「明早」的定时按钮。群主让大家表决要不要改期，楼长投了弃权票[[abstain]]。可行[[viable]]办法是先停止[[cessation]]闹钟接龙，免得扰乱[[disruptive]]睡眠、妨碍[[impede]]上班。深夜消息渐渐少了[[dwindle]]，群主送豆浆弥补[[offset]]过错。全群一致改名叫「早起失败互助会」。",["inadvertent","subsequent","overlook","abstain","viable","cessation","disruptive","impede","dwindle","offset"],[]]]];

const BILINGUAL_STORIES = [[["室友的冰箱给卧室供暖",[["When the electricity bill rose by fifty yuan, my flatmate asked me to account for the difference. His only evidence was that I came home late.","电费一涨五十块，室友就让我解释多出来的钱。他唯一的证据是我回家晚。",[["account","account for"],["evidence","evidence"]]],["He assumed I hated the cold and claimed I had left the heater on all night.","他认准我怕冷，一口咬定我开了一整晚暖气。",[["assume","assumed"],["claim","claimed"]]],["The meter indicated that his room used the most power, so I suggested unplugging his fridge.","电表显示他房间才最费电，我提议把他的冰箱插头拔了试试。",[["indicate","indicated"],["suggest","suggested"]]],["He'd attributed the bill to me, but his fridge contributed more to it than anything else.","他把账单怪到我头上，结果耗电最多的恰恰是他自己的冰箱。",[["attribute","attributed"],["contribute","contributed"]]],["The broken door affected the temperature of the whole room. It resulted in a bedroom with central heating in July.","坏掉的冰箱门影响了整个房间的温度。七月份，他就这样拥有了一间带暖气的卧室。",[["affect","affected"],["result","resulted in"]]]]],["实习考核，满分靠塑料",[["Our manager adopted a new approach to assessing interns: he gave us plants.","主管想了个新的考核办法，给每个实习生发一盆花。",[["adopt","adopted"],["approach","approach"]]],["We had to adapt to office life and keep a plant alive. The job involved daily checks and required a photo every morning.","我们得适应办公室生活，还要保证花不死。每天都要检查一次，每天早上交一张照片。",[["adapt","adapt to"],["involve","involved"],["require","required"]]],["I responded at once whenever he sent a reminder. He conducted weekly checks to assess our progress.","主管一提醒我就秒回。他每周巡查一次，评估我们的进度。",[["respond","responded"],["conduct","conducted"],["assess","assess"]]],["The cleaner identified my plant as a plastic one. That established why it had never needed water.","保洁阿姨一眼认出我那盆是塑料的。这就解释了它怎么从来不用浇水。",[["identify","identified"],["establish","established"]]],["I still got top marks. The report said I was good at managing risk.","我照样拿了优秀。评语说我善于控制风险。",[]]]],["奶奶主持模拟面试",[["I asked Grandma to simulate a job interview so I could build my confidence.","我请奶奶模拟面试，想给自己壮壮胆。",[["simulate","simulate"],["confidence","confidence"]]],["She was reluctant at first. When she said I had potential, I perceived a hint of sincerity.","她一开始不太情愿。她说我有潜力的时候，我还真听出了一点诚意。",[["reluctant","reluctant"],["potential","potential"],["perceive","perceived"]]],["Her feedback was simple: ask for more money. It was surprisingly effective in calming me down.","她的反馈很简单，工资往高了报。这办法还真让我没那么紧张了。",[["feedback","feedback"],["effective","effective"]]],["The unexpected outcome was that Mum grabbed my CV. She thought the difference in pay was significant.","意想不到的结果是，我妈一把抢过了简历。她觉得这工资差距可不小。",[["outcome","outcome"],["significant","significant"]]],["“There's one underlying issue,” she said. “Why didn't anyone ask if I wanted to change jobs?”","她说：“这事有个根本问题吧。怎么就没人问我想不想跳槽？”",[["underlying","underlying"]]]]],["菜场英语角",[["I wanted to acquire some practical English, so I volunteered to interact with tourists at the market.","我想学点实用英语，就报名到菜场当志愿者，跟外国游客聊聊天。",[["acquire","acquire"],["interact","interact with"]]],["Grandma came along and immediately engaged a stallholder in a long discussion about onion prices.","姥姥跟着来旁听，一开口就拉着摊主掰扯葱价。",[["engage","engaged"]]],["While I tried to implement my polite script, she modified it to two blunt questions and demonstrated her version to everyone.","我还照着背好的礼貌模板说呢，她已经改成两句直球，当着所有人的面示范了一遍。",[["implement","implement"],["modify","modified"],["demonstrate","demonstrated"]]],["I was afraid I'd expose my accent, but the stallholder recognised Grandma and rounded down the price to facilitate the sale.","我怕自己暴露口音，摊主倒先认出姥姥，为了把生意做成，立刻给她抹了零。",[["expose","expose"],["recognize","recognised"],["facilitate","facilitate"]]],["The only phrase the tourists retained was in Mandarin: “Can you go any lower for a regular?”","游客最后只记住一句普通话：“熟人价还能再便宜点吗？”",[["retain","retained"]]]]],["我不犹豫，红包犹豫",[["Before New Year, I rehearsed ten different dinner scenarios to overcome my tendency to hesitate when making a toast.","过年前我排练了十种敬酒场景，想克服一举杯就犹豫的毛病。",[["scenario","scenarios"],["overcome","overcome"],["hesitate","hesitate"]]],["My assumption was that a few practised lines would make up for my lack of social competence.","我的设想是，背几句现成的话就能弥补我社交上的不熟练。",[["competence","competence"],["assumption","assumption"]]],["Mum was sceptical. She said I tended to misinterpret polite remarks.","我妈不太信。她说我总把人家的客套话当真。",[["skeptical","sceptical"],["misinterpret","misinterpret"]]],["I reflected on past dinners and repeated “Uncle, you're so generous” to reinforce the habit.","我反思了以前的年夜饭，决定反复练习“叔叔真大方”，把话说顺。",[["reflect","reflected on"],["reinforce","reinforce"]]],["Uncle embraced the compliment and put the red envelope back in his pocket. “Since you're so understanding, why stand on ceremony?”","叔叔欣然接受我的夸奖，顺手把红包塞回兜里。“你都这么懂事了，还客气什么？”",[["embrace","embraced"]]]]]],[["图书馆流行抢挂号",[["The university decided to allocate seats by floor to give everyone access to the library.","学校决定按楼层分座位，好让每个人都能用上图书馆。",[["allocate","allocate"],["access","access"]]],["Capacity was limited. There were adequate seats only after closing time.","馆里座位有限，只有闭馆以后才有足够的空位。",[["capacity","capacity"],["adequate","adequate"]]],["Someone challenged the main criterion. Empty classrooms seemed a good alternative that would benefit everyone.","有人质疑主要的分配标准。用空教室顶上，看着对谁都有好处。",[["challenge","challenged"],["criterion","criterion"],["alternative","alternative"],["benefit","benefit"]]],["The librarian said seat saving would happen in any context.","管理员说，换个地方照样有人占座。",[["context","context"]]],["I finally found somewhere I could concentrate: in the queue. I was there longer than I ever sat inside.","我终于找到一个能专心的地方，排队的时候。比我真正坐在馆里的时间长多了。",[["concentrate","concentrate"]]]]],["弹性下班是往后弹",[["Our office held an independent vote on a points system. The incentive was meant to enhance morale and reduce inequality.","公司独立办了次积分制投票，说奖励能鼓舞士气、缩小资源差距。",[["independent","independent"],["incentive","incentive"],["enhance","enhance"],["inequality","inequality"]]],["Every point was equivalent to a minute off work.","一个积分等于一分钟调休。",[["equivalent","equivalent"]]],["I tried to decline. My manager said he couldn't evaluate me unless I joined.","我打算婉拒。领导说我不参加，他就没法考核我。",[["decline","decline"],["evaluate","evaluate"]]],["The pilot expanded to the whole team within a week. My hours exceeded the limit straight away.","试点一个星期就扩展到全组，我的工时马上超了。",[["expand","expanded"],["exceed","exceeded"]]],["Our hours really were flexible: arrive an hour early and it's voluntary; arrive a minute late and it costs you.","上下班时间果然很弹性。早到一小时算自愿，晚到一分钟就扣钱。",[["flexible","flexible"]]]]],["取快递比取经难",[["The parcel shop had a new procedure. The first instruction was to read out the code; the second was to join a queue.","驿站出了新流程。第一步报取件码，第二步登记排队。",[["procedure","procedure"],["instruction","instruction"]]],["I had plenty of knowledge of parcel shops and still couldn't obtain my parcel.","我对驿站那一套可熟了，还是没能拿到快递。",[["knowledge","knowledge"],["obtain","obtain"]]],["A man showed me a better method. I participated in a small test run by the owner's corgi.","旁边有人教我一个更管用的方法。我参加了老板那只柯基主持的小测试。",[["method","method"],["participate","participated in"]]],["My performance with a dog biscuit earned me priority.","我喂饼干表现出色，拿到了优先取件资格。",[["performance","performance"],["priority","priority"]]],["“Safety is our primary concern,” said the owner. “The dog's judgement must outweigh your ID card.”","老板说：“安全第一嘛，所以狗的判断当然比身份证重要。”",[["primary","primary"],["outweigh","outweigh"]]]]],["选课审批像走红毯",[["You had to register first and then qualify for badminton based on your grades.","想抢羽毛球课，先登记，还得成绩够格。",[["register","register"],["qualify","qualify for"]]],["The course wasn't relevant to my degree, but court time was a scarce resource, so I had to revise my application.","课跟我的专业根本不沾边，但球场资源太紧张，我只好重写申请理由。",[["relevant","relevant"],["resource","resource"],["revise","revise"]]],["A survey found substantial demand for Friday classes.","教务处一调查，周五的课需求特别大。",[["survey","survey"],["substantial","substantial"]]],["The university restricted places and transferred half the class to eight in the morning.","学校就限制了名额，把一半的课挪到早上八点。",[["restrict","restricted"],["transfer","transferred"]]],["At last the system was stable. Nobody wanted to leave a warm bed to wave a racket before breakfast.","系统终于稳定了。毕竟为了早餐前挥两下拍子，谁也不想先跟热被窝告别。",[["stable","stable"]]]]],["报夜校送终身作业",[["To enrich her retirement, Mum decided to enrol in a class on using her phone.","为了丰富退休生活，我妈打算报个手机夜校。",[["enrich","enrich"],["enroll","enrol"]]],["The curriculum included digital literacy and video editing as a separate discipline.","课程包括数字素养，另外还单开了一门视频剪辑课。",[["curriculum","curriculum"],["literacy","literacy"],["discipline","discipline"]]],["Her mentor supplied numerous free worksheets.","老师还免费发了好多练习资料。",[["mentor","mentor"],["numerous","numerous"]]],["You needed valid ID. If you missed two classes, you had to withdraw. Tuition was free.","上课要带有效证件，缺课两次就得退出，学费全免。",[["valid","valid"],["withdraw","withdraw"],["tuition","tuition"]]],["I thought we'd got a bargain. Now she sends me thirty clips a day and expects a like and a review on every one.","我还以为白捡了个便宜。现在她每天发我三十条视频，每条都等着我点赞写评语。",[]]]]],[["爸的阳台农场",[["Dad said balcony agriculture was his answer to our environmental problems.","我爸说，家里的环保问题，就靠阳台种菜了。",[["agriculture","agriculture"],["environmental","environmental"]]],["We would consume less plastic, cut carbon emissions and get serious about water conservation.","我们会少用塑料、减少碳排放，还能认真搞一搞节水。",[["consume","consume"],["carbon","carbon"],["emission","emissions"],["conservation","conservation"]]],["Mum looked at the declining success rate and asked where the accumulating course fees had gone.","我妈看着越来越低的出苗率，问越交越多的培训费到底花哪儿了。",[["declining","declining"],["accumulate","accumulating"]]],["Dad said adaptation took time and the soil could degrade in the meantime.","我爸说适应新环境需要时间，其间土质还可能变差。",[["adaptation","adaptation"],["degrade","degrade"]]],["His tallest green shoot turned out to be a plastic straw he'd put in to check the water level.","他那棵长得最高的绿苗，其实是他插进去量水位的塑料吸管。",[]]]],["小区池塘先保住金鱼",[["After the rain, soil erosion sent brown water pouring into our goldfish habitat.","下雨后泥土被冲走，浑水直接灌进了小区金鱼池。",[["erosion","erosion"],["habitat","habitat"]]],["I estimated the impact of the rising water on the pond.","我估算了水位上涨会对池塘造成多大的影响。",[["estimate","estimated"],["impact","impact"]]],["The manager put down sandbags to limit the flow and mitigate the damage. We removed pollutants to maintain water quality.","物业摆上沙袋限制进水、减轻冲击。大家清走污染物，好维持水质。",[["limit","limit"],["mitigate","mitigate"],["pollutant","pollutants"],["maintain","maintain"]]],["The pump nearly exhausted its battery, but we preserved the pond.","水泵差点耗光了电池，不过池塘是保住了。",[["exhaust","exhausted"],["preserve","preserved"]]],["Then the art teacher netted the fish. They were floating props she'd made for class.","接着美术老师一网把金鱼捞走了。那几条是她上课做的漂浮道具。",[]]]],["雨天共享伞赔了钱",[["The shop started lending umbrellas to absorb the extra foot traffic and build a more sustainable business.","楼下小店开始借伞，想接住下雨天多出来的客流，把生意做长久。",[["absorb","absorb"],["sustainable","sustainable"]]],["Rain was abundant, so he sold renewable monthly memberships.","雨水多得很，他干脆卖起可以续费的借伞月卡。",[["abundant","abundant"],["renewable","renewable"]]],["He used a ledger to regulate loans and a second counter to accelerate the handover.","他用账本规范借还，又加了个窗口提高交伞速度。",[["regulate","regulate"],["accelerate","accelerate"]]],["He assessed the adverse impact of missing umbrellas and felt confident about the shop's resilience.","他评估了伞不归还的坏处，对店里扛得住这件事挺有信心。",[["adverse","adverse"],["resilience","resilience"]]],["The real threat arrived the next day. A neighbour donated every umbrella she'd bought for her ex. He abandoned the business: the return rate was too high.","真正的威胁第二天才到。邻居把给前任买过的伞全捐了。老板决定不干了，伞的回头率实在太高。",[["threat","threat"],["abandon","abandoned"]]]]],["天台今天预报洗猫",[["Our estate checked the forecast for signs of drought.","小区看天气预报，想知道会不会闹旱。",[["forecast","forecast"],["drought","drought"]]],["We built irrigation infrastructure on the roof to cultivate several vegetables.","我们在天台搞了套灌溉设施，打算种几种蔬菜。",[["irrigation","irrigation"],["infrastructure","infrastructure"],["cultivate","cultivate"]]],["We wanted to support biodiversity, improve the local ecology and make space for food-waste disposal.","我们想保护生物多样性、改善小区生态，顺便腾个角落处理厨余。",[["biodiversity","biodiversity"],["ecology","ecology"],["disposal","disposal"]]],["The panels generate power. Water is scarce, so every spray is timed.","太阳能板发电。水不多，所以每次喷水都定了时。",[["generate","generate"],["scarce","scarce"]]],["Our vegetables stayed dry. The neighbourhood cats now show up at seven every morning for a spa treatment.","菜一点没浇到。小区猫倒是每天早上七点准时报到，来做水疗。",[]]]],["二十块的可食用屋顶",[["People on an urban rooftop started a garden to make lunch more affordable.","城里一栋楼的居民上屋顶种菜，想让午饭便宜点。",[["urban","urban"],["affordable","affordable"]]],["They recycle water from washing vegetables, compost food scraps and avoid pesticides.","他们循环用洗菜水，拿厨余堆肥，也不打农药。",[["recycle","recycle"],["compost","compost"],["pesticide","pesticides"]]],["They worried that fumes might contaminate the leaves, the seedlings were vulnerable, and the sun would deplete the soil's moisture.","他们担心油烟弄脏菜叶，怕小苗太脆弱，也怕太阳把土里的水分晒干。",[["contaminate","contaminate"],["vulnerable","vulnerable"],["deplete","deplete"]]],["The only thing that might have a severe impact was the effect on the food seller's livelihood downstairs.","唯一可能受重创的，其实是楼下卖饭那位的生计。",[["severe","severe"],["livelihood","livelihood"]]],["He started buying his greens upstairs. At twenty yuan a jin, he could serve the same organic leaves with three different meals.","后来卖饭的上楼进货。二十块一斤的有机菜叶，他一天能当三顿饭的配菜。",[]]]]],[["食堂阿姨要退了",[["An anonymous account posted a fragment of a voice note in our class group: “Our old workhorse is retiring.”","班群里一个匿名账号发来一小段语音：“咱们这位老伙计要退休了。”",[["anonymous","anonymous"],["fragment","fragment"]]],["The campus gossip platform put it up with the caption “Farewell to Our Favourite Dinner Lady”.","校园八卦平台一转发，配文就成了《告别我们最爱的食堂阿姨》。",[["platform","platform"],["caption","caption"]]],["A screenshot started circulating, and the algorithm even showed it to the dinner lady herself.","截图很快传开了，算法甚至把它推给了食堂阿姨本人。",[["circulate","circulating"],["algorithm","algorithm"]]],["An audience packed the serving counter. Campus media went live, and the commentary exaggerated the news into a school-wide food crisis.","食堂窗口围满了看热闹的人。校园媒体开了直播，解说到最后，仿佛全校都要断粮。",[["audience","audience"],["media","media"],["commentary","commentary"],["exaggerate","exaggerated"]]],["She lifted a lid and said, “The wok is retiring. The braised pork is still on.”","阿姨掀开锅盖：“退休的是锅。红烧肉照卖。”",[]]]],["晚上十点，楼下见",[["Our class rep texted, “Downstairs at ten tonight.” It was an ambiguous message, to be fair.","班长发来一句：“今晚十点，楼下见。”说实话，这话挺容易让人想多。",[["ambiguous","ambiguous"]]],["My roommate interpreted it as a confession. She heard a romantic connotation in the full stop, a nuance I'd apparently missed.","室友认定这是表白。连句号她都读出了暧昧，说我没品出那层微妙的意思。",[["interpret","interpreted"],["connotation","connotation"],["nuance","nuance"]]],["I tried to verify her theory with our most reliable source, the dorm supervisor. “Credible enough,” she said.","我去找最靠谱的消息来源宿管阿姨求证。她说：“倒不是没可能。”",[["verify","verify"],["reliable","reliable"],["credible","credible"]]],["We analysed the data in the log at the dorm entrance.","我们把宿舍门口登记簿里的记录挨个分析了一遍。",[["analyze","analysed"],["data","data"]]],["One clue finally emerged: the class rep had rescued my sheet from the washer and wanted me to hang it up.","终于有了条线索：班长把我忘在洗衣机里的床单捞出来了，叫我下楼自己晾。",[["emerge","emerged"]]]]],["外卖柜抓贼",[["The takeaway locker kept rattling. I checked the archive and filtered the footage by time to automate my search for a thief.","外卖柜老是响。我翻了录像存档，按时间筛选，打算让系统自动替我抓贼。",[["archive","archive"],["filter","filtered"],["automate","automate"]]],["The software threw an error, so I grabbed an old device to detect movement.","软件报错，我就翻出一台旧设备来检测动静。",[["error","error"],["device","device"],["detect","detect"]]],["The hairdryer next door was interfering with the signal. We changed the channel and kept monitoring the locker.","隔壁吹风机一直干扰信号，我们换了个频道，继续盯着柜子。",[["interfere","interfering"],["channel","channel"],["monitor","monitoring"]]],["Two hours later I realised my phone had been transmitting the video to Mum the whole time.","过了两个小时，我才发现手机一直在把画面传给我妈。",[["transmit","transmitting"]]],["“You didn't catch a thief,” she said. “I did catch you ordering nothing but braised chicken all term.”","她说：“贼你没抓到，我倒看出来，你这学期点来点去全是黄焖鸡。”",[]]]],["语音到底发给谁",[["Mum said the voice note was confidential and asked me to respect the recipient's privacy.","妈妈说那条语音是保密的，让我尊重收件人的隐私。",[["confidential","confidential"],["privacy","privacy"]]],["I heard an excerpt: “You've lost weight again, poor thing.” It nearly misled me into thinking she had a secret boyfriend.","我听到一小段：“你又瘦了，我好心疼。”我差点以为她背着我爸谈恋爱了。",[["excerpt","excerpt"],["mislead","misled"]]],["She got Dad's consent before agreeing to disclose the recipient's identity.","她征得我爸同意，才肯告诉我，对面究竟是谁。",[["consent","consent"],["disclose","disclose"],["identity","identity"]]],["Listening carefully, I could distinguish a small bark at the end.","我仔细一听，才从末尾分辨出很轻的一声汪。",[["distinguish","distinguish"]]],["Mum clarified at once: “Don't distort what I said. I was talking the dog into eating two more bites.”","我妈赶忙澄清：“别曲解我的意思，我是在哄狗再吃两口。”",[["clarify","clarified"],["distort","distort"]]]]],["电梯办卡点",[["To improve accessibility, building management distributed new rules for the lift.","为了让大家出入更方便，物业给住户发了新的电梯规定。",[["accessibility","accessibility"],["distribute","distributed"]]],["You had to insert a card to make it work, a change that staff said would enable safer access.","想坐电梯，得先插卡。物业说这能让进出更安全。",[["insert","insert"],["enable","enable"]]],["Someone cited a regulation in the chat. Someone else wrote a whole editorial about the bias in favour of younger residents.","业主群里有人引用了一条规定，也有人写了一整篇评论，批评新规只照顾年轻人。",[["cite","cited"],["editorial","editorial"],["bias","bias"]]],["The neighbourhood committee held a meeting to communicate the details and convey its concern for older people.","居委会专门开了个会，把规定讲清楚，也表达一下对老人的关心。",[["communicate","communicate"],["convey","convey"]]],["Everyone ignored the last line of the notice: “Collect your lift card at the management office, eighth floor.”","大家都漏看了通知最后一行：“电梯卡请到八楼物业办公室领取。”",[["ignore","ignored"]]]]]],[["兼职群最新岗位",[["Staff turnover at the milk tea shop was so high that its workforce consisted of one manager and a vacancy sign.","奶茶店的人换得太快，到最后，全店只剩一个店长和一块“招聘中”的牌子。",[["turnover","turnover"],["workforce","workforce"],["vacancy","vacancy"]]],["He recruited in a part-time jobs group, advertised a competitive hourly rate and finally hired me.","他去兼职群招人，说时薪很有竞争力，终于把我招来了。",[["recruit","recruited"],["competitive","competitive"],["hire","hired"]]],["I turned up for my first shift with my contract and asked what to put down as my occupation.","第一天上班，我带着合同来了，问职业一栏该填什么。",[["contract","contract"],["occupation","occupation"]]],["“You're our only employee,” he said. “Put ‘deputy manager’.”","他说：“你是店里唯一的员工，填‘副店长’吧。”",[["employee","employee"]]],["“As for your travel allowance, run here from home and count it as exercise.”","“至于交通补贴，你每天从家跑过来，正好算锻炼。”",[["allowance","allowance"]]]]],["我有充分自主权",[["On my first day as an intern, management assigned me twelve group chats. I had full autonomy over which one to answer first.","实习第一天，管理层把十二个群交给了我。我有充分的自主权，想先回哪个群都行。",[["management","management"],["assign","assigned"],["autonomy","autonomy"]]],["I tried to delegate half of them to my desk mate. She told me to coordinate them myself.","我想分一半给旁边的同事，她让我自己协调。",[["delegate","delegate"],["coordinate","coordinate"]]],["I made a shortcut to be more efficient. Engagement shot up across all twelve chats.","为了提高效率，我设了快捷回复。十二个群一下子都热闹起来了。",[["efficient","efficient"],["engagement","engagement"]]],["The next bit was predictable. My boss praised my productivity and gave me my neighbour's workload as well.","接下来的事一点也不意外。领导夸我效率高，顺手把隔壁同事的工作也给了我。",[["predictable","predictable"],["productivity","productivity"],["workload","workload"]]]]],["整栋楼都喝不下了",[["I worked for a small firm and had an appointment to discuss a corporate catering order.","我替一家小公司办事，那天约了客户谈一笔企业订餐单。",[["firm","firm"],["corporate","corporate"],["appointment","appointment"]]],["A big corporation was making a demanding request: three hundred milk teas, with the budget still unapproved.","对方是家大公司，要求倒不低：三百杯奶茶，预算还没批。",[["corporation","corporation"],["demanding","demanding"]]],["I checked our expenditure and profit margin and went to negotiate. Who had the authority to approve the price?","我算了开支和利润率，去跟采购谈。他们那儿到底谁有权拍板定价？",[["expenditure","expenditure"],["margin","margin"],["negotiate","negotiate"],["authority","authority"]]],["“Put it on our tab,” he said. “We'll compensate you tomorrow with gifts from our team outing.”","他说：“今天先赊账。明天用团建礼物补偿你们。”",[["compensate","compensate"]]],["The gifts arrived the next day: three hundred vouchers for the rival milk tea shop downstairs.","第二天礼物到了：楼下另一家奶茶店的三百张优惠券。",[]]]],["全自动凉菜桌",[["My uncle wanted me to collaborate on an innovation at his restaurant: automation for the table's serving tray.","舅舅找我给他的小饭馆搞创新，要让桌上的转盘自己转。",[["innovation","innovation"],["collaborate","collaborate"],["automation","automation"]]],["He found an apprentice who specialised in repairing fans.","他找了个专门修风扇的学徒。",[["apprentice","apprentice"],["specialise","specialised"]]],["We used his expertise to assemble the turning mechanism.","靠那小伙子的手艺，我们装好了转盘的传动装置。",[["expertise","expertise"],["assemble","assemble"],["mechanism","mechanism"]]],["The family praised my uncle's initiative until they saw me crouching underneath to turn the tray by hand.","全家都夸舅舅有想法，直到看见我蹲在桌底下，拿手给他们推转盘。",[["initiative","initiative"]]],["My uncle handled the cash. I was the manual labour behind the automatic table.","舅舅负责收钱。我就是这张全自动餐桌里那个得出力的人。",[["labour","labour"]]]]],["老板说再接再厉",[["In the interns' chat, the personnel department announced plans to institute a new benchmark: our clock-out times.","人事在实习群发通知，说要设一个新评判标准，就是大家的下班时间。",[["personnel","personnel"],["institute","institute"],["benchmark","benchmark"]]],["The idea was apparent. Whoever stayed the longest had the best chance of a promotion.","意思明摆着。谁坐到最晚，谁最有机会升职。",[["apparent","apparent"],["promotion","promotion"]]],["Someone said they might change profession. I logged my late nights to show commitment.","有人说干脆转行。我倒每天记着几点走，好证明自己有多投入。",[["profession","profession"],["commitment","commitment"]]],["My boss called the log redundant. “The only person who can compete with you is the security guard.”","领导说我那张表多余了：“能跟你比谁走得晚的，就那位保安。”",[["redundant","redundant"],["compete","compete"]]],["“And he's an entrepreneur now. He sells you dinner every night.”","“他倒顺便创了个业。每天晚上卖你一份宵夜。”",[["entrepreneur","entrepreneur"]]]]]],[["早睡群睡得最晚的人",[["Our dorm started an early-bedtime chat for our wellbeing. I joined on impulse. My motivation was milk tea, paid for by whoever came last.","我们宿舍为身心健康建了个早睡群。我一时冲动报了名，想着垫底的人得请大家喝奶茶。",[["wellbeing","wellbeing"],["impulse","impulse"],["motivation","motivation"]]],["My roommate's attitude was positive, on one condition: we had to post a screenshot every night.","室友很赞同，条件只有一个：每天晚上都得发截图打卡。",[["attitude","attitude"],["condition","condition"]]],["In week one, the prevalence of perfect scores was astonishing. Our group leader's bedtime was especially consistent.","第一周满分的人多得吓人。尤其群主，每天就寝时间都差不多。",[["prevalence","prevalence"],["consistent","consistent"]]],["I watched his behaviour and realised he'd made a habit of going to bed at ten.","我观察了几天才发现，他每天十点睡已经成了习惯。",[["behaviour","behaviour"],["habit","habit"]]],["The rest of us stayed up until midnight, in a state of mounting anxiety about who'd forget the screenshot.","剩下我们几个每晚熬到十二点，盯着看谁忘打卡，越盯越焦虑。",[["anxiety","anxiety"]]]]],["我真的有在补充营养",[["After three late nights studying for finals, I was conscious that my cognitive skills were slipping.","为了期末连熬三晚，我能感觉到脑子越来越不好使了。",[["conscious","conscious"],["cognitive","cognitive"]]],["One symptom of fatigue was putting my student card on my tray and a bread roll in my pocket.","有一回累得直犯迷糊，把饭卡放餐盘上，把面包塞进了兜。",[["fatigue","fatigue"],["symptom","symptom"]]],["My hunger was persistent and my appetite was fine. When my roommate asked about my nutrition, I said, “Coffee.”","我倒是一直饿，也挺有胃口。室友问我靠什么补充营养，我说：“咖啡。”",[["persistent","persistent"],["appetite","appetite"],["nutrition","nutrition"]]],["She said our kitchen was in complete disorder and she now feared for my physical safety.","她说厨房已经乱成一团，现在连我的人身安全都让她担心。",[["disorder","disorder"],["physical","physical"]]],["For the sake of my mental health, she quietly turned the menu to the children's section.","为了保护我的心理健康，她默默把菜单翻到了儿童餐那页。",[["mental","mental"]]]]],["快递不响我也去看",[["One buzz from my phone was enough of a stimulus. It triggered a compulsion to check my parcel tracking.","手机稍微一震，我就像受了刺激一样，非要查一下快递到哪儿了。",[["stimulus","stimulus"],["trigger","triggered"],["compulsion","compulsion"]]],["I was particularly susceptible to the words “Delivered”. After enough exposure to that alert, I could hear it even in silence.","我对“已送达”三个字尤其没抵抗力。那提示音听多了，没响我也觉得响了。",[["susceptible","susceptible"],["exposure","exposure"]]],["The intensity of that little thrill eventually pushed me past my threshold for embarrassment.","这点儿兴奋越来越强，强到我已经顾不上自己看起来有多好笑了。",[["intensity","intensity"],["threshold","threshold"]]],["My roommate observed me for a day. She thought it might imply impatience and told me to diagnose the problem.","室友观察我一整天，说我可能缺乏耐心，让我好好找找病因。",[["observe","observed"],["imply","imply"],["diagnose","diagnose"]]],["I found it. The parcel contained a stress-relief toy.","病因找到了。我买的是件解压玩具。",[]]]],["小区运动冠军是个轮子",[["Our residents' chat launched a step contest to prevent our sedentary neighbours from spending prolonged periods sitting still.","业主群搞了个步数比赛，想让那些一坐就坐半天的邻居多起来走走。",[["sedentary","sedentary"],["prevent","prevent"],["prolonged","prolonged"]]],["My perception was that the winner must have strong legs, so I sought her advice.","我觉得冠军肯定腿厉害，就跑去向她请教。",[["perception","perception"],["seek","sought"]]],["The champion, it turned out, was completely immune to sore legs.","后来才知道，冠军对腿酸完全免疫。",[["immune","immune"]]],["An intervention by property management revealed the trick. Grandma thought walking after dark was a risk, so she strapped her tracker to the robot vacuum.","物业一介入，真相大白。奶奶觉得夜路不安全，就把手环绑扫地机器人身上了。",[["intervention","intervention"],["risk","risk"]]],["One consequence was that the neighbours learnt to cope with dust, if nothing else. Their floors had never looked cleaner.","邻居最后至少学会一件事：怎么对付灰尘。家里的地从来没这么干净过。",[["consequence","consequence"],["cope","cope"]]]]],["失恋康复要互助",[["After my roommate's breakup, I tried to show empathy and gave her the royal treatment.","室友一失恋，我就想多体谅她一点，先给她安排了贵宾待遇。",[["empathy","empathy"],["treatment","treatment"]]],["Milk tea therapy was the first stage of rehabilitation.","康复的第一步就是奶茶疗法。",[["therapy","therapy"],["rehabilitation","rehabilitation"]]],["To reduce her distress, I tried to distract her with gossip and told her to resist checking her ex's posts.","为了让她好受点，我讲八卦转移她的注意，还劝她忍住别翻前任朋友圈。",[["reduce","reduce"],["distract","distract"],["resist","resist"]]],["She said it helped improve her mood and foster our friendship.","她说这么做能让她心情好一点，也让咱俩的友谊更牢固。",[["improve","improve"],["foster","foster"]]],["Her tolerance ran out when I asked to split the bill. “You and my ex would get along. You both bring up money at the end.”","我一提奶茶钱平摊，她就忍到头了：“你和他挺配，都喜欢到最后才提钱。”",[["tolerance","tolerance"]]]]]],[["月租涨了，采光还是老样子",[["The moment the metro opened, my landlord said his property had gone up in value.","地铁一开，房东就说他那套房升值了。",[["landlord","landlord"],["property","property"]]],["There's a housing shortage and demand is high, so he can raise the rent enough to displace longtime tenants.","房源这么少，想租的人这么多，他大可以把租金涨到老租客住不下去。",[["shortage","shortage"],["demand","demand"],["displace","displace"]]],["I checked my budget. I couldn't afford the new rent, and moving would be a burden too.","我算了算预算。新房租我付不起，搬家也是个负担。",[["budget","budget"],["afford","afford"],["burden","burden"]]],["I already felt insecure about where I'd be living, and there he was, explaining the disparity between rents and wages.","我连接下来住哪儿都不踏实，他倒给我讲起了租金和工资之间的差距。",[["insecure","insecure"],["disparity","disparity"]]],["I asked what the extra five hundred yuan got me.","我问，多付五百块能换来什么。",[]],["He turned up the brightness on the listing photo and said, \"Better light.\"","他把房源照片调亮了点，说：「采光更好。」",[]]]],["买一送一，送的是教训",[["Mum calls herself a frugal consumer and never buys anything at full price.","我妈自称勤俭持家的消费者，买东西从不付原价。",[["frugal","frugal"],["consumer","consumer"]]],["Last night she bought four things for the discount, then used loyalty points as currency for the final transaction.","昨晚她为了凑折扣连买四件，最后一笔还用积分抵了钱。",[["discount","discount"],["transaction","transaction"],["currency","currency"]]],["She recorded the purchase in the household accounts and called it financial planning.","她把这笔购物记进家庭账本，说这叫理财。",[["purchase","purchase"],["household","household"],["financial","financial"]]],["I checked her income, saw the deficit and asked how much she'd saved.","我看了看她的收入和账上的缺口，问她到底省下多少。",[["income","income"],["deficit","deficit"]]],["\"Nothing,\" she said. \"But I've got a voucher for next month.\"","她说：「一分没省，不过拿到了一张下个月的券。」",[]]]],["奶茶店的第一笔回报",[["My flatmate said a bubble tea shop would be lucrative, so he emptied his travel fund to make his first investment.","室友说开奶茶店有利可图，就把旅游攒的钱全当成第一笔投资投进去了。",[["lucrative","lucrative"],["fund","fund"],["investment","investment"]]],["He borrowed money to finance the shop, offered to manufacture his own cup sleeves, and arranged a supply of tea from downstairs.","他借钱筹资，打算自己做杯套，又跟楼下谈妥了茶叶供应。",[["finance","finance"],["manufacture","manufacture"],["supply","supply"]]],["Before the place was even ready, he started to market it on WeChat.","店还没装修完，他就先在朋友圈打起了广告。",[["market","market"]]],["The first day brought in some revenue. His plan had managed to yield a return.","第一天竟然有了进账，他的计划还真见到回报了。",[["revenue","revenue"],["yield","yield"]]],["I asked how much profit he'd made. \"Hang on,\" he said. \"My only customer wants a refund.\"","我问他赚了多少。他说：「等会儿，我唯一的顾客正在要退款。」",[["profit","profit"]]],["The customer was his mother.","那位顾客就是他妈。",[]]]],["救摊方案",[["The town had slipped into an economic recession, and the breakfast shop was close to bankruptcy.","当地经济不景气，早餐铺眼看就要撑不下去了。",[["economic","economic"],["recession","recession"],["bankruptcy","bankruptcy"]]],["A local agency set up a relief scheme with welfare for struggling families and a subsidy for small shops.","社区机构推出帮扶方案，有困难的家庭能领福利，小店可以申请补贴。",[["agency","agency"],["scheme","scheme"],["welfare","welfare"],["subsidy","subsidy"]]],["The owner listed his domestic expenses and tax bills but missed the new stall fee levied by the property management company.","老板把家用开支和税费都列上了，偏偏漏掉物业新收的摊位费。",[["domestic","domestic"],["tax","tax"],["levy","levied"]]],["When the subsidy came in, he did the sums again.","补贴一到账，他又算了一遍。",[]],["\"Could've saved us all the paperwork and sent the application straight to the property office.\"","「早知道就把表直接交给物业，省得大家填来填去。」",[]]]],["鸡蛋没涨，冰柜赚了",[["Egg prices at the market began to fluctuate, and bulk buying became a trend.","菜市场的鸡蛋价格开始上下波动，团购也成了风潮。",[["fluctuate","fluctuate"],["trend","trend"]]],["The shopkeeper downstairs secured a monopoly on the local supply and started treating eggs like a commodity. He told everyone inflation was coming.","楼下的老板把这片的货源都攥在了手里，把鸡蛋当大宗商品炒。他跟谁都说通胀要来了。",[["monopoly","monopoly"],["commodity","commodity"],["inflation","inflation"]]],["He spent a good proportion of his income stockpiling eggs. His best asset was a chest freezer that could accommodate two hundred cartons.","他拿出收入里不小的一部分囤鸡蛋。他最值钱的家当是台大冰柜，能装两百盒。",[["proportion","proportion"],["asset","asset"],["accommodate","accommodate"]]],["He planned to lift himself out of poverty with eggs. In the end, to recover his costs, he sold the whole freezer to the ice-lolly seller next door.","他本想靠鸡蛋摆脱贫困。最后为了收回本钱，把整台冰柜卖给了隔壁卖冰棍的。",[["poverty","poverty"],["recover","recover"]]]]]],[["小区里谁半夜练鼓",[["The quietest resident in our community suddenly found herself at the centre of a conflict.","我们小区最安静的那位住户，突然被卷进了一场争吵。",[["community","community"],["resident","resident"],["conflict","conflict"]]],["There was widespread agreement in the group chat that the midnight drumming was her doing. The dominant theory was that her whole generation loved making noise.","群里普遍认定半夜的鼓声是她弄的。最流行的说法是，她们那一代人就爱闹腾。",[["widespread","widespread"],["dominant","dominant"],["generation","generation"]]],["Once that stereotype took hold, only a minority of neighbours thought to ask her.","成见一传开，只有少数邻居想到去问她本人。",[["stereotype","stereotype"],["minority","minority"]]],["From her perspective, asking the person involved should have been the norm.","在她看来，有疑问直接找当事人，本来就是最正常不过的事。",[["perspective","perspective"],["norm","norm"]]],["We finally leaned out the window. The star drummer was a loose screw in the air conditioner downstairs.","最后大家趴到窗边一看，打鼓打得最稳的，是楼下空调外机上一颗松掉的螺丝。",[]]]],["物业开会禁止发言",[["The management office's new policy said only people named on a property deed were eligible to vote.","物业推出新规定，房本上有名字的人才有资格投票。",[["policy","policy"],["eligible","eligible"]]],["That barrier immediately excluded half the building.","一道门槛，半栋楼的人一下就被排除在外。",[["barrier","barrier"],["exclude","excluded"]]],["Renters had no representation and had to fill in three forms just to get a taste of the bureaucracy.","租客没有代表，还得填足三张表，才能领教一下手续有多繁琐。",[["representation","representation"],["bureaucracy","bureaucracy"]]],["Someone asked for an equal chance to speak, and the debate made it onto social media.","有人要求平等的发言机会，辩论还闹到了社交媒体上。",[["equal","equal"],["debate","debate"],["social","social"]]],["Management made the minutes public. They said, in full, \"We listened carefully.\"","物业把会议纪要公开了。全文只有四个字：「充分听取。」",[["public","public"]]]]],["夜市遇见老乡",[["Our night-market stallholder had a migration story. He had moved from a rural town and hired an immigrant to help him out.","夜市摊主也有段搬家的经历。他从乡下搬来，还雇了一位外籍移民帮忙。",[["rural","rural"],["migration","migration"],["immigrant","immigrant"]]],["Mum said we could finally expect a more diverse menu, then looked up the demographic makeup of the market.","我妈说这下能吃到更多不同口味的东西了，又一脸认真地查起夜市都有些什么人。",[["diverse","diverse"],["demographic","demographic"]]],["She wanted to know all about its ethnic and cultural diversity, including where the recipes might have come from.","她想把这里不同族群和文化的情况都弄清楚，连菜谱可能来自哪里都要研究。",[["ethnic","ethnic"],["cultural","cultural"],["diversity","diversity"]]],["She asked about the owner's affiliation with a local food club. I asked if it was ethical to quiz him like that.","她还打听老板跟本地哪个美食社团有关系。我问她，当面这么盘问人家合适吗。",[["affiliation","affiliation"],["ethical","ethical"]]],["\"My name's Ma,\" the owner replied in our dialect. \"I'm from your village.\"","老板用我们的家乡话回了句：「我姓马，跟您一个村。」",[]]]],["坡道没造，指示牌先上岗",[["We found volunteers for an accessibility project. Neighbours set up a mutual aid group and organised collective action.","大伙找了志愿者做无障碍改造，邻居们组了个互助小组，一起想办法。",[["volunteer","volunteers"],["mutual","mutual"],["collective","collective"]]],["We wanted to advocate for wheelchair users and integrate them more fully into community events.","我们想替轮椅使用者发声，让他们能更好地参与社区活动。",[["advocate","advocate"],["integrate","integrate"]]],["The civic proposal called the current arrangements institutional discrimination and asked for justice.","这份居民提案指出，现有做法存在制度性歧视，大家得讨个公道。",[["civic","civic"],["institutional","institutional"],["discrimination","discrimination"],["justice","justice"]]],["At the final inspection, the improvement turned out to be marginal.","到了验收那天，才发现改进微乎其微。",[["marginal","marginal"]]],["The ramp was still on the drawing board. The sign pointing to it was already up.","坡道还在图纸上，指向坡道的牌子倒早就立好了。",[]]]],["居委会拍全家福",[["A concerned citizen suggested we abolish the usual rules about where to stand in the street photo. We reached a consensus straight away.","一位热心居民建议取消老街合照的排位老规矩，大家一下子就达成了共识。",[["citizen","citizen"],["abolish","abolish"],["consensus","consensus"]]],["That meant equality for kids and older neighbours alike. Nobody had to conform to some official idea of how to pose.","小孩跟老人一样，都能平等地站到好位置。至于怎么摆姿势，谁也不用按统一要求来。",[["equality","equality"],["conform","conform"]]],["We hoped the photo would build social cohesion and preserve our traditions and heritage as a legacy for the next generation.","我们想借这张照片让街坊更团结，也把老街的传统和文化留给以后的人。",[["cohesion","cohesion"],["tradition","traditions"],["heritage","heritage"],["legacy","legacy"]]],["We ended up using the plural in the caption. The three VIPs right in the middle were cats.","最后，照片说明里特意用了复数。因为站正中间的三位贵宾，是三只猫。",[["plural","plural"]]]]]],[["楼上晚上十二点开始拖椅子",[["I logged the midnight anomaly at a specific time, 12:03, though that was only approximate.","我把半夜的怪声记在了一个具体时间，十二点零三分，其实也就大概那个点。",[["anomaly","anomaly"],["specific","specific"],["approximate","approximate"]]],["The recording was accurate enough to establish the sequence. There were two discrete scraping noises.","录音够清楚，能听出前后顺序。拖拉声有两下，隔得很开。",[["accurate","accurate"],["sequence","sequence"],["discrete","discrete"]]],["I was quick to associate the sound with the flat upstairs. My roommate called that a controversial theory.","我马上把声音跟楼上的住户联系起来。室友说，这个猜测可不好说。",[["associate","associate"],["controversial","controversial"]]],["To stay objective and clear up some uncertainty, we sat by the door and waited.","为了尽量客观，也弄清那些拿不准的地方，我们就蹲在门口等着。",[["objective","objective"],["uncertainty","uncertainty"]]],["Sure enough, his robot vacuum came to life on schedule and pushed a stool from the living room into the hall.","果然，室友的扫地机器人准点出动，把小板凳从客厅一路推到了玄关。",[]]]],["外卖迟到了五分钟",[["My roommate tried to define his delivery problem. One constraint was that he placed just one order per day.","室友琢磨外卖为什么总迟到。有个限制是，他一天就点一单外卖。",[["define","define"],["constraint","constraint"]]],["He built a tracking framework, adjusted his experimental order times and controlled the other variables.","他搭了个记录框架，调整测试用的下单时间，同时把其他变量控制住。",[["framework","framework"],["adjust","adjusted"],["experimental","experimental"],["variable","variables"]]],["Using his usual wait as a baseline, he measured delivery times for five days.","他把平常的等待时间当基准，连测了五天的送餐用时。",[["baseli
